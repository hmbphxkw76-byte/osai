[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-kit"
version = "0.1.0"
description = "Shared AI reconnaissance module for OSAI pipeline projects (PyRIT + Garak)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "OSAI Project"},
]
keywords = ["ai-security", "red-team", "reconnaissance", "llm", "mcp", "rag", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "httpx>=0.24",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
playwright = [
    "playwright>=1.40",
]
ml = [
    "scikit-learn>=1.3",
    "fastembed>=0.2",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120
