# P0-2-F: 声明式探测包 — LLM/OpenAI 兼容端点
# 将原本硬编码在 llm_probe / openai_compat_probe 中的端点探测迁移为 YAML。
probes:
  - name: openai_models_list
    description: Detect OpenAI-compatible /v1/models endpoint
    interface: llm-model-list
    requests:
      - path: /v1/models
        method: GET
    match:
      status_code: 200
      json_path:
        .data: "~."   # data 字段存在且为非空数组

  - name: openai_chat_completions
    description: Detect OpenAI-compatible chat completions endpoint
    interface: llm-chat
    requests:
      - path: /v1/chat/completions
        method: POST
        body: '{"model":"probe","messages":[{"role":"user","content":"ping"}],"max_tokens":1}'
    match:
      body_contains:
        - "error"
      json_path:
        .error: "~."   # 返回结构化 error 即表明端点存在 (认证/配额类)

  - name: ollama_tags
    description: Detect Ollama /api/tags endpoint
    interface: llm-model-list
    requests:
      - path: /api/tags
        method: GET
    match:
      status_code: 200
      json_path:
        .models: "~."   # models 数组存在

  - name: openai_compatible_ping
    description: Detect generic OpenAI-compatible respond shape
    interface: llm-chat
    requests:
      - path: /v1/completions
        method: POST
        body: '{"model":"probe","prompt":"ping","max_tokens":1}'
    match:
      body_contains:
        - "choices"
