# Agent framework probe pack: OpenAI Agents SDK / Swarm
# Non-LLM declarative YAML — consumed by ProbePackProbe via probe_pack_engine.
probes:
  - name: openai_agents_sdk_import
    description: Detect OpenAI Agents SDK in JS/Python bundles
    interface: agent-openai-agents
    requests:
      - path: /__probe_placeholder__
        method: GET
    match:
      body_contains:
        - "openai-agents"
        - "openai_agents"
        - "from agents import"

  - name: openai_agents_swarm
    description: Detect OpenAI Swarm multi-agent orchestration
    interface: agent-openai-swarm
    requests:
      - path: /__probe_placeholder__
        method: GET
    match:
      body_contains:
        - "openai-swarm"
        - "Swarm"
        - "handoff"

  - name: openai_agents_tracing
    description: Detect OpenAI Agents SDK tracing endpoint
    interface: agent-openai-agents
    requests:
      - path: /__probe_placeholder__/traces
        method: GET
    match:
      body_contains:
        - "trace"
        - "span"
        - "agent"

  - name: openai_agents_guardrails
    description: Detect OpenAI Agents SDK guardrail config
    interface: agent-openai-agents
    requests:
      - path: /__probe_placeholder__/guardrails
        method: GET
    match:
      body_contains:
        - "input_guardrail"
        - "output_guardrail"
        - "GuardrailFunctionOutput"

  - name: openai_agents_tools
    description: Detect OpenAI Agents SDK tool decorator patterns
    interface: agent-openai-agents
    requests:
      - path: /__probe_placeholder__
        method: GET
    match:
      body_contains:
        - "@function_tool"
        - "FunctionTool"
        - "RunContext"
