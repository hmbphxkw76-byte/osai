name: spec-gate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pyrit-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev deps
        run: pip install -e ".[dev]"
      - name: Run unified dev gate
        run: python -m tools.gate
        # 默认 stage=all：ruff + guard + registry + drift + data-flow
