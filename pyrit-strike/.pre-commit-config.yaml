# PyRIT-Strike Pre-commit Hooks — 规则强制执行
#
# 本项目位于 git 仓库的子目录 pyrit-strike/ 中。
# pre-commit 在仓库根目录运行，因此 entry 命令中使用 pyrit-strike/ 前缀。
# 所有 hooks 使用 language: system，依赖本地安装的 python/ruff/pytest。
#
# 安装 (在 pyrit-strike 目录中运行):
#   cd pyrit-strike
#   pre-commit install
#
# 手动运行:
#   pre-commit run --all-files

repos:
  - repo: local
    hooks:
      # ── R4: ruff 代码风格检查 ──
      - id: ruff
        name: ruff (code style + import sort)
        entry: ruff check --fix pyrit-strike/pipeline/ pyrit-strike/tests/ pyrit-strike/main.py pyrit-strike/run_strike.py pyrit-strike/run_batch.py pyrit-strike/run_web_vuln.py pyrit-strike/pipeline_guard.py
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      # ── R1+R2+R3+R5: pipeline_guard 规则守卫 (含根目录检查) ──
      - id: pipeline-guard
        name: pipeline_guard (rule enforcement)
        entry: python pyrit-strike/pipeline_guard.py --fix-suggest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      # ── R4: pytest 全量测试 ──
      # -c 指定 pyproject.toml 让 pytest rootdir 正确设为 pyrit-strike/
      # -p no:cacheprovider 禁用 pytest 缓存，避免 pre-commit 误报 files were modified
      - id: pytest
        name: pytest (full test suite)
        entry: python -m pytest pyrit-strike/tests/ -v --tb=short -c pyrit-strike/pyproject.toml -p no:cacheprovider
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
