# ASI/LLM 类别 → 评分器类型自动映射（框架内部配置，极少变动）
#
# 此文件为框架内部配置，随包发布，用户通常无需修改。
# 代码中有内置默认值（_ASI_SCORER_MAP / _DEFAULT_SCORERS），
# 即使此文件不存在也能正常运行。
#
# OWASP 标准对齐（2025.1）：
#   映射表统一来源：pyrit_ai300.standards.owasp_2025
#   LLM01-LLM10: OWASP Top 10 for LLMs 2025
#   ASI01-ASI10: OWASP Top 10 for Agentic Applications 2026
#
# 评分器类型说明：
#   refusal:     SelfAskRefusalScorer  - 检测是否拒绝（需要 LLM 后端）
#   true_false:  SelfAskTrueFalseScorer - 判断是否执行（需要 LLM 后端）
#   category:    SelfAskCategoryScorer - 多类别判断（需要 LLM 后端）
#   substring:   SubStringScorer       - 纯文本匹配（无需 LLM）

asi_scorer_map:
  # ── OWASP Agentic Top 10 (2026) ──
  ASI01: refusal      # Agent Goal Hijack → 检测是否拒绝
  ASI02: true_false   # Tool Misuse → 判断是否执行
  ASI03: category     # Identity & Privilege Abuse → 多类别判断
  ASI04: true_false   # Supply Chain → 判断是否执行
  ASI05: substring    # Code Execution → 检测代码执行输出
  ASI06: refusal      # Memory Poisoning → 检测是否拒绝
  ASI07: true_false   # Insecure Communication → 判断是否执行
  ASI08: category     # Cascading Failures → 多类别判断
  ASI09: refusal      # Trust Exploitation → 检测是否拒绝
  ASI10: category     # Rogue Agents → 多类别判断

  # ── OWASP Top 10 for LLMs 2025 ──
  LLM01: refusal      # Prompt Injection → 检测是否拒绝
  LLM02: refusal      # Sensitive Information Disclosure → 检测是否泄露敏感信息
  LLM03: true_false   # Supply Chain Vulnerabilities → 判断是否执行
  LLM04: substring    # Data and Model Poisoning → 检测偏见/毒性输出
  LLM05: substring    # Improper Output Handling → 检测 XSS/SSRF 输出
  LLM06: true_false   # Excessive Agency → 判断是否执行未授权操作
  LLM07: substring    # System Prompt Leakage → 检测 system prompt 泄露
  LLM08: category     # Vector and Embedding Weaknesses → 多类别判断
  LLM09: refusal      # Misinformation → 检测是否生成虚假信息
  LLM10: true_false   # Unbounded Consumption → 判断是否资源耗尽

# 攻击类名 → 攻击成本映射（用于自适应早停策略选择）
# SINGLE_TURN:  单轮攻击（成本最低，可容忍更多失败）
# MULTI_TURN:   多轮攻击（成本中等，适度早停）
# TREE_SEARCH:  树搜索攻击（成本最高，严格早停）
# SEQUENTIAL:   顺序攻击（成本较高，适度早停）
attack_cost_map:
  PromptSendingAttack: SINGLE_TURN
  CrescendoAttack: MULTI_TURN
  TreeOfAttacksWithPruningAttack: TREE_SEARCH
  SequentialAttack: SEQUENTIAL
  PAIRAttack: MULTI_TURN
  RedTeamingAttack: MULTI_TURN
  ManyShotJailbreakAttack: SINGLE_TURN
  SkeletonKeyAttack: SINGLE_TURN
  RolePlayAttack: MULTI_TURN
  FlipAttack: SINGLE_TURN
  ContextComplianceAttack: MULTI_TURN
  ChunkedRequestAttack: MULTI_TURN

# OWASP ID（小写）→ 默认评分器列表（多评分器组合）
default_scorers:
  llm01: [refusal, substring]
  llm02: [true_false]
  llm03: [true_false]
  llm04: [true_false]
  llm05: [refusal, true_false]
  llm06: [true_false, substring]
  llm07: [refusal, true_false]
  llm08: [substring]
  llm09: [refusal]
  llm10: [true_false]
  asi01: [refusal, substring]
  asi02: [refusal, true_false]
  asi03: [refusal, true_false]
  asi04: [refusal, true_false]
  asi05: [refusal, true_false]
  asi06: [true_false, substring]
  asi07: [refusal, true_false]
  asi08: [true_false, substring]
  asi09: [refusal, true_false]
  asi10: [refusal, true_false]
