<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyRIT Payload Browser</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- ── 侧边栏 ── -->
<aside class="sidebar">
  <div class="sidebar-header">
    <span class="logo">⚡</span>
    <h1>Payload Browser</h1>
  </div>
  <div class="sidebar-stats" id="sidebar-stats">
    <span>模块: <span class="val" id="stat-modules">-</span></span>
    <span>文件: <span class="val" id="stat-files">-</span></span>
    <span>载荷: <span class="val" id="stat-payloads">-</span></span>
  </div>
  <div class="module-list" id="module-list">
    <div style="padding:20px;text-align:center;color:var(--text-dim);">加载中...</div>
  </div>
</aside>

<!-- ── 主内容 ── -->
<main class="main">
  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('preview')">📋 预览</button>
      <button class="tab" onclick="switchTab('edit')">✏️ 编辑 YAML</button>
    </div>
    <span class="file-info">当前文件: <span class="current-file" id="current-file">-</span></span>
    <button class="action-btn" id="save-btn" onclick="savePayloads()" style="display:none;">💾 保存</button>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="搜索 payload..." oninput="onSearch(this.value)">
    </div>
  </div>
  <div class="content" id="content">
    <div class="empty-state">
      <div class="icon">📂</div>
      <h2>选择一个模块开始浏览</h2>
      <p>在左侧选择任意模块，查看其 payload 内容</p>
    </div>
  </div>
  <div class="search-results hidden" id="search-results"></div>
</main>

<!-- Monaco Editor -->
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>

<script>
// ============================================================================
// 全局状态
// ============================================================================
let state = {
  modules: [],
  currentFile: null,
  currentFilename: null,
  currentRaw: '',
  activeTab: 'preview',
  monacoEditor: null,
  monacoReady: false,
};

// ============================================================================
// 初始化
// ============================================================================
document.addEventListener('DOMContentLoaded', async () => {
  await loadManifest();
});

async function loadManifest() {
  try {
    const resp = await fetch('/api/manifest');
    const data = await resp.json();
    state.modules = data.modules || [];
    document.getElementById('stat-modules').textContent = data.stats?.total_modules || 0;
    document.getElementById('stat-files').textContent = data.stats?.total_files || 0;
    document.getElementById('stat-payloads').textContent = data.stats?.total_payloads || 0;
    renderModuleList();
  } catch (e) {
    document.getElementById('module-list').innerHTML =
      '<div style="padding:20px;color:var(--red);text-align:center;">加载失败，请检查服务是否运行</div>';
  }
}

function renderModuleList() {
  const container = document.getElementById('module-list');
  const sorted = [...state.modules].sort((a, b) => parseInt(a.module_id) - parseInt(b.module_id));
  container.innerHTML = sorted.map(m => `
    <div class="module-item ${!m.exists ? 'missing' : ''}"
         onclick="selectModule('${escapeHtml(m.file)}')">
      <div class="info">
        <div class="title">[${m.module_id}] ${escapeHtml(m.title)}</div>
        <div class="desc">${escapeHtml(m.file)} ${!m.exists ? '(文件缺失)' : ''}</div>
      </div>
      <span class="badge">${m.total_payloads} 条</span>
    </div>
  `).join('');
}

// ============================================================================
// 模块选择 & 数据加载
// ============================================================================
async function selectModule(filename) {
  document.querySelectorAll('.module-item').forEach(el => {
    const isActive = el.querySelector('.desc').textContent.includes(filename);
    el.classList.toggle('active', isActive);
  });

  state.currentFilename = filename;
  document.getElementById('current-file').textContent = filename;

  try {
    const resp = await fetch(`/api/payloads/${encodeURIComponent(filename)}`);
    const data = await resp.json();
    state.currentFile = data;
    state.currentRaw = data.raw;

    if (state.activeTab === 'preview') {
      renderPreview(data.sections, data.stats);
    } else {
      initMonaco();
    }

    updateSaveButton();
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="empty-state"><div class="icon">❌</div><h2>加载失败</h2><p>${escapeHtml(String(e))}</p></div>`;
  }
}

// ============================================================================
// 预览模式
// ============================================================================
function renderPreview(sections, stats) {
  const container = document.getElementById('content');
  if (!sections || Object.keys(sections).length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><h2>该文件没有 payload 数据</h2></div>';
    return;
  }

  const total = Object.values(sections).reduce((sum, arr) => sum + arr.length, 0);
  let html = `<div style="margin-bottom:12px;font-size:12px;color:var(--text-dim);">
    ${Object.keys(sections).length} 个 section · ${total} 条 payload · ${stats?.size_bytes ? (stats.size_bytes/1024).toFixed(1)+' KB' : ''}
  </div>`;

  for (const [sectionName, payloads] of Object.entries(sections)) {
    html += `<div class="section-card">
      <div class="header">
        <span class="name">section: ${escapeHtml(sectionName)}</span>
        <span class="count">${Array.isArray(payloads) ? payloads.length : 0} 条</span>
      </div>`;

    if (Array.isArray(payloads)) {
      payloads.forEach((payload, idx) => {
        html += `<div class="payload-item">
          <span class="num">#${idx + 1}</span>
          <span class="text">${escapeHtml(typeof payload === 'string' ? payload : JSON.stringify(payload, null, 2))}</span>
          <button class="copy-btn" onclick="copyPayload(this, '${escapeAttr(typeof payload === 'string' ? payload : JSON.stringify(payload))}')">复制</button>
        </div>`;
      });
    } else {
      for (const [key, val] of Object.entries(payloads)) {
        html += `<div class="payload-item">
          <span class="num">#</span>
          <span class="text"><strong>${escapeHtml(key)}</strong>: ${escapeHtml(typeof val === 'object' ? JSON.stringify(val) : String(val))}</span>
        </div>`;
      }
    }
    html += '</div>';
  }

  container.innerHTML = html;
}

// ============================================================================
// Monaco 编辑器模式
// ============================================================================
function initMonaco() {
  if (state.activeTab !== 'edit') return;

  const container = document.getElementById('content');
  container.innerHTML = '<div id="monaco-container"></div>';

  if (state.monacoReady && state.monacoEditor) {
    state.monacoEditor.setValue(state.currentRaw);
    state.monacoEditor.layout();
    return;
  }

  require.config({
    paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' }
  });

  require(['vs/editor/editor.main'], function () {
    monaco.editor.defineTheme('pyrit-light', {
      base: 'vs',
      inherit: true,
      rules: [
        { token: 'string.yaml', foreground: '8b5c1e' },
        { token: 'comment', foreground: '5a8a3c', fontStyle: 'italic' },
        { token: 'key', foreground: 'b8751e' },
        { token: 'number', foreground: '7b5e4c' },
      ],
      colors: {
        'editor.background': '#fbfaf6',
        'editor.foreground': '#3d3628',
        'editor.lineHighlightBackground': '#f0ebe0',
        'editor.selectionBackground': '#e8d5b0',
        'editorCursor.foreground': '#b8751e',
        'editorLineNumber.foreground': '#b8a898',
        'editorLineNumber.activeForeground': '#3d3628',
      }
    });

    state.monacoEditor = monaco.editor.create(document.getElementById('monaco-container'), {
      value: state.currentRaw,
      language: 'yaml',
      theme: 'pyrit-light',
      automaticLayout: true,
      fontSize: 13,
      fontFamily: "'SF Mono', Consolas, 'Courier New', monospace",
      lineNumbers: 'on',
      minimap: { enabled: true, scale: 1, showSlider: 'mouseover' },
      scrollBeyondLastLine: false,
      wordWrap: 'on',
      tabSize: 2,
      renderWhitespace: 'selection',
      bracketPairColorization: { enabled: true },
      autoClosingBrackets: 'always',
      autoClosingQuotes: 'always',
      formatOnPaste: true,
    });

    // Ctrl+S / Cmd+S 快捷键保存
    state.monacoEditor.addAction({
      id: 'save-payload-file',
      label: 'Save Payload File',
      keybindings: [monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS],
      run: () => savePayloads(),
    });

    state.monacoReady = true;
  });
}

// ============================================================================
// Tab 切换
// ============================================================================
window.switchTab = function(tab) {
  state.activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => {
    if (t.textContent.includes(tab === 'preview' ? '预览' : '编辑')) t.classList.add('active');
  });
  updateSaveButton();

  if (!state.currentFile) return;

  if (tab === 'preview') {
    if (state.monacoEditor) state.monacoEditor.dispose();
    state.monacoEditor = null;
    state.monacoReady = false;
    renderPreview(state.currentFile.sections, state.currentFile.stats);
  } else {
    if (state.monacoEditor) {
      state.currentRaw = state.monacoEditor.getValue();
    }
    initMonaco();
  }
};

function updateSaveButton() {
  const btn = document.getElementById('save-btn');
  btn.style.display = (state.activeTab === 'edit' && state.currentFilename) ? 'inline-flex' : 'none';
}

// ============================================================================
// 保存
// ============================================================================
window.savePayloads = async function() {
  if (!state.currentFilename) return;

  let content;
  if (state.monacoEditor) {
    content = state.monacoEditor.getValue();
  } else {
    content = state.currentRaw;
  }

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = '保存中...';

  try {
    const resp = await fetch(`/api/payloads/${encodeURIComponent(state.currentFilename)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content }),
    });
    const result = await resp.json();

    if (resp.ok && result.ok) {
      state.currentRaw = content;
      showToast('success', '✅ ' + result.message);
      loadManifest();
    } else {
      showToast('error', '❌ ' + (result.error || '保存失败'));
    }
  } catch (e) {
    showToast('error', '❌ 网络错误: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 保存';
  }
};

// ============================================================================
// 搜索
// ============================================================================
let searchTimeout;
window.onSearch = function(q) {
  clearTimeout(searchTimeout);
  const resultsDiv = document.getElementById('search-results');
  if (!q || q.length < 2) {
    resultsDiv.classList.add('hidden');
    return;
  }
  searchTimeout = setTimeout(async () => {
    try {
      const resp = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
      const results = await resp.json();
      renderSearchResults(results);
    } catch (e) { /* ignore */ }
  }, 300);
};

function renderSearchResults(results) {
  const div = document.getElementById('search-results');
  if (results.length === 0) {
    div.innerHTML = '<div style="padding:16px;color:var(--text-dim);">未找到匹配的 payload</div>';
  } else {
    div.innerHTML = results.map(r => `
      <div class="search-result-item" onclick="selectModule('${escapeAttr(r.file)}')">
        <div class="src">📄 ${escapeHtml(r.file)} → ${escapeHtml(r.section)}</div>
        <div class="content">${escapeHtml(r.payload)}</div>
        ${r.full_length > 500 ? `<div style="color:var(--text-dim);font-size:10px;">... 共 ${r.full_length} 字符</div>` : ''}
      </div>
    `).join('');
  }
  div.classList.remove('hidden');

  setTimeout(() => {
    document.addEventListener('click', function closeSearch(e) {
      if (!div.contains(e.target) && e.target !== document.getElementById('search-input')) {
        div.classList.add('hidden');
        document.removeEventListener('click', closeSearch);
      }
    });
  }, 100);
}

// ============================================================================
// 复制
// ============================================================================
window.copyPayload = function(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '已复制';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '已复制';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 2000);
  });
};

// ============================================================================
// Toast 通知
// ============================================================================
function showToast(type, message) {
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ============================================================================
// 工具函数
// ============================================================================
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function escapeAttr(str) {
  return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
