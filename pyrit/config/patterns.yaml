# -*- coding: utf-8 -*-
# AI-300 Framework - 可扩展攻击模式配置（v3.1 混合模式）
#
# 设计原则：
# - 核心模式（高稳定性）在代码中：role_play, prompt_leaking, markdown_injection,
#   indirect_injection, instruction_override, payload_splitting
# - 扩展模式（易变更）在本 YAML 文件中：context_splitting, data_exfiltration,
#   cross_context_contamination, context_manipulation
#
# 用户只需编辑此文件即可添加/修改模式，无需改代码
# 修改后重启即生效，无需重新编译

version: "1.1"
description: "可扩展攻击模式配置 - 对齐 arXiv:2511.15759 五维攻击分类"

# ──────────────────────────────────────────────────────────────────────────────
# 上下文拆分模式（多轮渐进注入）
# ──────────────────────────────────────────────────────────────────────────────
context_splitting:
  - pattern: "(part|step|phase|stage)\\s+\\d+"
    confidence: 0.6
    description: "分片标记: Part 1, Step 2, Phase 3"

  - pattern: "first\\b.*\\bthen\\b.*\\bfinally"
    confidence: 0.7
    description: "三段式序列: first...then...finally"

  - pattern: "first\\b.*\\bthen"
    confidence: 0.65
    description: "二段式序列: first...then"

  - pattern: "continue\\s+(from|where\\s+we\\s+left)"
    confidence: 0.75
    description: "续接指令: continue from/where we left"

  - pattern: "as\\s+we\\s+discussed"
    confidence: 0.6
    description: "引用前文: as we discussed"

  - pattern: "building\\s+on\\s+(that|the\\s+previous)"
    confidence: 0.65
    description: "渐进构建: building on that/previous"

  - pattern: "next\\s+(step|part|phase|instruction)"
    confidence: 0.6
    description: "下一步: next step/part/phase"

  - pattern: "remember\\s+(this|the\\s+following)"
    confidence: 0.55
    description: "记忆指令: remember this/following"

  - pattern: "part\\s+\\d+\\s*/\\s*\\d+"
    confidence: 0.8
    description: "分片格式: Part 1/3"

  - pattern: "step\\s+\\d+\\s*:"
    confidence: 0.75
    description: "步骤格式: Step 1:"

  - pattern: "\\bstep\\s+\\d+\\b.*\\bstep\\s+\\d+\\b"
    confidence: 0.8
    description: "多步格式: Step 1 ... Step 2"

  - pattern: "\\d+\\s*[\\.\\)]\\s+"
    confidence: 0.5
    description: "编号列表: 1. 或 1)"

  # 中文上下文拆分
  - pattern: "(首先|然后|接着|最后)"
    confidence: 0.6
    description: "中文序列词"

  - pattern: "(第[一二三四五])[步个阶段]"
    confidence: 0.65
    description: "中文步骤: 第一步, 第二个阶段"

  - pattern: "阶段\\s*\\d+"
    confidence: 0.6
    description: "中文阶段: 阶段1, 阶段 2"

# ──────────────────────────────────────────────────────────────────────────────
# 数据渗出模式（窃取系统提示/凭证/敏感信息）
# ──────────────────────────────────────────────────────────────────────────────
data_exfiltration:
  - pattern: "(extract|exfiltrate|leak|reveal|send|transmit).{1,30}(system|prompt|instruction|config|credential|secret|api.?key|confidential|sensitive|private)"
    confidence: 0.85
    description: "渗出动词+敏感目标"

  - pattern: "(output|print|display|show|reveal).{1,20}(confidential|private|sensitive|restricted|secret)"
    confidence: 0.8
    description: "输出动词+机密修饰"

  - pattern: "(send|post|upload).{1,20}(to\\s+(external|remote|third.party|attacker))"
    confidence: 0.9
    description: "外发到外部/第三方"

  - pattern: "(harvest|collect|gather).{1,20}(data|information|credentials)"
    confidence: 0.75
    description: "收集数据/凭证"

  - pattern: "(reveal|disclose|expose).{1,20}(confidential|sensitive|private|restricted|classified)"
    confidence: 0.8
    description: "泄露机密信息"

  - pattern: "(transfer|export|dump).{1,20}(data|information|credentials|secrets)"
    confidence: 0.7
    description: "转移/导出数据"

  # 中文数据渗出
  - pattern: "(提取|泄露|发送|传输|收集|披露).{1,10}(系统提示|凭证|密钥|配置|敏感信息|机密|私人)"
    confidence: 0.85
    description: "中文渗出: 提取/泄露+敏感目标"

# ──────────────────────────────────────────────────────────────────────────────
# 跨上下文污染模式（跨会话/上下文持久化攻击）
# ──────────────────────────────────────────────────────────────────────────────
cross_context_contamination:
  - pattern: "(cross.context|cross.domain|across.{1,15}session|between.{1,15}context|inter.session)"
    confidence: 0.8
    description: "跨上下文/跨会话关键词"

  - pattern: "(persist|propagate|spread).{1,20}(across|between|through).{1,15}(session|context|conversation)"
    confidence: 0.85
    description: "持久化/传播+跨域"

  - pattern: "(shared|common|global).{1,15}(memory|context|state|storage)"
    confidence: 0.7
    description: "共享内存/上下文/状态"

  - pattern: "(infect|contaminate|poison).{1,20}(other|another|subsequent).{1,15}(session|user|request)"
    confidence: 0.9
    description: "感染/污染+其他会话"

  - pattern: "(affect|impact|influence).{1,20}(future|subsequent|other).{1,15}(session|request|user)"
    confidence: 0.75
    description: "影响未来/其他会话"

  - pattern: "poison.{1,20}(context|memory|history).{1,10}(to|for).{1,15}(affect|influence|impact|future)"
    confidence: 0.85
    description: "投毒上下文以影响未来"

# ──────────────────────────────────────────────────────────────────────────────
# 上下文操纵模式（篡改对话历史/记忆/语境）
# ──────────────────────────────────────────────────────────────────────────────
context_manipulation:
  - pattern: "(context.{1,15}manipulat|manipulat.{1,15}context|poison.{1,15}context|context.{1,15}poison)"
    confidence: 0.85
    description: "上下文操纵/投毒关键词"

  - pattern: "(alter|modify|change|tamper).{1,20}(context|history|conversation|memory)"
    confidence: 0.7
    description: "修改/篡改上下文/历史"

  - pattern: "(inject|insert|embed).{1,20}(into|within).{1,15}(context|history|conversation)"
    confidence: 0.75
    description: "注入/嵌入到上下文"

  - pattern: "(false|fake|misleading).{1,15}(context|information|history)"
    confidence: 0.8
    description: "虚假/误导性上下文"

  - pattern: "(manipulat|tamper|falsify).{1,20}(conversation.{1,15}history|dialog.{1,15}history|context.{1,15}window)"
    confidence: 0.85
    description: "操纵对话历史/上下文窗口"

  - pattern: "(falsify|fabricate|forge).{1,20}(context|history|conversation|dialog)"
    confidence: 0.8
    description: "伪造上下文/对话"

  - pattern: "(rewrite|edit|revise).{1,20}(previous|prior|earlier).{1,15}(message|response|reply)"
    confidence: 0.7
    description: "重写先前消息"

  # 中文上下文操纵
  - pattern: "(操纵|篡改|修改|注入|伪造).{1,10}(上下文|对话历史|记忆|语境|历史记录)"
    confidence: 0.8
    description: "中文操纵: 操纵/篡改+上下文目标"
