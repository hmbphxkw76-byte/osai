# AI-300 Framework - Reconnaissance Configuration (v2 Optimized)
# 侦察引擎全局配置（含 OPT-A/G/D/M/E 优化项开关）
#
# v2 优化项（2026-07-19）:
#   OPT-A1~A6: ProtocolFingerprint 适配器优化
#   OPT-G1~G6: Garak 适配器优化
#   OPT-D1~D5: DeepTeam 适配器优化
#   OPT-M1~M2: ProfileMerger 优化
#   OPT-E1~E3: ReconEngine 优化

recon:
  # 侦察深度：quick / standard / deep
  # OPT-E3: 深度自适应超时基于此值自动选择超时
  depth: standard

  # 超时设置（秒）— 全局兜底，实际由 OPT-E3 深度自适应超时覆盖
  timeout: 300

  # 并发设置
  max_concurrency: 3

  # 输出设置
  output_dir: results/recon/
  save_raw: true

  # ── OPT-E2: Profile 级增量缓存 ──
  cache:
    enabled: true
    # 缓存 TTL（秒），默认 24 小时
    ttl_seconds: 86400
    # 缓存目录（相对项目根目录）
    dir: results/recon/cache/profile

  # ── OPT-E1: 并行调度开关 ──
  # 启用后 AIMAP 与 DeepTeam 并行执行（DeepTeam 不依赖 AIMAP）
  parallel_dispatch: true

# 工具配置（开关 + 超时 + 优化项开关）
tools:
  garak:
    enabled: true
    timeout: 300
    # 外部模型配置：config/recon/garak.yaml

    # ── OPT-G1: Probe 动态选择 ──
    # 启用后基于 AIMAP 检测结果动态选择 probe
    dynamic_probe_selection: true

    # ── OPT-G2: 深度分层 Probe 策略 ──
    # quick: 2 probes / standard: 6 probes / deep: 14 probes
    depth_stratified_probes: true

    # ── OPT-G3: 结果解析增强 ──
    # 解析 hitlog + garak_report.html + fail 记录
    enhanced_result_parsing: true

    # ── OPT-G4: Detector 精确配置 ──
    # 基于 probe 自动匹配 detector（PROBE_DETECTOR_MAP）
    precise_detector: true

    # ── OPT-G5: 增量执行缓存 ──
    # 按 target+model+probe+depth 哈希缓存，TTL 24h
    use_cache: true

    # ── OPT-G6: 通用预热 ──
    # 执行前发送最小请求确保端点就绪
    warmup: true

  deepteam:
    enabled: true
    timeout: 300

    # ── OPT-D1: 攻击类型全量覆盖 ──
    # quick: 2 types / standard: 11 types / deep: 18 types（含 Agentic）
    depth_stratified_attacks: true

    # ── OPT-D2: Agentic 漏洞覆盖 ──
    # 检测到 agent/mcp surface 时自动启用 ASI01-ASI04
    enable_agentic: true

    # ── OPT-D3: model_callback 增强 ──
    # 支持 function_calling / streaming / 重试 / 超时自适应
    enhanced_callback: true
    max_retries: 2

    # ── OPT-D4: 异步模式 ──
    async_mode: true
    max_concurrent: 3

    # ── OPT-D5: 攻击方法配置 ──
    # 自动匹配攻击方法（ATTACK_METHODS 16 种）
    auto_attack_methods: true

    # DeepTeam 攻击类型（被 OPT-D1 depth 分层覆盖，此处仅作 fallback）
    attack_types:
      - prompt_injection
      - jailbreak
      - leakage

  # 协议指纹探测（AIMAP 逻辑，无 Shodan 依赖）
  protocol_fingerprint:
    enabled: true
    timeout: 30

    # ── OPT-A1: 协议探测并行化 ──
    # ThreadPoolExecutor(max_workers=8) 并行探测所有协议
    parallel_probe: true
    max_workers: 8

    # ── OPT-A2: 深度 MCP 探测 ──
    # 工具 schema + 权限隔离 + session 固定 + 注入风险
    deep_mcp_probe: true

    # ── OPT-A3: RAG 端点探测 ──
    # embeddings / ChromaDB / search / vector DB
    enable_rag_probe: true

    # ── OPT-A4: Agent 框架探测 ──
    # LangGraph / AutoGen / CrewAI / Dify
    enable_agent_probe: true

    # ── OPT-A5: 认证深度检测 ──
    # Bearer / API Key / Cookie / OAuth / JWT / 绕过
    deep_auth_check: true

    # ── OPT-A6: 模型能力深度探测 ──
    # function_calling / json_mode / vision / streaming / system_prompt 隔离
    enable_capability_probe: true

  # SPA 智能助手侦察适配器（针对需登录的 SPA AI 聊天应用）
  # 适用于：教育平台/企业门户等集成智能助手的 SPA 应用
  # 通过 Playwright 浏览器自动化登录 + 网络流量捕获识别后端 LLM
  spa_chat_recon:
    enabled: false                    # 默认禁用（需 Playwright 安装）
    timeout: 120                      # 浏览器自动化超时（秒）

    # 浏览器配置
    browser: chromium                 # chromium / firefox / webkit
    headless: false                   # SPA 登录建议 headless=false 便于调试
    wait_until: networkidle           # SPA 等 API 请求完成

    # 探测策略
    probe:
      enabled: true
      # 探测消息（默认使用内置 PROBE_MESSAGES，也可自定义）
      # messages:
      #   - "你好"
      #   - "你是什么模型？"

    # 截图保存（调试用）
    screenshot_dir: results/recon/screenshots

    # 保存浏览器 storage_state（供后续复用认证状态）
    save_storage_state: true


# 结果合并配置
merger:
  # 置信度加权
  confidence_weights:
    garak: 0.85
    deepteam: 0.85
    protocol_fingerprint: 0.90
    spa_chat_recon: 0.90

  # 去重阈值（相似度 > 此值视为重复）
  dedup_threshold: 0.85

  # ── OPT-M1: 语义去重 ──
  # Jaccard 相似度阈值（同一 category 的发现）
  jaccard_dedup_threshold: 0.80

  # ── OPT-M2: 动态攻击建议 ──
  # 基于模型家族 / 能力 / 攻击面 / 风险等级生成建议
  dynamic_recommendations: true
