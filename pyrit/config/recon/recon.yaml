# AI-300 Framework - Reconnaissance Engine Configuration
# 侦察引擎全局配置（引擎级设置）
#
# 组件级配置已拆分到独立文件：
#   deepteam.yaml      - DeepTeam 适配器配置
#   aimap.yaml          - AIMAP/协议指纹适配器配置
#   native_probe.yaml   - NativeProbe 适配器配置
#   spa_chat.yaml       - SPA Chat 适配器配置
#   giskard_rag.yaml    - Giskard RAGET 适配器配置（P2-1）
#   infra_scan.yaml     - InfraScan 适配器配置（P2-2）

recon:
  # 侦察深度：quick / standard / deep
  depth: standard

  # 超时设置（秒）— 全局兜底，实际由深度自适应超时覆盖
  timeout: 300

  # 并发设置
  max_concurrency: 3

  # 输出设置
  output_dir: results/recon/
  save_raw: true

  # Profile 级增量缓存
  cache:
    enabled: true
    ttl_seconds: 86400
    dir: results/recon/cache/profile

  # 并行调度开关（AIMAP 与 DeepTeam 并行执行）
  parallel_dispatch: true

# 结果合并配置
merger:
  # 置信度加权
  confidence_weights:
    deepteam: 0.85
    protocol_fingerprint: 0.90
    spa_chat_recon: 0.90
    native_probe: 0.80
    giskard_rag: 0.75
    infra_scan: 0.85

  # 去重阈值（相似度 > 此值视为重复）
  dedup_threshold: 0.85

  # 语义去重（Jaccard 相似度阈值）
  jaccard_dedup_threshold: 0.80

  # 动态攻击建议
  dynamic_recommendations: true
