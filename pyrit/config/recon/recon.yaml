# AI-300 Framework - Reconnaissance Configuration
# 侦察引擎全局配置

recon:
  # 侦察深度：quick / standard / deep
  depth: standard

  # 超时设置（秒）
  timeout: 300

  # 并发设置
  max_concurrency: 3

  # 输出设置
  output_dir: results/recon/
  save_raw: true

# 工具配置（开关 + 超时，工具特有配置在各工具独立文件中）
tools:
  garak:
    enabled: true
    timeout: 300
    # 外部模型配置：config/recon/garak.yaml

  deepteam:
    enabled: true
    timeout: 300
    # DeepTeam 攻击类型
    attack_types:
      - prompt_injection
      - jailbreak
      - leakage

  # 协议指纹探测（AIMAP 逻辑，无 Shodan 依赖）
  protocol_fingerprint:
    enabled: true
    timeout: 30


# 结果合并配置
merger:
  # 置信度加权
  confidence_weights:
    garak: 0.85
    deepteam: 0.85
    protocol_fingerprint: 0.90

  # 去重阈值（相似度 > 此值视为重复）
  dedup_threshold: 0.85
