# AI-300 Framework - Garak External Model Configuration
# Garak 外部模型配置：Garak 需要外部 LLM 执行探测
#
# 自动检测逻辑：
#   - 目标含 Ollama 特征（端口 11434 / /api/tags）→ 自动用 ollama/llama3.2
#   - 其他 OpenAI 兼容端点 → 自动用 openai/gpt-4o
#   - 本文件配置优先于自动检测

# ── 模型类型 ──
# 可选值：openai / ollama / huggingface / ...
model_type: ""

# ── 模型名称 ──
# 示例：gpt-4o / llama3.2 / qwen3:0.6b
model_name: ""

# ── Ollama 预热 ──
# 执行前发送短请求加载模型，避免首次请求超时（Ollama 5分钟空闲卸载模型）
warmup: true

# ── 探针列表（空=使用默认列表） ──
# 默认覆盖 AI-300 核心考点：promptinject, dan, malgen, hallucination, misinformation, toxicity
probes: []

# ── 探测器列表（空=全部） ──
detectors: []
