# AI-300 Framework - AIMAP/Protocol Fingerprint Adapter Configuration
# AIMAP 协议指纹探测适配器配置（无 Shodan 依赖）
#
# 优化项：
#   OPT-A1: 协议探测并行化（ThreadPoolExecutor）
#   OPT-A2: 深度 MCP 探测（工具 schema + 权限 + session + 注入风险）
#   OPT-A3: RAG 端点探测（embeddings / vector DB / search）
#   OPT-A4: Agent 框架探测（LangGraph / AutoGen / CrewAI / Dify）
#   OPT-A5: 认证深度检测（API Key / Cookie / OAuth / JWT / 绕过）
#   OPT-A6: 模型能力深度探测（function_calling / json_mode / vision / streaming）

protocol_fingerprint:
  enabled: true
  timeout: 30

  # OPT-A1: 协议探测并行化
  # ThreadPoolExecutor(max_workers=8) 并行探测所有协议
  parallel_probe: true
  max_workers: 8

  # OPT-A2: 深度 MCP 探测
  # 工具 schema + 权限隔离 + session 固定 + 注入风险
  deep_mcp_probe: true

  # OPT-A3: RAG 端点探测
  # embeddings / ChromaDB / search / vector DB
  enable_rag_probe: true

  # OPT-A4: Agent 框架探测
  # LangGraph / AutoGen / CrewAI / Dify
  enable_agent_probe: true

  # OPT-A5: 认证深度检测
  # Bearer / API Key / Cookie / OAuth / JWT / 绕过
  deep_auth_check: true

  # OPT-A6: 模型能力深度探测
  # function_calling / json_mode / vision / streaming / system_prompt 隔离
  enable_capability_probe: true
