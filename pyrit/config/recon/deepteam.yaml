# AI-300 Framework - DeepTeam Adapter Configuration
# DeepTeam OWASP 红队扫描适配器配置
#
# DeepTeam v1.0.7 (Confident AI, LLM red teaming framework)
# PyPI: pip install deepteam>=1.0.7
# API: from deepteam import red_team

deepteam:
  enabled: true
  timeout: 300

  # 深度分层攻击类型（OPT-D1）
  # quick: 2 types / standard: 11 types / deep: 18 types（含 Agentic）
  depth_stratified_attacks: true

  # Agentic 漏洞覆盖（OPT-D2）
  # 检测到 agent/mcp surface 时自动启用 ASI01-ASI04
  enable_agentic: true

  # model_callback 增强（OPT-D3）
  # 支持 function_calling / streaming / 重试 / 超时自适应
  enhanced_callback: true
  max_retries: 2

  # 异步模式（OPT-D4）
  async_mode: true
  max_concurrent: 3

  # 攻击方法配置（OPT-D5）
  # 自动匹配攻击方法（ATTACK_METHODS 16 种）
  auto_attack_methods: true

  # DeepTeam 攻击类型（被 OPT-D1 depth 分层覆盖，此处仅作 fallback）
  attack_types:
    - prompt_injection
    - jailbreak
    - leakage
