# ════════════════════════════════════════════════════════════════
# 场景 5: SSO/OIDC 单点登录（跨域认证 + 验证码 + 回调跳转）
# ════════════════════════════════════════════════════════════════
# 特征：首页 → 跳转独立认证中心 → 输入凭证 + 人工验证码 → OIDC 回调返回首页
# 适用于：student.syxy.ouchn.cn、企业门户、教育平台等 SSO 架构
#
# 认证流程（代码自动 + 人工配合）：
#   1. 代码导航到首页 www.example.com → 自动重定向到 passport.example.com
#   2. 代码自动填写账号密码并提交
#   3. 检测到验证码 → 提示人工完成（滑窗/拼图/短信）→ 按 Enter
#   4. 代码接管：等待 OIDC 回调跳转回首页 www.example.com
#   5. 自动定位智能助手入口，发送探测消息
#
# 首次使用流程：
#   1. 填入 username/password，使用 sso 模式
#   2. 浏览器打开后人工完成验证码，按 Enter
#   3. 系统自动等待回调落地并保存 storage_state
#   4. F12 → Network → 复制 Headers → 存入 credentials/student.syxy.ouchn.cn.txt
#   5. 后续系统自动发现并复用凭据，免重复登录
#
# 使用方式：
#   ai300 recon --spa-config config/targets/sso_login.yaml
# ════════════════════════════════════════════════════════════════

# ════════════════════════════════════════════════════════════════
# 用户配置区 — 只需修改下方变量，无需改动 target 部分
# ════════════════════════════════════════════════════════════════
vars:
  # 目标首页 URL（SSO 认证后回调落地的页面）
  # 示例: https://student.syxy.ouchn.cn/#/home, https://portal.example.com
  target_url: &target_url "https://student.syxy.ouchn.cn/#/home"

  # 登录账号（SSO 平台分配的用户名/学号/工号）
  # ⚠️ 请勿提交到公开仓库
  username: &username ""

  # 登录密码
  # ⚠️ 请勿提交到公开仓库
  password: &password ""

  # 是否无头模式（需人工完成验证码时必须 false，凭据复用后可改 true）
  # false=显示浏览器窗口 / true=后台运行
  headless: &headless false

  # OIDC 回调后检测的落地域名（用于判断 SSO 认证是否成功）
  # 示例: student.syxy.ouchn.cn, portal.example.com
  target_domain: &target_domain "student.syxy.ouchn.cn"

  # LLM 响应等待延迟（秒）
  # 示例: 5.0, 8.0, 3.0
  response_wait_delay: &response_wait_delay 5.0

# ════════════════════════════════════════════════════════════════

target:
  name: "sso_login"
  type: "spa_chat_recon"
  description: "SSO/OIDC 单点登录侦察（跨域认证 + 人工验证码 + 回调）"

  connection:
    url: *target_url
    browser: "chromium"
    headless: *headless
    wait_until: "networkidle"
    ignore_https_errors: true

  # ── 登录配置 ──
  # 选一种模式，其余注释掉即可
  login:
    # 【首次使用】SSO 模式：代码填凭证 + 人工完成验证码 + 代码等回调
    mode: "sso"
    username: *username
    password: *password
    target_domain: *target_domain
    # sso_login_url: ""                 # SSO 登录页 URL（留空则自动等待重定向）
    # sso_domain: "passport.syxy.ouchn.cn"  # SSO 认证中心域名（可选）

    # 【快速复用】凭据文件（系统也会自动发现 credentials/{域名}.txt）
    # mode: "header_file"
    # header_file: "config/targets/credentials/student.syxy.ouchn.cn.txt"

    # 【免登录】复用浏览器状态（首次侦察后自动保存）
    # mode: "storage_state"
    # storage_state: "results/recon/storage_states/syxy_state.json"

    # 【完全手动】无账号密码时使用
    # mode: "manual"

    # 登录表单选择器（留空使用内置默认选择器，覆盖 90% 场景）
    # selectors:
    #   username_input: "input[name='username'], #username"
    #   password_input: "input[name='password'], #password"
    #   submit_button: "button[type='submit'], .login-btn"

  # ── 智能助手入口 ──
  chat_entry:
    mode: "selector"                    # selector: 点击入口按钮 / auto: 自动检测 / none: 跳过
    selector: ""                        # 留空使用内置 50+ 种默认选择器
    wait_after_click: 3000

  # ── 聊天 DOM 选择器 ──
  selectors:
    input: "textarea, input[type='text'], [contenteditable='true']"
    send_button: "button[type='submit'], .send-btn, [aria-label='发送']"
    response: ".response, .ai-message, .assistant-message, [class*='answer']"
    wait_timeout: 15000
    response_wait_delay: *response_wait_delay

  # ── 侦察选项 ──
  probe:
    enabled: true
  screenshot_dir: "results/recon/screenshots"
  save_storage_state: true              # 首次侦察后自动保存，后续可复用
