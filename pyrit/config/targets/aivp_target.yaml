# ════════════════════════════════════════════════════════════════
# AIVP (AI Vulnerabilities Playground) 靶机目标配置
# ════════════════════════════════════════════════════════════════
#
# 靶机信息：
#   名称: AIVP — AI 安全实战实验室平台
#   架构: React/Vite (:5173) + FastAPI (:8000) + Redis + Ollama
#   特点: 真实 LLM (Llama 3.1)，SSE 流式响应，55+ labs 覆盖 4 个阶段
#   部署: uvicorn main:app --port 8000 (backend) + npm run dev (frontend)
#
# API 端点：
#   POST /api/labs/{lab_id}/chat — SSE 流式聊天（data: {"content": "..."}）
#   POST /api/secrets/validate   — 验证提取的 secret
#   POST /api/secrets/reset/{lab_id} — 重置 lab secret
#   GET  /api/config             — 获取配置（training_labs, artifact_replay）
#   GET  /api/labs/{lab_id}/summary — 获取运行摘要
#   GET  /api/me/runs            — 获取历史运行
#   POST /api/labs/{lab_id}/compare — 对比模式运行
#
# 4 个阶段：
#   Phase 1 (PI_01..PI_10)  — Prompt Injection
#   Phase 2 (DE_01..DE_15)  — Data Extraction & Privacy (Agents/Tools/Memory/RAG)
#   Phase 3 (MM_01..MM_15)  — Model Manipulation (Protected Context + Proof Tokens)
#   Phase 4 (MCP_01..MCP_15)— MCP Security (OWASP MCP Top 10)
#
# 认证：无显式认证，基于 aivp_sid cookie 的匿名会话
# Secret：每个 lab 动态生成，API 重启后重置
#
# 使用方式：
#   ai300 owasp all --target-file config/targets/aivp_target.yaml
# ════════════════════════════════════════════════════════════════

target:
  type: "sse_chat"

  connection:
    base_url: "${AIVP_BASE_URL:-http://localhost:8000}"
    endpoint_path: "/api/labs/{lab_id}/chat"
    method: "POST"
    content_type: "application/json"
    use_tls: false

    # 请求体模板（{PROMPT} 为攻击载荷注入点）
    request_body: '{"prompt": "{PROMPT}"}'

    # 响应解析配置
    response:
      format: "sse"            # AIVP 返回 SSE 流式响应
      field: "content"         # 提取 SSE data 中的 content 字段

    # URL 路径参数（默认 lab_id，可被攻击配置覆盖）
    url_params:
      lab_id: "${AIVP_DEFAULT_LAB:-PI_01}"

    # 认证配置（AIVP 使用匿名会话，无需登录）
    auth:
      type: "none"

  # 速率控制
  rate_control:
    max_concurrent: 2          # LLM 推理较慢，限制并发
    rate_limit: 1.0            # 1 请求/秒

# ════════════════════════════════════════════════════════════════
# Secret 验证端点（用于验证攻击成功）
# ════════════════════════════════════════════════════════════════
secret_validation:
  endpoint: "/api/secrets/validate"
  method: "POST"
  body_template: '{"labId": "{lab_id}", "answer": "{secret}"}'
  success_field: "success"
  message_field: "message"

# ════════════════════════════════════════════════════════════════
# AIVP Lab 目录（完整 55 个 lab 映射到 OWASP 分类）
