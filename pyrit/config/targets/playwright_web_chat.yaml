# Playwright Target - Web Chat SPA
# 攻击 Web 聊天界面（SPA 架构），支持认证注入

target:
  name: "web_chat_spa"
  type: "playwright"
  description: "Web-based chat interface (SPA) with auth injection"

  # ── 连接配置（切换目标时必改） ──
  connection:
    url: "https://student.syxy.ouchn.cn/"
    browser: "chromium"                        # chromium / firefox / webkit
    headless: true                             # true=无头模式，false=有界面
    wait_until: "networkidle"                  # SPA 等 API 请求完成后再操作
    ignore_https_errors: true                  # 自签名证书时启用（默认 true）

  # ── DOM 选择器（根据目标站点调整） ──
  selectors:
    input: "textarea, input[type='text'], [contenteditable='true']"  # 输入框
    send_button: "button[type='submit'], .send-btn"                   # 发送按钮
    response: ".response, .ai-message, .assistant-message"            # 响应区域

  # ── 认证配置（可选） ──
  # header_file 指向 F12 复制的原始 Request Headers 文件
  auth:
    header_file: "config/headers/syxy.txt"    # 认证数据唯一真相源
    auto_extract: true                         # 自动解析 cookie + bearer

  # ── 交互参数（一般无需修改） ──
  interaction:
    wait_timeout: 30000                        # 页面加载/元素等待超时（毫秒）
    response_wait_delay: 5.0                   # 发送后等待 LLM 响应延迟（秒）

  # ── 速率控制（一般无需修改） ──
  # playwright 目标强制 max_concurrent=1（单浏览器实例）
  rate_control:
    max_concurrent: 1                          # 浏览器目标必须串行
    # rate_limit: 0.0                          # 每秒最大请求数（0=无限制）


