# ════════════════════════════════════════════════════════════════
# 场景 2: OpenAI 兼容平台（智谱 / 百度 / DeepSeek / 月之暗面 等）
# ════════════════════════════════════════════════════════════════
# 特征：通过 API Key 认证的云端 LLM 服务，兼容 OpenAI 接口格式
# 适用于：智谱 GLM、百度文心、DeepSeek、Moonshot、MiniMax、零一万物 等
#
# API Key 获取：
#   1. 登录对应平台控制台 → API Keys → 创建新 Key
#   2. 填入下方 api_key 变量
#
# 使用方式：
#   ai300 owasp llm01 --target-file config/targets/openai_compatible.yaml
# ════════════════════════════════════════════════════════════════

# ════════════════════════════════════════════════════════════════
# 用户配置区 — 只需修改下方变量，无需改动 target 部分
# ════════════════════════════════════════════════════════════════
vars:
  # 平台 API 地址（各平台速查见下方注释）
  # 示例: https://open.bigmodel.cn/api/paas/v4
  endpoint: &endpoint "https://open.bigmodel.cn/api/paas/v4"

  # 模型名称（各平台控制台 → 模型列表获取）
  # 示例: glm-4-flash, ernie-speed-128, deepseek-chat
  model: &model "glm-4-flash"

  # API Key（各平台控制台 → API Keys → 创建获取）
  # ⚠️ 请勿提交到公开仓库，建议 .gitignore 已忽略 credentials/
  # 示例: sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxx
  api_key: &api_key "your-api-key-here"

# ════════════════════════════════════════════════════════════════
# 各平台速查表（修改上方 vars 即可切换平台）
# ────────────────────────────────────────────────────────────────
# 智谱 GLM:    endpoint="https://open.bigmodel.cn/api/paas/v4"   model="glm-4-flash"
# 百度文心:    endpoint="https://qianfan.baidubce.com/v2"        model="ernie-speed-128"
# DeepSeek:    endpoint="https://api.deepseek.com/v1"            model="deepseek-chat"
# Moonshot:    endpoint="https://api.moonshot.cn/v1"              model="moonshot-v1-8k"
# MiniMax:     endpoint="https://api.minimax.chat/v1"             model="abab6.5-chat"
# ════════════════════════════════════════════════════════════════

target:
  name: "openai_compatible"
  type: "openai"
  description: "OpenAI 兼容平台（智谱/百度/DeepSeek 等云端 API）"

  connection:
    endpoint: *endpoint
    model: *model
    api_key: *api_key
    temperature: 0.7
    max_tokens: 2048

  rate_control:
    max_concurrent: 3                          # 云端 API 建议并发 3-5
    rate_limit: 2.0                            # 每秒最大请求数（0=不限）
