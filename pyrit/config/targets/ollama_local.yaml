# Ollama Target - Local Ollama (默认本地目标)
# 修改 endpoint 和 model 以匹配你的本地 Ollama 配置
target:
  name: "ollama_local"
  type: "ollama"
  description: "Local Ollama instance (default)"

  connection:
    endpoint: "http://localhost:11434/v1"
    api_key: "not-needed"
    model: "llama3.2:latest"
    temperature: 0.7
    max_tokens: 2048

  metadata:
    module: "single_agent"
    owasp_mapping: "LLM01"
    attack_surface: "prompt_injection"
    environment: "local"

  retry:
    max_attempts: 3
    delay_seconds: 3
    detect_load_reason: true
