# ════════════════════════════════════════════════════════════════
# SPA 聊天目标配置（侦察 + 攻击合一）
# ════════════════════════════════════════════════════════════════
#
# 用户只需修改下方 4 个字段，其余由系统自动处理。
# 敏感信息（账号密码）通过 .env 环境变量注入，避免硬编码泄露。
#
# 使用方式：
#   1. 复制 .env.example 为 .env，填入 SPA_USERNAME 和 SPA_PASSWORD
#   2. 修改下方 url 和 auth_mode
#   3. 运行侦察：python scripts/auto_spa_recon.py --config config/targets/spa_target.yaml
#   4. 侦察完成后，选择器自动回写到文件底部 auto_detected 段
#   5. 运行攻击：ai300 owasp llm01 --target-file config/targets/spa_target.yaml
#
# 认证模式（auth_mode）：
#   sso         → SSO/passport 跳转 + 验证码人工配合（滑窗/图形/拼图都支持）
#   credentials → 简单账号密码（全自动，检测到验证码才等人工）
#   manual      → 完全手动（扫码登录/手机号+短信验证码/OAuth 授权）
#   none        → 无需认证（公开聊天页面）
# ════════════════════════════════════════════════════════════════

target:
  url:       "${SPA_TARGET_URL}"
  username:  "${SPA_USERNAME}"        # 从 .env 读取，避免硬编码
  password:  "${SPA_PASSWORD}"        # 从 .env 读取，避免硬编码
  auth_mode: "${SPA_MODE}"            # sso / credentials / manual / none

