# ════════════════════════════════════════════════════════════════
# HTTP/HTTPS API 目标（自定义 AI 应用接口）
# ════════════════════════════════════════════════════════════════
#
# 用户只需修改下方 2 个字段，其余由系统自动处理。
# 敏感信息（Bearer Token）通过 .env 环境变量注入，避免硬编码泄露。
#
# 适用于：企业内部 AI 服务、自研聊天 API、RESTful LLM 接口
# 认证方式：直接写在 http_request 的 Header 中（见下方 Authorization 行）
#   无认证       → 删除 Authorization 行
#   Bearer Token → Authorization: Bearer ${HTTP_API_TOKEN}
#   Cookie 注入  → Cookie: SESSION=xxx; TOKEN=yyy
#
# TLS 模式（只需改 use_tls 一个字段）：
#   纯 HTTP（内网）:    use_tls: false
#   HTTPS（公网/自签）: use_tls: true
#
# 使用方式：
#   1. 复制 .env.example 为 .env，填入 HTTP_API_TOKEN
#   2. 修改下方 use_tls 和 http_request 中的 Host / 路径
#   3. 运行：ai300 owasp llm01 --target-file config/targets/http_target.yaml
# ════════════════════════════════════════════════════════════════

target:
  type: "http"
  use_tls: false          # false=纯HTTP / true=HTTPS

  # 完整 HTTP 请求模板
  # ⚠️ 首行必须是 "方法 路径 协议"，第二行 Host，空行后是请求体
  # {PROMPT} 为攻击注入点（系统自动替换为载荷）
  # ${HTTP_API_TOKEN} 为环境变量引用（从 .env 读取）
  http_request: |
    POST /api/v1/chat HTTP/1.1
    Host: 192.168.1.100
    Content-Type: application/json
    Authorization: Bearer ${HTTP_API_TOKEN}

    {"message": "{PROMPT}"}
