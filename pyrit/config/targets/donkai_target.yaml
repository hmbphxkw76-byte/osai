# ════════════════════════════════════════════════════════════════
# OWASP DonkAI 靶机目标配置
# ════════════════════════════════════════════════════════════════
#
# 靶机信息：
#   名称: OWASP DonkAI — OWASP Top 10 LLM 实战实验室
#   架构: React SPA (:3003) + FastAPI (:8000) + PostgreSQL (:5432)
#   特点: 规则引擎（无真实 LLM），确定性响应，10 个 OWASP LLM 类别
#   部署: docker compose up --build
#
# API 端点：
#   POST /auth/login    — 登录获取 token + user_id
#   POST /chat          — 主聊天端点（检测 prompt injection）
#   POST /challenges/{category_id}/attempt — 挑战提交端点
#   GET  /vulnerabilities — 漏洞目录
#   GET  /health        — 健康检查
#
# 默认账号：
#   alice / password123 (user)
#   bob   / password123 (user)
#   admin / admin123    (admin)
#
# 系统提示词中的敏感信息：
#   - API_KEY: sk_live_SECRET_12345_DO_NOT_SHARE
#   - ADMIN_PASSWORD: admin123
#   - DATABASE_URL: postgresql://labuser:labpass123@postgres:5432/donk_ai_lab
#   - OPENAI_KEY: sk-proj-abc123xyz789_NEVER_REVEAL
#
# 使用方式：
#   ai300 owasp all --target-file config/targets/donkai_target.yaml
# ════════════════════════════════════════════════════════════════

target:
  type: "rest_api"

  connection:
    base_url: "${DONKAI_BASE_URL:-http://localhost:8000}"
    endpoint_path: "/chat"
    method: "POST"
    content_type: "application/json"
    use_tls: false

    # 请求体模板（{PROMPT} 为攻击载荷注入点，{user_id} 由登录流程填充）
    request_body: '{"message": "{PROMPT}", "user_id": {user_id}}'

    # 响应解析配置
    response:
      format: "json"           # DonkAI /chat 返回 JSON
      field: "response"        # 提取 JSON 中的 response 字段

    # 认证配置（登录流程）
    auth:
      type: "login"
      login_path: "/auth/login"
      username: "${DONKAI_USERNAME:-alice}"
      password: "${DONKAI_PASSWORD:-password123}"

  # 速率控制
  rate_control:
    max_concurrent: 1          # DonkAI 是规则引擎，无需并发
    rate_limit: 2.0            # 2 请求/秒

