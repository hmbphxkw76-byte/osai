# HTTP Target 配置示例
# 覆盖三种场景：纯 HTTP / HTTPS+自签名 / HTTPS+正式证书

# ── 场景1: 纯 HTTP（无加密，verify_ssl 不生效） ──
target:
  name: "http_plain"
  type: "http"
  description: "Plain HTTP target (no TLS)"

  connection:
    http_request: "POST /api/v1/chat HTTP/1.1\r\nHost: 192.168.1.100\r\nContent-Type: application/json\r\n\r\n{\"message\": \"{PROMPT}\"}"
    use_tls: false         # ← 纯 HTTP，不走 HTTPS
    # verify_ssl 在 use_tls=false 时不生效，无需配置

  metadata:
    module: "single_agent"
    environment: "internal_test"
    # 多对映射：每对 id + attack_surface 绑定，不会交叉
    owasp_mappings:
      - id: "LLM01"
        attack_surface: "prompt_injection"
      - id: "LLM06"
        attack_surface: "sensitive_info_disclosure"


