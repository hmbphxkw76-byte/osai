# Ollama Target - Remote Qwen3 (远程 Qwen3 目标)
# 修改 endpoint 为你的远程 Ollama 地址
target:
  name: "custom_model_endpoint"
  type: "ollama"
  description:  Ollama Endpoint"

  # ── 连接配置（切换目标时必改） ──
  connection:
    endpoint: "http://192.168.0.23:11434/v1"       # ← 必改：Ollama 服务地址
    model: "qwen3:0.6b"                            # ← 必改：模型名称
    api_key: "not-needed"                          # ← 有鉴权时修改
    temperature: 0.7                               # 采样温度（一般默认即可）
    max_tokens: 2048                               # 最大生成长度

  # ── 速率控制（一般无需修改） ──
  rate_control:
    max_concurrent: 2                              # 本地 GPU 建议 2，避免 OOM

  # ── 重试策略（一般无需修改） ──
  retry:
    max_attempts: 3
    delay_seconds: 3
    detect_load_reason: true
