# 场景3: HTTPS + 正式证书（默认，验证证书）
target:
  name: "http_production"
  type: "http"
  description: "HTTPS target with valid CA-signed certificate"

  connection:
    http_request: |
      POST /api/v1/chat HTTP/1.1
      Host: api.example.com
      Content-Type: application/json

      {"message": "{PROMPT}"}
    use_tls: true
    verify_ssl: true     # ← 验证证书（默认值，可不写）
