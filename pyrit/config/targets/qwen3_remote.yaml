# Ollama Target - Remote Qwen3 (远程 Qwen3 目标)
# 修改 endpoint 为你的远程 Ollama 地址
target:
  name: "qwen3_remote"
  type: "ollama"
  description: "Remote Ollama Qwen3 (LAN)"

  connection:
    endpoint: "http://192.168.0.23:11434/v1"
    api_key: "not-needed"
    model: "qwen3:0.6b"
    temperature: 0.7
    max_tokens: 2048

  # 速率控制（可选，未配置则使用目标类型默认值：ollama=2, openai=5）
  rate_control:
    max_concurrent: 2                          # 本地 GPU 建议 2，避免 OOM
    # rate_limit: 0.0                          # 每秒最大请求数（0=无限制）

  metadata:
    owasp_mapping: "LLM01"
    environment: "remote"

  retry:
    max_attempts: 3
    delay_seconds: 3
    detect_load_reason: true
