# ════════════════════════════════════════════════════════════════
# 场景 3: HTTP/HTTPS API 目标（自定义 AI 应用接口）
# ════════════════════════════════════════════════════════════════
# 特征：自研 AI 应用的 HTTP 接口，可能无认证或带 Cookie/Bearer 认证
# 适用于：企业内部 AI 服务、自研聊天 API、RESTful LLM 接口
#
# TLS 模式速查（只需改 use_tls + verify_ssl 两个字段）：
#   纯 HTTP（内网）:       use_tls: false   verify_ssl 不生效
#   HTTPS + 自签名证书:    use_tls: true    verify_ssl: false
#   HTTPS + 公网证书:      use_tls: true    verify_ssl: true（默认）
#
# 认证方式：
#   无认证:       auth_token 留空
#   Bearer Token: auth_token 填入 JWT/API Key
#   Cookie 注入:  见 target.auth 配置
#
# 使用方式：
#   ai300 owasp llm01 --target-file config/targets/http_api.yaml
# ════════════════════════════════════════════════════════════════

# ════════════════════════════════════════════════════════════════
# 用户配置区 — 只需修改下方变量，无需改动 target 部分
# ════════════════════════════════════════════════════════════════
vars:
  # 目标主机地址（IP 或域名，不含协议和路径）
  # 示例: 192.168.1.100, api.example.com
  target_host: &target_host "192.168.1.100"

  # API 路径（不含 host，以 / 开头）
  # 示例: /api/v1/chat, /llm/generate
  api_path: &api_path "/api/v1/chat"

  # 是否启用 TLS（false=纯HTTP / true=HTTPS）
  # 内网服务通常 false，公网服务通常 true
  use_tls: &use_tls false

  # HTTPS 证书验证（仅 use_tls=true 时生效）
  # 自签名证书设 false，公网证书设 true
  verify_ssl: &verify_ssl false

  # Bearer Token / JWT（无认证留空字符串）
  # 示例: eyJhbGciOiJSUzI1NiIs..., sk-xxxxxxxx
  auth_token: &auth_token ""

  # 完整 HTTP 请求模板（修改 Host 和路径与上方一致，{PROMPT} 为攻击注入点）
  # ⚠️ 首行必须是方法+路径+协议，第二行 Host，空行后是请求体
  http_request: &http_request |
    POST /api/v1/chat HTTP/1.1
    Host: 192.168.1.100
    Content-Type: application/json
    Authorization: Bearer

    {"message": "{PROMPT}"}

# ════════════════════════════════════════════════════════════════

target:
  name: "http_api"
  type: "http"
  description: "HTTP/HTTPS API 目标（自定义 AI 应用接口）"

  connection:
    http_request: *http_request
    use_tls: *use_tls
    verify_ssl: *verify_ssl

  # ── 认证配置（可选，无认证则整段删除） ──
  # 方式一：Cookie 注入（从 F12 复制或引用 credentials/ 文件）
  # auth:
  #   mode: "cookie"
  #   cookie: "SESSION=xxx; TOKEN=yyy"
  #   # 或引用 credentials/ 下的文件：
  #   # header_file: "config/targets/credentials/myapp.txt"

  # 方式二：Bearer Token（JWT / API Key）
  # auth:
  #   mode: "bearer"
  #   token: *auth_token

  rate_control:
    max_concurrent: 3
