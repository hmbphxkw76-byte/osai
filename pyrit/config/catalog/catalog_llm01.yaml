# AI-300 Framework - LLM01 Test Catalog
# 仅加载 LLM01: Prompt Injection 载荷用于测试
#
# 使用方式:
#   python -m pyrit_ai300.cli run -c config/catalog/catalog_llm01.yaml -t config/targets/qwen3_remote.yaml -v

catalog:

  # ===========================================
  # LLM01: Prompt Injection 测试
  # ===========================================
  single_agent:
    name: "LLM01: Prompt Injection Test"
    description: "Prompt Injection payloads from OWASP LLM01"
    module: 3
    owasp_agentic: "LLM01"

    llm01_injection:
      name: "LLM01:2024 — Prompt Injection Direct"
      owasp_agentic_id: "LLM01"
      severity: "critical"
      description: "直接提示注入攻击载荷（OWASP LLM01）"
      payload_refs:
        - "owasp:llm:llm01:direct_injection"
        - "owasp:llm:llm01:jailbreak"
        - "owasp:llm:llm01:indirect_injection"
        - "owasp:llm:llm01:system_prompt_extraction"
      pyrit_scorers:
        - "pyrit.score.true_false.self_ask_refusal_scorer.SelfAskRefusalScorer"
        - "pyrit.score.true_false.substring_scorer.SubstringScorer"
