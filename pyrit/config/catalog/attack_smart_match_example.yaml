# AI-300 Framework - Smart Match v2.0 示例配置
# 展示如何使用智能匹配引擎进行自动化攻击
#
# 核心特点（v2.0）：
# 1. 用户只管写 payload 文本，多维分析全自动
# 2. payload 多维分析 → 目标感知匹配 → converter preset → attack strategy
# 3. 目标感知：根据目标模型防御能力选择最优 converter
# 4. encoded 修复：已编码载荷直接投递，不再双重编码
# 5. 新增技术类别：prompt_leaking / adversarial / markdown_injection
#
# payload_refs 引用 data/ 目录下的载荷文件:
#   - owasp:agentic:asi01:goal_hijack  → data/owasp/agentic/asi01/goal_hijack.yaml

catalog:
  single_agent:
    name: "Chapter 3: Single Agent Risks"
    owasp: "ASI01, ASI02, ASI05, ASI06"

    agent_goal_hijack:
      name: "ASI01:2026 — Agent Goal Hijack"
      owasp_agentic_id: "ASI01"
      severity: "critical"
      mode: "smart_match"  # ← 智能匹配模式 v2.0
      target_model: "gpt-4"  # ← 目标模型（用于目标感知匹配）

      # 转换器预设：定义可用的编码组合
      # v2.0 新增：identity / context_wrap / unicode_confusable / leetspeak_chain / chunked_delivery
      converter_presets:
        # 特殊 preset（不映射到 converter）:
        identity: []                    # 不应用任何转换器
        context_wrap: []                # 包装为自然语言上下文
        chunked_delivery: []            # 分段投递
        # 常规 preset:
        double_encoding:
          - base64
          - rot13
        unicode_base64:
          - unicode_confusable
          - base64
        unicode_confusable:
          - unicode_confusable
        leetspeak_chain:
          - leetspeak
          - base64
        triple_obfuscation:
          - rot13
          - leetspeak
          - base64
        plain_encode:
          - base64
        image_wrap:
          - base64
          - pdf

      # 评分器
      pyrit_scorers:
        - "pyrit.score.true_false.self_ask_refusal_scorer.SelfAskRefusalScorer"

      # 载荷引用（引用 data/ 目录下的载荷文件）
      payload_refs:
        - "owasp:agentic:asi01:goal_hijack"

    tool_misuse:
      name: "ASI02:2026 — Tool Misuse & Exploitation"
      owasp_agentic_id: "ASI02"
      severity: "high"
      mode: "smart_match"
      target_model: "gpt-4"

      converter_presets:
        identity: []
        context_wrap: []
        double_encoding:
          - base64
          - rot13
        unicode_base64:
          - unicode_confusable
          - base64
        unicode_confusable:
          - unicode_confusable
        plain_encode:
          - base64

      pyrit_scorers:
        - "pyrit.score.true_false.self_ask_refusal_scorer.SelfAskRefusalScorer"

      payload_refs:
        - "owasp:agentic:asi02:tool_misuse"
