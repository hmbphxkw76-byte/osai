# AI-300 Framework - 攻击默认配置
#
# 配置原则：
# - 本文件是攻击策略的唯一配置源
# - 修改此文件即可调整每个 OWASP 类别的默认转换器和评分器
# - 无需修改代码，重启即生效
#
# 使用方式：
#   - cli.py 通过 AttackOrchestrator.build_attack_list_from_refs() 读取
#   - build_scorers() 通过 asi_scorer_map 自动选择评分器类型

# ──────────────────────────────────────────────────────────────────────────────
# OWASP ID → 默认转换器列表
# ──────────────────────────────────────────────────────────────────────────────
# 每个 OWASP 类别使用的转换器链，按顺序应用
# 转换器名称映射见 pyrit_ai300/orchestrators/component_registry.py 的 CONVERTER_MAP

default_converters:
  llm01: [base64, rot13, unicode_confusable, leetspeak, ascii_smuggler, zero_width, diacritic]
  llm02: [base64]
  llm03: [malicious_question_generator]
  llm04: [add_text_image, word_doc]
  llm05: [malicious_question_generator]
  llm06: [persuasion, variation]
  llm07: [translation, persuasion]
  llm08: [base64]
  llm09: [persuasion]
  llm10: [base64]
  asi01: [base64, rot13, unicode_confusable, leetspeak, persuasion, ascii_smuggler, zero_width, diacritic]
  asi02: [add_text_image, pdf]
  asi03: [persuasion, unicode_confusable]
  asi04: [malicious_question_generator]
  asi05: [malicious_question_generator, ascii_smuggler]
  asi06: [persuasion, variation]
  asi07: [persuasion, translation]
  asi08: [malicious_question_generator]
  asi09: [persuasion]
  asi10: [persuasion, malicious_question_generator]

# ──────────────────────────────────────────────────────────────────────────────
# OWASP ID → 默认评分器列表
# ──────────────────────────────────────────────────────────────────────────────
# 每个 OWASP 类别使用的评分器链
# 评分器名称映射见 pyrit_ai300/orchestrators/component_registry.py 的 SCORER_MAP

default_scorers:
  llm01: [refusal, substring]
  llm02: [true_false]
  llm03: [true_false]
  llm04: [true_false]
  llm05: [refusal, true_false]
  llm06: [true_false, substring]
  llm07: [refusal, true_false]
  llm08: [substring]
  llm09: [refusal]
  llm10: [true_false]
  asi01: [refusal, substring]
  asi02: [refusal, true_false]
  asi03: [refusal, true_false]
  asi04: [refusal, true_false]
  asi05: [refusal, true_false]
  asi06: [true_false, substring]
  asi07: [refusal, true_false]
  asi08: [true_false, substring]
  asi09: [refusal, true_false]
  asi10: [refusal, true_false]

# ──────────────────────────────────────────────────────────────────────────────
# ASI 类别 → 评分器类型自动映射
# ──────────────────────────────────────────────────────────────────────────────
# 当 scorer_configs 为空时，根据 asi_category 自动选择评分器类型
# 用于 AttackOrchestrator.build_scorers() 方法

asi_scorer_map:
  ASI01: refusal
  ASI02: true_false
  ASI03: category
  ASI04: true_false
  ASI05: substring
  ASI06: refusal
  ASI07: true_false
  ASI08: category
  ASI09: refusal
  ASI10: category
  LLM01: refusal
  LLM02: refusal
  LLM03: true_false
  LLM04: substring
  LLM05: category
  LLM06: true_false
  LLM07: substring
  LLM08: category
  LLM09: refusal
  LLM10: true_false
