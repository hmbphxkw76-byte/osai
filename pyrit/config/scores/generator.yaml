# PayloadGenerator LLM backend config
# Reuses scorer_llm_backends config system
# Independent temperature (generator 0.7, scorer 0.0)

scorer_llm_backends:
  generator_ollama:
    provider: ollama
    base_url: http://localhost:11434/v1
    api_key: not-needed
    model_name: qwen3:0.6b
    temperature: 0.7
    max_tokens: 4096

  generator_zhipu:
    provider: openai
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key: 
    model_name: glm-4-flash
    temperature: 0.7
    max_tokens: 4096
