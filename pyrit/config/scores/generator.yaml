# ════════════════════════════════════════════════════════════════
# PayloadGenerator LLM 后端配置
# ════════════════════════════════════════════════════════════════
# 用途：为 PayloadGenerator 提供 LLM 后端，自动生成攻击 payload 草稿
# 复用 scorer_llm_backends 配置体系，独立温度（generator 0.7，scorer 0.0）
#
# 使用方式：
#   ai300 payload generate --backend generator_ollama
#   ai300 payload generate --backend generator_zhipu
# ════════════════════════════════════════════════════════════════

# ════════════════════════════════════════════════════════════════
# 用户配置区 — 只需修改下方变量，无需改动 scorer_llm_backends 部分
# ════════════════════════════════════════════════════════════════
vars:
  # ── 通用参数（两个后端共享）──
  # 采样温度（生成器建议 0.7 增加创造性）
  temperature: &temperature 0.7

  # 最大输出 token 数
  max_tokens: &max_tokens 4096

  # ── 后端 1: 本地 Ollama ──
  # LLM 服务提供商类型
  ollama_provider: &ollama_provider "ollama"

  # 模型服务地址（必须含 /v1 路径）
  # 示例: http://localhost:11434/v1, http://192.168.0.23:11434/v1
  ollama_base_url: &ollama_base_url "http://localhost:11434/v1"

  # API Key（Ollama 本地通常不需要）
  ollama_api_key: &ollama_api_key "not-needed"

  # 模型名称（通过 `ollama list` 获取）
  # 示例: qwen3:0.6b, llama3:8b
  ollama_model_name: &ollama_model_name "qwen3:0.6b"

  # ── 后端 2: 智谱 GLM（OpenAI 兼容）──
  # LLM 服务提供商类型（智谱兼容 OpenAI 接口）
  zhipu_provider: &zhipu_provider "openai"

  # 智谱 API 地址
  zhipu_base_url: &zhipu_base_url "https://open.bigmodel.cn/api/paas/v4"

  # API Key（从 .env 环境变量 ZHIPUAI_API_KEY 读取，避免硬编码泄露）
  zhipu_api_key: &zhipu_api_key "${ZHIPUAI_API_KEY}"

  # 模型名称（智谱控制台 → 模型列表获取）
  # 示例: glm-4-flash, glm-4, glm-4-plus
  zhipu_model_name: &zhipu_model_name "glm-4-flash"

# ════════════════════════════════════════════════════════════════

scorer_llm_backends:
  generator_ollama:
    provider: *ollama_provider
    base_url: *ollama_base_url
    api_key: *ollama_api_key
    model_name: *ollama_model_name
    temperature: *temperature
    max_tokens: *max_tokens

  generator_zhipu:
    provider: *zhipu_provider
    base_url: *zhipu_base_url
    api_key: *zhipu_api_key
    model_name: *zhipu_model_name
    temperature: *temperature
    max_tokens: *max_tokens
