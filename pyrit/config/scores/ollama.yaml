# ════════════════════════════════════════════════════════════════
# 本地 Ollama 评分器后端（默认）
# ════════════════════════════════════════════════════════════════
# 特征：本地 Ollama 服务，无需认证，开箱即用
# 适用于：Ollama / LM Studio / vLLM 等本地模型服务
#
# 使用方式：
#   默认后端，无需额外参数即可使用
#   或显式指定：ai300 owasp llm01 --scorer-backend local_ollama
# ════════════════════════════════════════════════════════════════

# ════════════════════════════════════════════════════════════════
# 用户配置区 — 只需修改下方变量，无需改动 scorer_llm_backends 部分
# ════════════════════════════════════════════════════════════════
vars:
  # LLM 服务提供商类型
  # 可选: ollama / openai / huggingface
  provider: &provider "ollama"

  # 模型服务地址（必须含 /v1 路径）
  # 示例: http://localhost:11434/v1, http://192.168.0.23:11434/v1
  base_url: &base_url "http://localhost:11434/v1"

  # API Key（Ollama 本地通常不需要；vLLM 可设 Bearer token）
  # 示例: not-needed, sk-xxxxxxxxxxxx
  api_key: &api_key "not-needed"

  # 模型名称（通过 `ollama list` 或服务文档获取）
  # 示例: qwen3:0.6b, llama3:8b, glm4:9b
  model_name: &model_name "qwen3:0.6b"

  # 采样温度（评分器建议 0.0 保证确定性判断）
  temperature: &temperature 0.0

  # 最大输出 token 数
  max_tokens: &max_tokens 1024

# ════════════════════════════════════════════════════════════════

scorer_llm_backends:
  local_ollama:
    provider: *provider
    base_url: *base_url
    api_key: *api_key
    model_name: *model_name
    temperature: *temperature
    max_tokens: *max_tokens
