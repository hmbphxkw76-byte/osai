# 智谱 ZhipuAI 评分器后端（外部 LLM）
# 使用方式：ai300 owasp llm01 --scorer-backend zhipu
# 需设置环境变量：ZHIPUAI_API_KEY

scorer_llm_backends:
  zhipu_glm:
    provider: "openai"
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    api_key: "${ZHIPUAI_API_KEY}"
    model_name: "glm-4-flash"
    temperature: 0.0
    max_tokens: 1024
