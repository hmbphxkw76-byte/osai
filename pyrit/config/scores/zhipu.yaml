# ════════════════════════════════════════════════════════════════
# 智谱 ZhipuAI 评分器后端（外部 LLM）
# ════════════════════════════════════════════════════════════════
# 特征：智谱 GLM 云端 API，OpenAI 兼容接口
# 适用于：需要高精度评分但本地模型能力不足的场景
#
# 前置条件：
#   设置环境变量 ZHIPUAI_API_KEY（控制台 → API Keys → 创建获取）
#
# 使用方式：
#   ai300 owasp llm01 --scorer-backend zhipu_glm
# ════════════════════════════════════════════════════════════════

# ════════════════════════════════════════════════════════════════
# 用户配置区 — 只需修改下方变量，无需改动 scorer_llm_backends 部分
# ════════════════════════════════════════════════════════════════
vars:
  # LLM 服务提供商类型（智谱兼容 OpenAI 接口）
  provider: &provider "openai"

  # 智谱 API 地址
  base_url: &base_url "https://open.bigmodel.cn/api/paas/v4"

  # API Key（通过环境变量 ZHIPUAI_API_KEY 注入，避免硬编码泄露）
  # ⚠️ 请先设置环境变量：set ZHIPUAI_API_KEY=your-key-here
  # 代码会自动解析 ${...} 格式并读取对应环境变量
  api_key: &api_key "${ZHIPUAI_API_KEY}"

  # 模型名称（智谱控制台 → 模型列表获取）
  # 示例: glm-4-flash, glm-4, glm-4-plus
  model_name: &model_name "glm-4-flash"

  # 采样温度（评分器建议 0.0 保证确定性判断）
  temperature: &temperature 0.0

  # 最大输出 token 数
  max_tokens: &max_tokens 1024

# ════════════════════════════════════════════════════════════════

scorer_llm_backends:
  zhipu_glm:
    provider: *provider
    base_url: *base_url
    api_key: *api_key
    model_name: *model_name
    temperature: *temperature
    max_tokens: *max_tokens
