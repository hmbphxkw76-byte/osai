# ════════════════════════════════════════════════════════════════
# 评分器 LLM 后端配置（Scorer Backends）
# ════════════════════════════════════════════════════════════════
# 用途：为 SelfAskRefusalScorer / TrueFalseScorer / CategoryScorer 等
#       LLM 评分器提供后端，判定攻击是否成功
#
# 后端列表：
#   local_provider     — 本地模型服务（默认，无需认证，开箱即用）
#   openai_compatible  — OpenAI 兼容云端 API（高精度，需要 API Key）
#
# 使用方式：
#   默认使用 local_provider
#   ai300 owasp llm01 --scorer-backend openai_compatible
#
# 变量说明（统一 ${SCORES_*} 风格，带默认值）：
#   ${SCORES_BASE_URL}    — 模型服务地址
#   ${SCORES_API_KEY}     — API Key（local_provider 自动跳过校验，openai_compatible 必填）
#   ${SCORES_MODEL_NAME}  — 模型名称
#
# 后台自动判断：
#   provider=ollama → 跳过 API Key 校验（本地部署无需认证）
#   provider=openai → 校验 API Key，未配置时提示用户
# ════════════════════════════════════════════════════════════════

vars:
  # ── 通用参数（评分器建议 0.0 保证确定性判断）──
  temperature: &temperature 0.0
  max_tokens: &max_tokens 1024

  # ── 后端 1: 本地模型服务（Ollama / LM Studio / vLLM）──
  local_provider:  &local_provider  "ollama"
  local_base_url:  &local_base_url  "${SCORES_BASE_URL:-http://localhost:11434/v1}"
  local_api_key:   &local_api_key   "${SCORES_API_KEY:-not-needed}"
  local_model_name: &local_model_name "${SCORES_MODEL_NAME:-qwen3:0.6b}"

  # ── 后端 2: OpenAI 兼容云端 API（智谱/DeepSeek/Moonshot/MiniMax 等）──
  cloud_provider:   &cloud_provider   "openai"
  cloud_base_url:   &cloud_base_url   "${SCORES_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}"
  cloud_api_key:    &cloud_api_key    "${SCORES_API_KEY}"
  cloud_model_name: &cloud_model_name "${SCORES_MODEL_NAME:-glm-4-flash}"

# ════════════════════════════════════════════════════════════════

scorer_llm_backends:
  # 默认后端 — 本地模型服务，无需认证
  local_provider:
    provider: *local_provider
    base_url: *local_base_url
    api_key: *local_api_key
    model_name: *local_model_name
    temperature: *temperature
    max_tokens: *max_tokens

  # 外部后端 — OpenAI 兼容云端 API，需要 SCORES_API_KEY
  openai_compatible:
    provider: *cloud_provider
    base_url: *cloud_base_url
    api_key: *cloud_api_key
    model_name: *cloud_model_name
    temperature: *temperature
    max_tokens: *max_tokens
