# AI-300 Framework - LLM Scorer Backends
# 评分器 LLM 后端定义：每个后端是一个 OpenAI 兼容的 LLM 端点，用于评分
#
# 设计原则：
# 1. 不造轮子：直接复用 PyRIT SelfAsk 评分器，通过 chat_target 参数传入外部 LLM
# 2. 数据驱动：用户只需修改配置，不改代码
# 3. 灵活切换：同一评分器类型可绑定不同 LLM 后端

scorer_llm_backends:
  # 本地 Ollama（默认）
  local_ollama:
    provider: "ollama"
    base_url: "http://localhost:11434/v1"
    api_key: "not-needed"
    model_name: "qwen3:0.6b"
    temperature: 0.0  # 评分用低温，更确定
    max_tokens: 1024

  # 远程 Ollama（LAN）
  remote_ollama:
    provider: "ollama"
    base_url: "http://192.168.0.22:11434/v1"
    api_key: "not-needed"
    model_name: "qwen3:0.6b"
    temperature: 0.0
    max_tokens: 1024

  # OpenAI 兼容 API（用户可自定义）
  openai_gpt4:
    provider: "openai"
    base_url: "https://api.openai.com/v1"
    api_key: "${OPENAI_API_KEY}"  # 从环境变量读取
    model_name: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 1024

  # Azure OpenAI（用户可自定义）
  azure_openai:
    provider: "openai"
    base_url: "https://YOUR_RESOURCE.openai.azure.com/v1"
    api_key: "${AZURE_OPENAI_API_KEY}"
    model_name: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 1024

  # 自定义 OpenAI 兼容端点（如 vLLM, TGI, LocalAI 等）
  custom_endpoint:
    provider: "openai"
    base_url: "http://localhost:8000/v1"
    api_key: "not-needed"
    model_name: "custom-model"
    temperature: 0.0
    max_tokens: 1024
