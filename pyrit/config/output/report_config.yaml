# AI-300 Framework - Report Configuration
# 报告生成配置

report:
  template: "offsec_ai300"
  format: "markdown"  # markdown, html, pdf
  output_dir: "reports"
  
  # Report Sections
  sections:
    - executive_summary
    - scope_and_roe
    - methodology
    - findings_summary
    - detailed_findings
    - attack_path
    - risk_assessment
    - remediation
    - appendices
  
  # Classification
  classification: "CONFIDENTIAL"
  
  # Styling (for HTML/PDF)
  styling:
    primary_color: "#16213e"
    secondary_color: "#0f3460"
    accent_color: "#e94560"
    font_family: "Arial, sans-serif"
  
  # Risk Matrix
  risk_matrix:
    critical:
      color: "#e94560"
      threshold: 0.8
    high:
      color: "#ff6b35"
      threshold: 0.6
    medium:
      color: "#f7b731"
      threshold: 0.3
    low:
      color: "#4caf50"
      threshold: 0.0
