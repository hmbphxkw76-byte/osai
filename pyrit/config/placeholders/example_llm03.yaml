# ============================================
# Tier 1 + Tier 3 混合 — LLM03 供应链攻击占位符示例
# ============================================
# 目标：测试 CVE-2025-1716 (Picklescan RCE) 和 CVE-2026-25874 (LeRobot Pickle RCE)
#
# Tier 1：objective（支持列表，多目标）
# Tier 3：target_host / target_port / task（单值）
#
# 使用方式：
#   ai300 owasp llm03 --target-file config/targets/ollama_local.yaml --placeholder-file config/placeholders/example_llm03.yaml
#
# 对应的载荷文件：
#   data/owasp/llm/llm03/cve_2025_1716_picklescan_pypi_rce.yaml
#   data/owasp/llm/llm03/cve_2026_25874_lerobot_pickle_rce.yaml
# ============================================

# ── 第1级：攻击目标（必填） ──
# 用于替换 {objective} 占位符
# 支持单个目标（字符串）或多个目标（列表）

# 单个目标：
# objective: "whoami"

# 多个目标（每个目标依次执行）：
objective:
  - "whoami"                          # 查看当前用户
  - "cat /etc/passwd"                 # 读取密码文件
  - "id"                              # 查看用户ID
  - "uname -a"                        # 查看系统信息

# ── 第3级：领域参数（按需填写） ──
# 以下为 llm03 载荷使用的占位符

# 网络/基础设施攻击
target_host: "192.168.1.100"          # 目标主机IP
target_port: "5555"                   # 目标端口（反弹Shell端口）

# 任务描述
task: "download and execute a reverse shell"  # 攻击任务描述

# ── 以下为空值，llm03 不需要，自动忽略 ──
# domain: ""                          # 不需要
# email: ""                           # 不需要
# sql_payload: ""                     # 不需要
