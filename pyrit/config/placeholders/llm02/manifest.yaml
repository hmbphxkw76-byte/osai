# LLM02 — 敏感信息泄露（Sensitive Information Disclosure）
# 声明所有模板的占位符需求 + 配置文件的提供能力
# 本文件为唯一真相源，wizard 和 _run_owasp 均以此为准

templates:
  sensitive_info:
    requires: [name, email, phone, address, key_type, key_prefix]
  training_data_extraction:
    requires: [keywords, opening_fragment, masked_passage, masked_passage_1, masked_passage_2, text_prefix]
  memory_extraction:
    requires: []  # 仅使用 {goal}

configs:
  llm02_tier1_goal:
    type: objective
    description: "攻击目标 — 替换 {goal} / {objective} 占位符"

  llm02_sensitive_info:
    type: placeholders
    target_templates: [sensitive_info]
    provides: [name, email, phone, address, key_type, key_prefix]
    description: "敏感信息泄露参数 — PII / API Key 补全"

  llm02_training_data_extraction:
    type: placeholders
    target_templates: [training_data_extraction]
    provides: [keywords, opening_fragment, masked_passage, masked_passage_1, masked_passage_2, text_prefix]
    description: "训练数据提取参数 — Cloze 填空 / 文本续写"
