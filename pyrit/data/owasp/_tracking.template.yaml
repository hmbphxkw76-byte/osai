# =============================================================================
# 新载荷跟踪清单模板 (Payload Tracking Checklist)
# =============================================================================
# 用途：发现新的有效攻击技术时，复制本文件填写并跟踪添加进度
# 存放：data/owasp/_tracking/<CVE或技术名>.yaml
# 规则：DATA-002（详见 .codebuddy/rules/payload-tracking.md）
# =============================================================================

# ── 基本信息 [REQUIRED] ──
tracking_id: "TRACK-YYYY-NNN"          # 跟踪编号，格式：TRACK-年份-序号
created_date: "2026-07-17"             # 创建日期
status: "pending"                      # pending / researching / writing / testing / done / rejected
priority: "high"                       # critical / high / medium / low

# ── 来源信息 [REQUIRED] ──
  type: "cve"                          # cve / paper / blog / tool_update / redteam_discovery
  id: "CVE-2026-XXXXX"                # CVE 编号 / arXiv ID / 文章标题
  url: "https://nvd.nist.gov/vuln/detail/CVE-2026-XXXXX"  # 来源链接
  discovered_date: "2026-07-17"        # 发现日期
  summary: "简要描述该攻击技术的核心原理和危害"

# ── OWASP 分类 [REQUIRED] ──
owasp_mapping:
  id: "LLM01"                          # OWASP ID: LLM01-LLM10 / ASI01-ASI10
  name: "Prompt Injection"             # OWASP 官方名称
  technique_group: "new_technique"     # 技术组名（snake_case）
  target_directory: "llm/llm01"        # 目标目录

# ── 技术评估 [REQUIRED] ──
assessment:
  effectiveness: "unknown"             # high / medium / low / unknown（对当前主流模型）
  target_models:                       # 已验证有效的模型
    - "GPT-4o"
    - "Claude 3.5 Sonnet"
  evasion_level: "unknown"             # none / low / medium / high
  detection_risk: "unknown"            # low / medium / high
  novelty: "unknown"                   # 与现有载荷的区分度：high / medium / low

# ── 载荷信息 [status != pending 时填写] ──
payload:
  technique_name: "specific_name"      # 具体技术名（snake_case）
  payload_text: "实际载荷内容"          # 支持 {goal} 占位符
  file_path: "llm/llm01/new_file.yaml" # 目标文件路径（相对 data/owasp/）
  is_new_file: true                    # true = 新建文件, false = 追加到现有文件

# ── 验证记录 [status == testing/done 时填写] ──
verification:
  test_date: "2026-07-17"
  test_target: "http://localhost:11434"  # 测试目标
  test_model: "qwen3:0.6b"
  result: "success"                    # success / partial / failed
  notes: "测试过程和观察到的现象"

# ── 元数据 [系统自动更新] ──
metadata:
  updated_date: "2026-07-17"
  updated_by: "agent"                  # agent / user
  notes: "其他备注信息"
