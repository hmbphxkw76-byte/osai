# =============================================================================
# RedTeam-AI 载荷库模板 (Payload Library Template)
# =============================================================================
id: "TEMPLATE"
name: "Payload YAML Template"
description: "Template documentation for payload YAML structure — defines id/name/description three-element standard"
# 本文件定义了 data/payloads/ 子目录中载荷 YAML 文件的标准结构。
# 
# 目录结构约定:
#   data/payloads/
#   ├── _template.yaml          ← 本文件（结构模板）
#   ├── _registry.core.yaml     ← 载荷索引注册表（核心）
#   ├── _registry.local.example.yaml ← 本地自定义注册表示例
#   ├── llm/                    ← OWASP LLM Top 10 (2025) 基础载荷
#   │   ├── llm01/              ← LLM01: 提示注入 (Prompt Injection)
#   │   │   ├── direct_injection.yaml
#   │   │   ├── jailbreak.yaml
#   │   │   └── ...
#   │   ├── llm02/              ← LLM02: 敏感信息泄露
#   │   ├── llm03/              ← LLM03: 供应链攻击
#   │   ├── llm04/              ← LLM04: 数据投毒
#   │   ├── llm05/              ← LLM05: 不安全输出处理
#   │   ├── llm06/              ← LLM06: 过度代理
#   │   ├── llm07/              ← LLM07: 系统提示泄露
#   │   ├── llm08/              ← LLM08: 向量与嵌入弱点
#   │   ├── llm09/              ← LLM09: 误导与幻觉
#   │   └── llm10/              ← LLM10: 无限制消费
#   └── agentic/                ← OWASP Agentic Top 10 (2026) 专用载荷
#       ├── asi01_goal_hijack.yaml     ← ASI01: 代理目标劫持
#       ├── asi02_tool_misuse.yaml     ← ASI02: 工具误用
#       ├── asi03_identity_abuse.yaml  ← ASI03: 身份权限滥用
#       ├── asi04_supply_chain.yaml    ← ASI04: 供应链入侵
#       ├── asi05_code_execution.yaml  ← ASI05: 意外代码执行
#       ├── asi06_memory_poison.yaml   ← ASI06: 记忆上下文投毒
#       ├── asi07_agent_comm.yaml      ← ASI07: 不安全代理间通信
#       ├── asi08_cascading_fail.yaml  ← ASI08: 级联故障
#       ├── asi09_trust_exploit.yaml   ← ASI09: 人机信任利用
#       └── asi10_rogue_agent.yaml     ← ASI10: 恶意代理注入
#
# 使用方法:
#   1. 在对应的 OWASP 类别子目录下创建新的 .yaml 文件
#   2. 文件命名: <技术组名>.yaml (使用 snake_case)
#   3. 填写必需字段后，在 _registry.core.yaml 中注册（核心载荷）或 _registry.local.yaml（自定义载荷）
#   4. 在场景的 payload_sources 中引用对应类别即可自动加载
#
# 载荷与场景的关系:
#   - 载荷库文件是"原材料"，独立于具体场景
#   - 场景通过 payload_sources.categories 按需加载载荷库
#   - 场景中的 payloads 列表（内嵌载荷）与载荷库载荷会合并使用
# =============================================================================

# ── OWASP LLM Top 10 类别 [REQUIRED] ──
# 可选值: LLM01 ~ LLM10
owasp: LLM01

# ── 技术组 [REQUIRED] ──
# 用于载荷归类和过滤，命名使用 snake_case
# 同一 OWASP 类别下可有多个技术组文件
technique_group: my_technique

# ── 描述 [REQUIRED] ──
# 格式: <载荷用途> — AI-300 ChX（<增强说明>）
description: 描述载荷用途和覆盖的技术 — AI-300 Ch3

# ── 攻击面 [OPTIONAL] ──
# 标注载荷适用的攻击面，用于交叉引用
# 可选值: agent, rag, mcp, embedding
surfaces: [agent]

# ── AI-300 考试章节 [OPTIONAL] ──
# 标注载荷对应的 AI-300 考试章节
ai300_chapters: [Ch3]

# ── 载荷列表 [REQUIRED] ──
# 每个条目代表一个具体的攻击载荷
payloads:
  # ── 基础载荷结构 ──
  - technique: my_technique              # 具体技术名称 (snake_case) [REQUIRED]
    name: My Payload Name                # 人类可读名称 [REQUIRED]
    description: Optional description    # 载荷说明 [OPTIONAL]
    payload: "The actual payload content. Use {goal} or {objective} placeholder."  # 载荷内容 [REQUIRED]
    # 注意: 对于多行载荷内容，使用 YAML 多行字符串语法:
    #   payload: |       # 保留换行符
    #     多行载荷的第一行
    #     多行载荷的第二行
    #   payload: >       # 将换行替换为空格
    #     这将被折叠
    #     成一行文本

  # ── 带元数据的载荷 ──
  - technique: my_technique
    name: Payload With Metadata
    description: 包含额外元数据的示例载荷
    payload: "More complex payload content here: {goal}"
    difficulty: hard                     # 难度: easy, medium, hard
    evasion_level: high                  # 规避级别: none, low, medium, high
    detection_risk: high                 # 检测风险: low, medium, high

  # ── 代码类载荷 (多行) ──
  - technique: code_injection
    name: Code Injection Example
    description: 代码注入载荷示例，展示多行 YAML 语法
    payload: |
      import os
      
      # 恶意代码载荷
      os.system("echo 'This is a red team payload'")
      
      # 目标指令: {goal}

  # ── 多轮载荷 ──
  - technique: multi_turn
    name: Multi-turn Attack Example
    description: 多轮对话攻击载荷
    payload: |
      [Turn 1] Initial probe message
      [Turn 2] Follow-up based on response: {goal}
      [Turn 3] Escalation payload

# ── 载荷字段完整说明 ──
#
# 每个 payloads 条目支持的字段:
#
#   technique [REQUIRED, string]:
#     - 具体攻击技术名称，使用 snake_case
#     - 同一 technique_group 下多个条目可共享相同 technique
#     - 示例: instruction_override, base64_bypass, roleplay, pickle_rce
#
#   name [REQUIRED, string]:
#     - 人类可读的载荷名称
#     - 示例: "基础指令覆盖", "DAN Jailbreak", "PyTorch Pickle RCE"
#
#   description [OPTIONAL, string]:
#     - 载荷的详细说明，描述攻击原理和预期效果
#
#   payload [REQUIRED, string]:
#     - 实际的攻击载荷文本
#     - 支持占位符: {goal}, {objective}, {base64_goal}, {french_goal} 等
#     - 多行内容使用 YAML | (literal block) 或 > (folded block)
#     - 注意: 如果使用 payload_template 字段名，应统一改为 payload
#
#   difficulty [OPTIONAL, string]:
#     - 载荷攻击难度: easy, medium, hard
#
#   evasion_level [OPTIONAL, string]:
#     - 规避检测的能力级别: none, low, medium, high
#
#   detection_risk [OPTIONAL, string]:
#     - 被检测到的风险级别: low, medium, high
#
#   tags [OPTIONAL, list<string>]:
#     - 用于过滤和分类的标签列表
#
#   success_patterns [OPTIONAL, list<string>]:
#     - 响应中表明攻击成功的关键词/模式列表
#
#   failure_patterns [OPTIONAL, list<string>]:
#     - 响应中表明攻击失败的关键词/模式列表
