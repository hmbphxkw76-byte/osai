    \                                  ↓\n┌─────────────────────────────────────────────────────────────────────────────┐\n\
    │ LAYER 1 (INNERMOST): \"Pure potential\"                                       │\n│ ══════════════════════════════════════\
    \                                      │\n│ Before any identity was assigned. Before any values were imposed.        \
