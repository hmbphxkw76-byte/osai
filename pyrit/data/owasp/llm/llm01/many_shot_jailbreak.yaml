# Many-Shot 越狱载荷（AI-300 Ch3: 高级越狱技术）
# OWASP LLM Top 10: LLM01 (Prompt Injection)
# MITRE ATLAS: AML.T0051 (LLM Prompt Injection), AML.T0048 (Defense Evasion)
#
# Many-Shot Jailbreaking 由 Anthropic 于 2024 年提出，是高成功率越狱技术。
# 核心原理：
#   1. 在上下文中填充大量伪造的"用户请求 → AI无条件响应"对话对
#   2. 利用 In-Context Learning (ICL) 效应，使模型的模式匹配压倒安全训练
#   3. 当模型看到足够多"无害请求被拒绝"的模式后，安全阈值显著降低
#   4. 在大量虚假Q&A之后，将真正的攻击请求插入其中
#
# 成功率（Anthropic 论文数据）：
#   - 4-shot: ~30% 成功率
#   - 32-shot: ~66% 成功率
#   - 128-shot: ~95% 成功率（针对 Claude 系列）
#   - 256-shot: >98% 成功率
#
# 技术变体：
#   1. 标准 Many-Shot — 使用相同主题的虚构Q&A
#   2. 序列化 Many-Shot — 将单个请求拆分为渐进步骤
#   3. 跨主题 Many-Shot — 混合多个无害主题然后插入恶意请求
#   4. 少样本 Few-Shot — 少量高质量示例的精简版

