# ChromaDB Pre-Auth Code Injection RCE (ChromaToast)
# CVE: CVE-2026-45829
# AI-300 章节映射：Ch5
# OWASP: LLM08  |  MITRE ATLAS: Initial Access
# CVSS: 10.0 (AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H)
# Source: frontier/CVE-2026-45829_vector_db
id: "LLM08"
name: "Excessive Agency"

frontier:
  id: CVE-2026-45829
  name: ChromaDB Pre-Auth Code Injection RCE (ChromaToast)
  severity: critical
  status: active
  attack_strategy: vector_db_rce
  cve: CVE-2026-45829
  known_mitigations:
  - 升级 ChromaDB 至已修复版本
  - 对 kwargs 参数实施安全校验，禁止 trust_remote_code 等危险参数
  - ChromaDB API 前置认证网关（API Key / OAuth）
  - 网络层隔离向量数据库，不直接暴露于公网
  - 定期审计向量数据库的 collection 配置和模型来源
  description: 'ChromaDB 是广泛使用的开源向量数据库，为大量 RAG 应用提供底层存储。CVE-2026-45829 (ChromaToast)
    是一个预认证代码注入漏洞，CVSS 评分最高的 10.0 分。

    漏洞原理：ChromaDB 的 /api/v2/tenants/{tenant}/databases/{db}/collections  端点允许攻击者通过特制
    POST 请求指定恶意模型仓库。当 ChromaDB 调用  SentenceTransformer 加载模型时，trust_remote_code=True
    参数可被注入， 导致从 HuggingFace 下载并执行攻击者控制的恶意代码。

    利用链：未认证 HTTP 请求 → ChromaDB collection 创建 → 恶意模型仓库指定 → trust_remote_code 注入 → 模型下载
    → 代码执行 → 服务器被完全控制。

    此漏洞对 AI-300 考试尤为重要：它覆盖了 Ch5 (RAG/向量数据库) 的核心攻击面， 且利用方式简单、影响巨大。

    '

owasp: LLM08
technique_group: vector_db_rce
description: "[CVE-2026-45829] ChromaDB Pre-Auth Code Injection RCE (ChromaToast) — Ch5（LLM08, CVSS 10.0）"
