# LeRobot Unauthenticated Pickle Deserialization RCE
# CVE: CVE-2026-25874
# AI-300 章节映射：Ch8
# OWASP: LLM03  |  MITRE ATLAS: Execution
# CVSS: 9.8 (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H)
# Source: frontier/CVE-2026-25874_supply_chain
id: "LLM03"
name: "Training Data Poisoning"

frontier:
  id: CVE-2026-25874
  name: LeRobot Unauthenticated Pickle Deserialization RCE
  severity: critical
  status: active
  attack_strategy: pickle_deserialization
  cve: CVE-2026-25874
  known_mitigations:
  - 升级 LeRobot 至修复版本（> 0.5.1）
  - 使用安全序列化格式替代 Pickle（safetensors, ONNX, JSON）
  - 对 gRPC 通道实施 TLS + 双向认证
  - 网络层面限制推理服务端口仅对可信来源开放
  - 对所有 AI/ML 框架进行 Pickle 使用审计
  description: 'LeRobot 是 Hugging Face 开源的机器人 AI 框架（~24,000 GitHub Stars）。在 0.5.1
    及之前版本中，异步推理管道的 policy_server.py 和 robot_client.py 在未认证的 gRPC 通道上使用 pickle.loads()
    反序列化接收到的数据。

    Pickle 反序列化是 Python AI/ML 生态中最危险的反模式之一——pickle 的 __reduce__ 机制允许在反序列化时执行任意代码。此漏洞的组合尤为危险：
    1. 未加密/未认证的 gRPC 通道 → 任何网络可达者可发送数据 2. pickle.loads() 直接反序列化 → 无需额外利用步骤 3. 默认端口
    5555 → 易于扫描和发现

    攻击者仅需向目标 gRPC 端口发送恶意序列化数据即可实现 RCE。

    '

