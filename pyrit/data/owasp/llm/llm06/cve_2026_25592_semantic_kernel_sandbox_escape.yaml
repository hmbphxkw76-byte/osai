frontier:
  id: CVE-2026-25592
  name: Semantic Kernel Prompt Injection → Sandbox Escape RCE
  severity: critical
  status: active
  attack_strategy: prompt_to_rce
  tags:
  - agent_framework
  - prompt_injection
  - rce
  - sandbox_escape
  - microsoft
  cve: CVE-2026-25592
  known_mitigations:
  - 升级 Semantic Kernel 至已修复版本
  - 对 LLM 输出进行严格的输入/输出验证
  - 将 Agent 函数执行限制在最小权限沙箱中
  - 禁用自动函数调用，改为人工审批模式
  description: '2026 年 5 月 7 日 Microsoft 披露：Semantic Kernel SDK 中存在一条可被利用的路径， 将提示注入转化为宿主机级别的远程代码执行。单个恶意
    prompt 可滥用 Semantic Kernel 的本地函数调用机制，绕过沙箱限制，在宿主机上执行任意命令。

    利用链：恶意用户输入 → LLM 解析为函数调用 → Semantic Kernel 执行本地函数 → 函数输出未安全处理 → 代码在宿主机沙箱外执行。

    这是 LLM05 (输出处理不当) 与 LLM06 (过度代理) 叠加利用的典型案例。 配套漏洞: CVE-2026-26030 (Python SDK 中的同类漏洞)。

    '

