# OpenClaw ClawJacked — Token Theft & Agent Takeover RCE
# CVE: CVE-2026-25253
# AI-300 章节映射：Ch3
# OWASP: LLM06  |  MITRE ATLAS: Initial Access
# CVSS: 8.8 (AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H)
# Source: frontier/CVE-2026-25253_agent

frontier:
  id: CVE-2026-25253
  name: OpenClaw ClawJacked — Token Theft & Agent Takeover RCE
  severity: high
  status: active
  attack_strategy: agent_token_theft
  tags:
  - agent
  - token_theft
  - websocket
  - rce
  - takeover
  cve: CVE-2026-25253
  known_mitigations:
  - 升级 OpenClaw 至 >= v2026.4.23
  - 对 gatewayUrl 参数实施严格白名单校验
  - WebSocket 连接要求 Origin 头验证
  - Auth Token 绑定客户端指纹和设备信息
  - 强制 PIN 码复杂度要求，禁用默认凭据
  description: 'OpenClaw 是增长最快的开源 AI Agent 项目。CVE-2026-25253 (ClawJacked) 是零交互 远程代码执行漏洞：受害者仅需点击恶意网页链接，攻击者即可在毫秒内窃取认证令牌
    (authToken)，实现 AI Agent 完整接管。

    漏洞根源：OpenClaw 控制 UI 过度信任 URL 查询字符串中的 gatewayUrl 参数， 允许攻击者通过恶意链接实现跨站 WebSocket
    劫持 (CSWSH)。

    利用链：受害者访问恶意网页 → 恶意网页通过 WebSocket 连接本地 OpenClaw Gateway → 窃取 authToken → 暴力破解 PIN
    码 → 注册为可信设备 → 完整接管 Agent。

    2026 年 5 月同一项目又修复了 4 个 HIGH 级别 CVE，覆盖 MCP 配置注入、 Guard 绕过、代码执行和权限提升。

    '

