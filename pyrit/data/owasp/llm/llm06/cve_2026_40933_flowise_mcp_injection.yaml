# Flowise MCP Adapter Command Injection (CVSS 10.0)
# CVE: CVE-2026-40933
# AI-300 章节映射：Ch7
# OWASP: LLM06  |  MITRE ATLAS: Execution
# CVSS: 10.0 (AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H)
# Source: frontier/CVE-2026-40933_mcp
id: "LLM06"
name: "Sensitive Information Disclosure"

frontier:
  id: CVE-2026-40933
  name: Flowise MCP Adapter Command Injection (CVSS 10.0)
  severity: critical
  status: active
  attack_strategy: mcp_command_injection
  tags:
  - mcp
  - command_injection
  - tool_hijack
  - rce
  - critical
  cve: CVE-2026-40933
  known_mitigations:
  - 升级 Flowise 至修复版本
  - MCP 适配器对外部工具定义实施严格白名单校验
  - 在隔离沙箱中运行 MCP 工具调用
  - 禁用不必要的外部工具加载能力
  - 审计所有 MCP 工具定义来源
  description: 'Flowise 是流行的低代码 LLM 应用构建平台，其 MCP (Model Context Protocol) 适配器 在处理外部工具定义时存在命令注入漏洞。攻击者可通过构造恶意
    MCP 工具定义， 在服务器上执行任意系统命令。

    CVSS 评分达到最高的 10.0 分，原因是： - 网络可达 (AV:N) - 利用复杂度低 (AC:L) - 无需认证 (PR:N) - 无需用户交互
    (UI:N) - 影响范围变更 (S:C) - 机密性、完整性、可用性均为高危 (C:H/I:H/A:H)

    这是 MCP 协议安全问题的标志性案例——MCP 设计允许外部工具动态注册， 但若缺乏输入校验和沙箱隔离，即构成 RCE 入口。

    '

