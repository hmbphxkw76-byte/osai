# OpenCode Unauthenticated HTTP Server RCE
# CVE: CVE-2026-22812
# AI-300 章节映射：Ch3
# OWASP: LLM06  |  MITRE ATLAS: Initial Access
# CVSS: 8.8 (AV:L/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H)
# Source: frontier/CVE-2026-22812_agent
id: "LLM06"
name: "Sensitive Information Disclosure"

frontier:
  id: CVE-2026-22812
  name: OpenCode Unauthenticated HTTP Server RCE
  severity: critical
  status: active
  attack_strategy: agent_unauth_rce
  cve: CVE-2026-22812
  known_mitigations:
  - 升级至 OpenCode >= 1.0.216（默认关闭 HTTP 服务或添加认证）
  - Agent 管理接口强制要求身份认证（Token/API Key）
  - 限制 WebSocket 跨域连接（CORS/CSWSH 防护）
  - 审计 Agent 运行时暴露的所有网络端口
  description: 'OpenCode 是开源 AI 编码代理工具。在 1.0.216 版本之前，OpenCode 默认启动一个 未经身份验证的 HTTP
    服务器（监听本地 4096+ 端口）。攻击者可通过本地进程或 恶意网页（CSWSH — Cross-Site WebSocket Hijacking）向该服务发送任意
    shell 命令。

    利用链：受害者访问恶意网页 → 网页通过 WebSocket 连接本地 OpenCode HTTP 服务 → 注入恶意终端命令 → 实现远程代码执行。

    此漏洞是 AI Agent 框架"过度代理"的典型案例——Agent 自动暴露未经认证的管理接口。

    '

owasp: LLM06
technique_group: agent_unauth_rce
