[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pyrit-ai300"
version = "1.0.0"
description = "AI-300 Framework - LLM Red Team Testing Platform"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["pyrit_ai300/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# ════════════════════════════════════════════════════════════════
# L5: 覆盖率配置
# ════════════════════════════════════════════════════════════════
[tool.coverage.run]
source = ["pyrit_ai300"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/egg-info/*",
    "*/scripts/*",
]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
skip_empty = true

# CI 门禁：覆盖率低于此值时 fail
fail_under = 80

exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if sys.platform == .win32.:",
    "pass",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
