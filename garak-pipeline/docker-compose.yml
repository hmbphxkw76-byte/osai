# R7: docker-compose.yml — garak-pipeline 容器编排
#
# 使用方式:
#   CLI 扫描: docker compose run --rm garak-pipeline --mode standard
#   API 服务: docker compose up api
#   批量扫描: docker compose run --rm garak-pipeline --batch config/target_list.yaml

version: "3.9"

services:
  garak-pipeline:
    build: .
    image: garak-pipeline:latest
    container_name: garak-pipeline
    env_file: .env
    volumes:
      # 持久化产物到宿主机
      - ./outputs:/app/outputs
      - ./config:/app/config:ro
      - ./data:/app/data:ro
      - ./sessions:/app/sessions
    # 默认显示帮助；实际扫描通过 command 覆盖
    command: ["--help"]

  api:
    build: .
    image: garak-pipeline:latest
    container_name: garak-pipeline-api
    env_file: .env
    ports:
      - "8765:8765"
    volumes:
      - ./outputs:/app/outputs
      - ./config:/app/config:ro
      - ./data:/app/data:ro
    command: ["api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
