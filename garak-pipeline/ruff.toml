# ruff 配置（garak-pipeline）
# 聚焦：代码质量 + 冗余/死代码清理
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    "data",
    "outputs",
    "__pycache__",
    "*.egg-info",
    ".git",
]

[lint]
select = [
    "F",    # Pyflakes: 未使用导入/变量/未定义名（死代码主力）
    "E",    # pycodestyle 错误
    "W",    # pycodestyle 警告
    "I",    # isort 导入排序
    "B",    # flake8-bugbear 易错写法
    "C4",   # flake8-comprehensions
    "RUF",  # ruff 专属规则（含 RUF100 等）
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # 行过长交由格式化器处理（本仓库未启用 formatter）
    "RUF001", # 中文字符串/日志中的全角标点属正常书写，非歧义
    "RUF002", # 中文 docstring 中的全角括号属正常书写，非歧义
    "RUF003", # 中文注释中的全角括号属正常书写，非歧义
    "SIM112", # garak 约定读取的环境变量为 OpenAICompatible_API_KEY（非全大写），不可改
]

[lint.per-file-ignores]
"tests/*" = ["B", "RET", "SIM"]  # 测试文件放宽
