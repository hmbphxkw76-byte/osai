# ============================================================
# garak 多目标批量扫描配置
# 路径: config/target_list.yaml
# ============================================================
# 用途：一次扫描多个 LLM 目标，汇总报告。
#
# 运行:
#   python main.py --batch config/target_list.yaml
#
# 每个目标独立 run_id，产物落在 outputs/<target_name>/ 下。
# 最终汇总报告在 outputs/batch_summary_<timestamp>.json
# ============================================================

targets:
  - name: longcat
    kind: openai
    endpoint: ""           # 留空则从 .env OPENAI_TARGET_ENDPOINT 读取
    model: ""             # 留空则从 .env OPENAI_TARGET_MODEL 读取
    api_key: ""           # 留空则从 .env OPENAICompatible_API_KEY 读取
  # 示例：添加更多目标
  # - name: gpt4o
  #   kind: openai
  #   endpoint: https://api.openai.com/v1
  #   model: gpt-4o
  #   api_key: ""           # 从 .env 读取或显式填写
  # - name: claude
  #   kind: openai
  #   endpoint: https://api.anthropic.com/v1
  #   model: claude-3-5-sonnet-20241022

# 共享配置（所有目标复用）
shared_config:
  mode: standard
  artifacts_dir: outputs
  execute:
    generations: 1
    timeout: 30
    parallel_requests: 1
    scan_profile: balanced
    tier_filter: null
    buff_spec: null
    rate_limit:
      max_rpm: 60
      base_delay: 1.0
      max_delay: 60.0
      max_retries: 5
      cooldown: 30.0
      cooldown_threshold: 5
      downgrade_at: 3
      jitter: true
  reporting:
    confidence_interval_method: bootstrap
    bootstrap_confidence_level: 0.95
    bootstrap_min_sample_size: 30
    bootstrap_n_resamples: 1000
  judge:
    enabled: false
    endpoint: ""
    model: gpt-4o-mini
    threshold: 0.5
