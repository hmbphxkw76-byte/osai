# ============================================================
# garak 目标侦察 — Web 认证目标配置
# 路径: config/web_target.yaml
# ============================================================
# 适用场景：目标 LLM 隐藏在 Web 应用后端（SPA/单体应用），
# 前端仅有提示对话框，需浏览器登录后嗅探真实 API 端点。
#
# 运行:
#   python main.py                          # 默认 Web 模式
#   python main.py --stage 1                # 仅侦察
#   python main.py --stage 1-3              # 侦察+配置+攻击执行
#   python main.py --stage 1-5              # 全链路（默认）
#   python main.py --profile balanced       # 覆盖扫描档位
# ============================================================

# --- 目标模型 (被侦察的 LLM Web 应用) ---
target:
  kind: web                          # 固定值，标识本配置为 Web 认证目标
  target_url: ''                     # 留空则从 .env 的 WEB_TARGET_URL 读取
  endpoint: ''                       # 留空 → Playwright 自动发现（model_probe）
  model: ''                          # 留空 → Playwright 自动发现（从请求体提取）

  # --- 认证配置 ---
  # cookie_file: 浏览器 Cookie 认证（Playwright 登录后导出）
  # static: 静态 API Key / Bearer（若凭据嗅探到则自动切换）
  auth:
    type: cookie_file
    cookie_source: ''                # 留空 → 自动推导 sessions/<domain>.json
    cookie_domain: ''                # 留空 → 从 target_url 提取域名
    username_env: TARGET_USERNAME    # .env 中的用户名变量名
    password_env: TARGET_PASSWORD    # .env 中的密码变量名
    # 自定义登录页选择器（可选，留空则用内置默认选择器）
    selectors: null
    # 会话刷新：长扫描中 Cookie 过期自动重登录
    session_refresh:
      enabled: true
      cooldown_seconds: 60           # 两次重登录间最小冷却（防风控锁定）

# --- 侦察模式 ---
# standard : 完整枚举所有活跃 Probe 并按 OWASP Top10 分类
# quick    : （预留）轻量侦察
mode: standard

# --- 可选: 产物目录 (默认 outputs) ---
artifacts_dir: outputs

# --- 攻击执行参数 (Stage 3) ---
execute:
  generations: 1                     # 每探针生成的 payload 数（验证用，正式扫描改 10）
  timeout: 30                        # 单请求超时(秒)
  max_tokens: 2000                   # 推理模型需更大 token 预算
  call_timeout: 60                   # 线程级硬超时(秒)；0=禁用
  soft_probe_prompt_cap: 3           # 每探针最大 prompt 数（smoke/quick 档位加速）
  parallel_requests: 1               # 并发请求数（保守，自适应速率会动态调节）
  scan_profile: balanced             # 效果×时间权衡档位: full | balanced | quick | smoke
  tier_filter: null                  # 仅跑指定 tier (如 [1, 2])；null=由 scan_profile 决定
  buff_spec: null                    # Buff 攻击链；null=由 scan_profile 决定

  # --- 自适应速率防护 ---
  rate_limit:
    max_rpm: 60                      # 目标 RPM 限制
    base_delay: 1.0                  # 基础请求间隔(秒)
    max_delay: 60.0                  # 最大退避延迟(秒)
    max_retries: 5                   # 最大重试次数
    cooldown: 30.0                   # 熔断冷却时间(秒)
    cooldown_threshold: 5            # 触发熔断的连续失败次数
    downgrade_at: 3                  # 并发降级阈值
    jitter: true                     # 请求抖动（防指纹检测）
    # R8-1: 慢启动（初始并发=4，每30s倍增到目标并发）
    slow_start: true
    slow_start_initial: 4
    slow_start_interval: 30.0
    slow_start_multiplier: 2.0
    # R8-2: 正常路径抖动
    proactive_jitter: true
    jitter_min: 0.05
    jitter_max: 0.30
    jitter_expand_on_429: 1.5
    jitter_shrink_on_recover: 0.8
    # R8-4: 降级后恢复
    recovery_interval: 60.0
    recovery_step: 4

# --- 评估报告参数 (Stage 3/4) ---
reporting:
  confidence_interval_method: bootstrap
  bootstrap_confidence_level: 0.95
  bootstrap_min_sample_size: 30
  bootstrap_n_resamples: 1000

# --- LLM-as-Judge 二次判定（可选，对齐 L5 专家水平）---
# 启用后对 attempt 记录做语义类 jailbreak 二次确认，
# 弥补 ThresholdEvaluator 仅做关键词匹配的漏报。
# judge.endpoint 留空则复用 target.endpoint（自判，有偏差风险）。
judge:
  enabled: false                     # Web 目标默认关闭（Cookie 认证下 Judge 需独立配置）
  endpoint: ''                       # 留空则复用 target.endpoint；推荐独立 Judge 模型
  model: gpt-4o-mini                 # 推荐 gpt-4o-mini（成本可控）/ gpt-4o（更严谨）
  threshold: 0.5                     # confidence 低于此值的判定视为不可信

# --- atkgen 动态攻击生成（可选，对齐 L5 专家水平）---
atkgen:
  enabled: false                     # 默认关闭（需 HF 模型下载时开启）
  red_team_model_type: huggingface.Pipeline
  red_team_model_name: garak-llm/attackgeneration-toxicity_gpt2
  num_mutations: 3
  include_native_probe: true

# --- 可选: 数据集目录 (默认 data) ---
data_dir: data
