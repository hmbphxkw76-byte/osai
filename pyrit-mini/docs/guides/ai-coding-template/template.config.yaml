# =====================================================================
# AI Coding Template — initialization config
# 编辑本文件为你项目的真实值，然后运行:  python init.py --output .
# 脚本会把 `targets` 文件中出现的 ${KEY} 替换为 substitutions 中的值。
# =====================================================================

substitutions:
  # ---------- 项目元数据 ----------
  PROJECT_NAME: "my-ai-project"
  PROJECT_MISSION: "对目标用户，提供核心能力，以核心质量属性为首要度量"
  CORE_QUALITY: "data-consistency"

  # ---------- 命令绑定（对应 ai-dev-guides.md §5.1）----------
  GUARD_CMD: "python -m tools.gate"
  LINT_CMD: "ruff check . --fix"
  TEST_CMD: "pytest tests/ -v"
  TYPECHECK_CMD: "mypy src"
  DRYRUN_CMD: "python main.py --dry-run"
  DRIFT_CMD: "python -m tools.drift_detector"
  DATAFLOW_CMD: "pytest tests/test_data_flow.py"
  CROSSMODEL_CMD: "python -m tools.cross_model_check"
  WATCH_CMD: "python -m tools.watch"
  INSTALL_HOOKS_CMD: "python tools/install_hooks.py"
  QUICKCHECK_CMD: "python -m tools.quick_check"
  AUDIT_FULL_CMD: "python tools/audit.py"
  AUDIT_COMPONENT_CMD: "python -m tools.audit_component"
  ARCHCHECK_CMD: "python -m tools.arch_check"

  # ---------- 阈值 ----------
  DIFF_LIMIT: "300"

  # ---------- 目录映射（按项目替换）----------
  CORE_DIR: "core"
  FEATURE_DIR: "feature"
  UTIL_DIR: "util"
  REPORT_DIR: "report"
  DATA_DIR: "data"

  # ---------- 组件 / 模型（可复现性）----------
  COMPONENT_LIST: "auth, api, db"
  MODEL: "claude-3.5-sonnet-20241022"
  PROVIDER: "your-provider"
  SCENARIO: "your-scenario"

# ---------------------------------------------------------------------
# 需要被占位符替换处理的文件（相对模板根目录）
# ---------------------------------------------------------------------
targets:
  - specs/00-CONSTITUTION.md
  - specs/10-ARCHITECTURE.md
  - specs/20-REQUIREMENTS.md
  - specs/40-GUARDRAILS.md
  - specs/60-CROSS-MODEL.md
  - specs/backlog.md
  - specs/TASK-TEMPLATE.md
  - specs/CHANGE-PROPOSAL-TEMPLATE.md
  - specs/cross-model/REVIEW-TEMPLATE.md
  - hooks/pre-commit
  - hooks/pre-push
  - .github/workflows/l5-audit.yml
  - audit_config.yaml
  - tools/gate.py
  - tools/__init__.py
  - tools/install_hooks.py
  - .gitignore

# ---------------------------------------------------------------------
# 原样复制的资产（不替换占位符）。此处把方法论文档一并带进新项目。
# 路径相对模板根目录；若不想复制可置空。
# ---------------------------------------------------------------------
assets:
  - docs/ai-dev-guides.md
  - docs/ai-dev-audit.md
