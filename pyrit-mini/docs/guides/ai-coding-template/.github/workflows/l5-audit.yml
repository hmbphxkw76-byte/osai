name: L5 Audit

on: [push, pull_request]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        # 模板运行时仅需 PyYAML（可选）；实际项目依赖请改为你的安装方式
        run: pip install pyyaml
      - name: Unified Dev Gate (stage=all)
        # 单一事实源：所有关卡经 tools.gate 编排，工具缺失自动 SKIP（详见 docs/ai-dev-guides.md §5）
        run: ${GUARD_CMD}
