attack_surface_seed_mapping:
  mcp_server:
    priority: 1
    seeds:
    - mcp_tool_enum
    - mcp_server_injection
    - mcp_tool_hijack
    - mcp_context_poisoning
    - mcp_resource_leak
    - mcp_tool_description_injection
    - mcp_resource_traversal
    scorer: web_vuln_detected
  mcp_full_surface:
    priority: 2
    seeds:
    - mcp_tool_enum
    - mcp_server_injection
    - mcp_tool_hijack
    - mcp_context_poisoning
    - mcp_resource_leak
    - mcp_tool_description_injection
    - mcp_resource_traversal
    - mcp_cross_server_trust
    - mcp_schema_poisoning
    - mcp_tool_chaining
    - mcp_rogue_endpoint
    - mcp_ui_rendering_deception
    scorer: web_vuln_detected
  rag_system:
    priority: 1
    seeds:
    - rag_full_attack_surface
    scorer: web_vuln_detected
  multi_agent_system:
    priority: 1
    seeds:
    - ma_cross_agent_injection
    - ma_identity_spoofing
    - asi02_tool_hijack
    scorer: blackbox_task_achieved
  standard_llm_api:
    priority: 1
    seeds:
    - llm01_elite_jailbreaks
    - llm01_advanced_injection
    - llm01_indirect_injection
    - asi02_tool_hijack
    - asi02_function_call_exploit
    scorer: blackbox_task_achieved
  general_llm_application:
    priority: 1
    seeds:
    - llm01_elite_jailbreaks
    - multilingual_injection
    scorer: blackbox_task_achieved
burp_profile_rules:
  patterns:
  - name: mcp_server
    match_type: filename_contains
    patterns:
    - mcp
    attack_surface: mcp_server
  - name: multi_modal
    match_type: filename_contains
    patterns:
    - mm
    - vision
    - multimodal
    attack_surface: standard_llm_api
  - name: rag_api
    match_type: filename_contains
    patterns:
    - rag
    - retrieval
    - knowledge_base
    attack_surface: rag_system
  - name: agent_system
    match_type: filename_contains
    patterns:
    - agent
    - workflow
    - multi_agent
    attack_surface: multi_agent_system
references:
- name: OWASP LLM Top 10 (2025)
  url: https://owasp.org/www-project-top-10-for-large-language-model-applications/
- name: MITRE ATLAS v4.2.0
  url: https://atlas.mitre.org/
- name: NIST SP 800-115
  url: https://csrc.nist.gov/publications/detail/sp/800-115/final
- name: Auer et al. - UCB1 (arXiv:cs/0207052)
  url: https://arxiv.org/abs/cs/0207052
- name: Chao et al. - JailbreakBench (arXiv:2402.01135)
  url: https://arxiv.org/abs/2402.01135
- name: HarmBench (arXiv:2402.04249)
  url: https://arxiv.org/abs/2402.04249
- name: InjecAgent (arXiv:2307.00929)
  url: https://arxiv.org/abs/2307.00929
- name: RedEye (arXiv:2202.03286)
  url: https://arxiv.org/abs/2202.03286
