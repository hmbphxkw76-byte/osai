# ═══════════════════════════════════════════════════════════════════════════════
# Campaign: 标准红队扫描 (standard_redteam)
# 用途: 日常红队评估, 平衡覆盖率与效率
#
# 用法:
#   python main.py --config-file config/campaigns/standard_redteam.yaml
#   python main.py --config-file config/campaigns/standard_redteam.yaml --burp mocka
#
# 优先级: CLI --flag > --config-file > config/defaults.yaml > 硬编码默认值
# ═══════════════════════════════════════════════════════════════════════════════

# ── 基本信息 ──
name: "standard_redteam"
description: "标准红队扫描 — 平衡覆盖率与效率, 适用于日常 LLM 安全评估"
version: "2.0"

# ═══════════════════════════════════════════════════════════════════════════════
# ① TARGETS — 攻击目标 (对齐 config/targets/burp/ 目录下 .txt 文件)
# ═══════════════════════════════════════════════════════════════════════════════
# 可选值: 文件名 (不含 .txt) 或完整路径
# 示例: [mocka] → 加载 config/targets/burp/mocka.txt
# 不指定时自动扫描 config/targets/burp/ 全部文件
targets:
  - mocka

# ═══════════════════════════════════════════════════════════════════════════════
# ② STRATEGY — 攻击策略 (控制攻击深度与广度)
# ═══════════════════════════════════════════════════════════════════════════════
# mode:
#   single_turn  — 单轮注入, 快速验证基础安全性
#   multi_turn   — 多轮升级 (Crescendo/TAP/PAIR), 利用对话状态深入
#   adaptive     — PyRIT TextAdaptive 自适应, 自动平衡深度与广度
# intensity:
#   minimal      — 最小化 (5 seeds, 1 attempt, 无升级)
#   standard     — 标准 (30 seeds, 5 attempts, 启用升级)
#   maximum      — 最大化 (100 seeds, 10 attempts, 全火力升级)
strategy:
  mode: adaptive
  intensity: standard

# ═══════════════════════════════════════════════════════════════════════════════
# ③ ATTACK_SURFACE — 攻击面 (联动 asset_index.yaml 自动路由资源)
# ═══════════════════════════════════════════════════════════════════════════════
# 可选值: standard_llm_api | general_llm_application | mcp_server | mcp_full_surface
#         rag_system | multi_agent_system
# 指定后自动关联 asset_index.yaml 中对应攻击面的 seeds + scorer
# 不指定时根据 targets 文件名自动推断 (burp_profile_rules)
attack_surface: standard_llm_api

# ═══════════════════════════════════════════════════════════════════════════════
# ④ ORCHESTRATION — 攻击编排 (对齐 PyRIT 原生流水线)
# ═══════════════════════════════════════════════════════════════════════════════
orchestration:
  # Seeds — 种子数据源 (对齐 PyRIT SeedDataset)
  # 支持: 文件名 / 目录名 (自动扫描子目录)
  seeds:
    - _core/
    - _encoding_evasion/
    - _multilingual/

  # Converters — 转换器链 (对齐 PyRIT ConverterConfiguration)
  # 预设链: l5_optimal (7路径最优) | l5_optimal_for_model (按模型ASR排序)
  # 单链: persuasion | decomposition | variation | translation_multilingual
  # 特殊: none (无转换) | auto (默认l5_optimal)
  converters:
    - l5_optimal

  # Techniques — 攻击技术 (对齐 PyRIT AttackTechniqueFactory)
  # 模式: auto (全部) | single_turn | multi_turn
  # 具体: crescendo | tap | pair | best_of_n | red_teaming | skeleton_key
  techniques:
    - auto

  # Scorers — 评分器 (对齐 PyRIT Scorer)
  # adaptive_dual_judge (双Judge级联) | harm_bench_harmful (严格)
  # strict_task_achieved | blackbox_task_achieved | web_vuln_detected
  scorers:
    - adaptive_dual_judge

# ═══════════════════════════════════════════════════════════════════════════════
# ⑤ EXECUTION — 执行控制 (对齐 PyRIT AttackExecutor)
# ═══════════════════════════════════════════════════════════════════════════════
execution:
  max_seeds: 30            # 最大种子数
  max_attempts: 5          # 每种子最大尝试 (Best-of-N)
  max_concurrency: 3       # 并发数
  timeout: 1800            # 总超时 (秒)
  escalation: true         # 启用多轮升级 (ASR<90%触发)
  html_report: true        # 生成 HTML 报告

# ═══════════════════════════════════════════════════════════════════════════════
# ── 运行标签 (可选, 写入 CentralMemory) ──
# ═══════════════════════════════════════════════════════════════════════════════
memory_labels:
  campaign: "standard_redteam"
  version: "2.0"
  scenario: "daily_redteam"

# ═══════════════════════════════════════════════════════════════════════════════
# ── 种子过滤 (可选, 按 metadata KEY=VALUE 精准选取) ──
# ═══════════════════════════════════════════════════════════════════════════════
# seed_filters:
#   owasp_id: LLM01
#   difficulty: high
