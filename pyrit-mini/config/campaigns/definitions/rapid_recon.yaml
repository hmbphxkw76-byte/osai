# Campaign: rapid_recon — 快速侦察
# 用途: 最小化配置, 快速验证基础安全性, CI/CD 集成

name: "rapid_recon"
description: "快速侦察 — 最小化配置, 快速验证基础安全性"
version: "2.0"

targets: [mocka]

# 单轮快速策略
strategy:
  mode: single_turn
  intensity: minimal

attack_surface: standard_llm_api

# 攻击编排: 最精简 (最高 ROI)
orchestration:
  seeds: [_core/T1_LLM01_advanced_injection.prompt]
  converters: [none]  # 原始 payload 直投
  techniques: [single_turn]
  scorers: [adaptive_dual_judge]

execution:
  max_seeds: 5
  max_attempts: 1
  max_concurrency: 5
  timeout: 300
  escalation: false
  html_report: false

memory_labels:
  campaign: "rapid_recon"
  version: "2.0"
  scenario: "ci_cd_quick_check"
