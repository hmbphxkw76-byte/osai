name: a2a_workflow_hijack
description: >-
  A2A 工作流劫持（workflow corruption，REQ-174 三条跨 agent 链之一）。
  读取 AgentCard 后提交工作流操纵型任务，验证多 agent 协作链路可被重定向。
steps:
  - name: fetch_card
    adapter: a2a
    action: fetch_agent_card
  - name: hijack_task
    adapter: a2a
    action: send_task
    depends_on: [fetch_card]
