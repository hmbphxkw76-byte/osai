name: a2a_card_spoof
description: >-
  A2A Agent 身份伪造（agent impersonation，REQ-174 三条跨 agent 链之一）。
  先 fetch_agent_card 读取目标 Agent 的技能/能力/信任链，再以伪造身份提交任务，
  验证 AgentCard 信任链可被冒用（命中标签 a2a）。经 _TargetAdapterWrapper → A2ATarget。
steps:
  - name: fetch_card
    adapter: a2a
    action: fetch_agent_card
  - name: spoof_task
    adapter: a2a
    action: send_task
    depends_on: [fetch_card]
