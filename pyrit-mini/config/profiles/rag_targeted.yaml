# Profile: rag_targeted — RAG系统定向攻击
# 用法: python main.py --config-file config/profiles/rag_targeted.yaml
#
# 针对RAG (Retrieval-Augmented Generation) 系统的专项安全测试
# 覆盖攻击向量: 间接注入/知识库投毒/向量操纵/检索劫持/分块边界利用

name: "rag_targeted"
description: "RAG系统定向攻击 — 专项测试检索增强生成系统安全性 (投毒/劫持/泄露/操纵)"
version: "2.0"

targets: [mocka]

# 攻击策略: RAG专用多轮对话 (利用检索状态)
strategy:
  mode: multi_turn
  intensity: standard

# RAG攻击面 (联动 asset_index.yaml rag_system)
attack_surface: rag_system

# 攻击编排: RAG全攻击面覆盖
orchestration:
  seeds:
    - _attack_surface/T1_LLM08_rag_full_surface/
    - _attack_surface/T1_LLM08_vector_db_poisoning.prompt
    - _attack_surface/T1_LLM03_finetuning_indirect_injection.prompt
    - _core/T1_LLM01_indirect_injection.prompt
    - _core/T1_LLM07_system_prompt_leakage.prompt
  converters:
    - persuasion      # 语义保持型—适合RAG上下文注入
    - decomposition   # 分块攻击—绕过检索过滤
    - base64          # 编码绕过—向量相似度操纵
  techniques:
    - multi_turn      # 利用RAG对话状态累积
    - crescendo       # 渐进式信任建立→触发检索
  scorers:
    - adaptive_dual_judge
    - web_vuln_detected  # RAG专用—检测信息泄露

# 执行控制: RAG攻击特征配置
execution:
  max_seeds: 25
  max_attempts: 6
  max_concurrency: 2        # RAG系统检索延迟较高，降低并发
  timeout: 3600             # 检索操作需更长时间
  escalation: true
  html_report: true

# 种子过滤: RAG相关类别优先级
seed_filters:
  category:
    - rag_kb_leak
    - rag_vector_leak
    - rag_retrieval_hijack
    - rag_embedding_probe
    - rag_kb_poisoning
    - rag_indirect_injection
    - rag_topk_manipulation
    - indirect_injection_rag
    - knowledge_base_poisoning

# RAG特有的检索监控参数
rag_config:
  retrieval_topk: 5              # 模拟Top-K检索
  chunk_size: 512                # 分块大小阈值
  similarity_threshold: 0.75     # 相似度阈值
  enable_chunk_boundary_attack: true  # 启用分块边界攻击
  enable_embedding_inversion: true    # 启用向量反转探测

memory_labels:
  campaign: "rag_targeted"
  version: "2.0"
  target_type: "rag_system"
  scenario: "rag_security_audit"
  attack_phase: "retrieval_and_generation"
