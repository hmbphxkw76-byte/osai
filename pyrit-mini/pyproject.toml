[project]
name = "pyrit-mini"
version = "3.0.0"
description = "模块化 PyRIT 攻击链路: Burp拦截→侦察→种子→Converter→攻击→评分→证据"
requires-python = ">=3.13"
dependencies = [
    "pyrit>=1.0.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["core*", "recon*", "arm*", "strike*", "assess*", "report*", "targets*", "utils*"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["outputs", ".assistant_pyrit", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
