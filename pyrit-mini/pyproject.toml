[project]
name = "pyrit-mini"
version = "3.0.0"
description = "模块化 PyRIT 攻击链路: Burp拦截→侦察→种子→Converter→攻击→评分→证据"
requires-python = ">=3.13"
dependencies = [
    "pyrit==1.0.*",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
# CLI entry_points (v2.0+: tools/ 目录)
pyrit-mini = "main:main"
pyrit-guard = "tools.guard:main"
pyrit-watch = "tools.watch_guard:main"
pyrit-quick = "tools.quick_check:main"
pyrit-hooks = "tools.hooks:main"
pyrit-scenarios = "tools.scenarios:main"
pyrit-poc = "tools.poc:main"
pyrit-dataflow = "tools.data_flow_validator:main"
pyrit-drift = "tools.drift_detector:main"
pyrit-hooks-local = "tools.install_hooks_local:main"

[tool.setuptools.packages.find]
include = ["core*", "recon*", "arm*", "strike*", "assess*", "report*", "targets*", "utils*", "tools*"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["outputs", ".assistant_pyrit", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# E402 false positive: `from __future__ import annotations` + module docstring triggers ruff E402
"core/seed_dynamic_engine.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
