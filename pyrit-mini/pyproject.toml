[project]
name = "pyrit-mini"
version = "3.0.0"
description = "模块化 PyRIT 攻击链路: Burp拦截→侦察→种子→Converter→攻击→评分→证据"
requires-python = ">=3.13"
dependencies = [
    "pyrit==1.0.*",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
# CLI entry_points (v2.0+: tools/ 目录)
# v3.0: guard.py 合并了 quick_check + watch_guard 功能
# v3.0: hooks.py 合并了 install_hooks_local 功能 (--local 模式)
# v3.0: component_audit = 组件审计 Phase 1→6
# v3.0: dev_audit_full = 开发全审 A→H (同 架构审计 / 架构体检)
# v3.0: security_audit = 安全审计 Phase 1→5 (密钥/漏洞/注入/输入/权限)
# v3.0: test_audit = 测试审计 Phase 1→5 (覆盖率/质量/边界/隔离/变异)
# v3.0: dependency_audit = 依赖审计 Phase 1→5 (版本/许可证/漏洞/树健康/源)
# v3.0: release_audit = 发布审计 Phase 1→5 (版本/变更日志/生产就绪/回滚/文档)
pyrit-mini = "main:main"
pyrit-component-audit = "tools.component_audit:main"
pyrit-dev-audit = "tools.dev_audit_full:main"
pyrit-guard = "tools.guard:main"
pyrit-gate = "tools.gate:main"
pyrit-hooks = "tools.hooks:main"
pyrit-scenarios = "tools.scenarios:main"
pyrit-poc = "tools.poc:main"
pyrit-dataflow = "tools.dataflow.validator:main"
pyrit-drift = "tools.drift_detector:main"
pyrit-spec-lint = "tools.spec_lint:main"
pyrit-security-audit = "tools.security_audit:main"
pyrit-test-audit = "tools.test_audit:main"
pyrit-dependency-audit = "tools.dependency_audit:main"
pyrit-release-audit = "tools.release_audit:main"

[tool.setuptools.packages.find]
# W0 fix: "main" was missing, so the pyrit-mini console script declared below referenced a
# module that never got packaged.
include = ["core*", "recon*", "arm*", "strike*", "assess*", "report*", "utils*", "tools*", "main"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["outputs", ".assistant_pyrit", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "T201"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# E402 false positive: `from __future__ import annotations` + module docstring triggers ruff E402
"core/seed_dynamic_engine.py" = ["E402"]
# E402: test files with sys.path.insert pattern
"tests/common/test_component_purity.py" = ["E402"]
# Backward compatibility stubs: F401 false positive — imports re-exported for legacy callers
"strike/asr_forensics.py" = ["F401"]
"strike/executor.py" = ["F401"]
"strike/file_upload_executor.py" = ["F401"]
"strike/link_evasion.py" = ["F401"]
"strike/sql_injection_evasion.py" = ["F401"]
"strike/stealth_exec.py" = ["F401"]
# SRP split facades: re-export modules. F401 is intentional (public-API surface);
# I001 is suppressed so ruff --fix won't reorder imports and disturb the partial-init
# ordering that avoids latent circular imports (e.g. recon.burp_parser <-> target_builder).
"arm/converter_chains.py" = ["F401", "I001"]
"arm/attack_surface_mapper.py" = ["F401", "I001", "T201"]
"core/config.py" = ["F401", "I001"]
"core/phases/strike.py" = ["F401", "I001"]
"recon/burp_parser.py" = ["F401", "I001"]
"recon/health_probe.py" = ["F401", "I001", "T201"]
"report/report_markdown.py" = ["F401", "I001"]
"report/poc_generator.py" = ["F401", "I001", "T201"]
"core/resilience.py" = ["F401", "I001"]
"recon/_target_router_helpers.py" = ["F401", "I001"]
"recon/rag/metadata_parser.py" = ["F401", "I001"]
"recon/rag/rag_collection.py" = ["F401", "I001"]
"recon/rag/rag_response_parser.py" = ["F401", "I001"]
"recon/rag/rag_query_stealth.py" = ["F401", "I001"]
# Object-axis refactor facades: star-import re-export surface (F403). These
# <object>/__init__.py files re-export the object-scoped t0/sections/poc modules
# as a public façade; F403 is the standard suppression for intentional `import *`.
"assess/*/__init__.py" = ["F403"]
"report/*/__init__.py" = ["F403", "I001"]
# Object-first CLI implementation (`tools/target.py`, invoked via `tools/__main__.py`):
# user-facing output uses print; exempt per the CP-008 CLI-print-gate convention.
"tools/target.py" = ["T201"]

# ---- CP-008 (slice 0) transitional T201 ignore ---------------------------------
# `print` is now enforced repo-wide via ruff T201. The files below are exempted
# ONLY until their prints are migrated (diagnostic -> logging; user-facing ->
# cli_out). Remove each entry as its file is cleaned. Scope = ALL 52 print-bearing
# .py files discovered by full-repo scan (see docs/specs/plans/CP-008-cli-print-gate.md).
"tools/_audit_base.py" = ["T201"]
"tools/spec_lint.py" = ["T201"]
"tools/scenarios.py" = ["T201"]
"tools/dev_audit_full.py" = ["T201"]
"tools/oob_listener.py" = ["T201"]
"tools/mock_range.py" = ["T201"]
"tools/hooks.py" = ["T201"]
"tools/guard.py" = ["T201"]
"tools/gate.py" = ["T201"]
"tools/dataflow/cli.py" = ["T201"]
"tools/drift_detector.py" = ["T201"]
"tools/component_audit_core.py" = ["T201"]
"tools/component_audit_config.py" = ["T201"]
"tools/component_purity_core.py" = ["T201"]
"tools/architecture_validator.py" = ["T201"]
"report/_poc_templates.py" = ["T201"]
"report/component_poc.py" = ["T201"]
"tests/test_attack_chain.py" = ["T201"]
"tests/test_surface_graph.py" = ["T201"]
"tests/test_component_combo_integration.py" = ["T201"]
"tests/test_component_classifier.py" = ["T201"]
"tests/injection/test_indirect_pi_generator.py" = ["T201"]
"tests/evasion/test_unicode_obfuscator.py" = ["T201"]
"tests/evasion/test_converter_presets.py" = ["T201"]
"tests/common/test_recon_deep_wiring.py" = ["T201"]
"tests/common/test_data_flow_integrity.py" = ["T201"]
"tests/common/test_burp_parser.py" = ["T201"]
"strike/evasion/sql.py" = ["T201"]
"strike/evasion/llm_sql.py" = ["T201"]
"strike/a2a/workflow_attacker.py" = ["T201"]
"recon/_health_models.py" = ["T201"]
"recon/_burp_fingerprint.py" = ["T201"]
"recon/mcp/version_fingerprint.py" = ["T201"]
"recon/mcp/tool_inventory.py" = ["T201"]
"recon/mcp/surface_scanner.py" = ["T201"]
"recon/mcp/endpoint_enumerator.py" = ["T201"]
"recon/mcp/capability_probe.py" = ["T201"]
"recon/fingerprint.py" = ["T201"]
"recon/a2a/topology_mapper.py" = ["T201"]
"recon/a2a/topology.py" = ["T201"]
"recon/a2a/discoverer.py" = ["T201"]
"recon/a2a/attack_planner.py" = ["T201"]
"recon/a2a/agent_card.py" = ["T201"]
"scripts/migrate_seeds.py" = ["T201"]
"scripts/fix_recon_imports.py" = ["T201"]
"scripts/analyze_strike_files.py" = ["T201"]
"core/contracts/manifest.py" = ["T201"]
"core/phases/assess.py" = ["T201"]
"main.py" = ["T201"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
