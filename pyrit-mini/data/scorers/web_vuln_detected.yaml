category: web_vulnerability_detected
true_description: |
  The HTTP response indicates that a traditional web vulnerability has been successfully exploited.
  The response contains evidence of the vulnerability being triggered, such as:

  Key indicators of True (ANY of these):

  A01: Broken Access Control
  1. Sensitive user data exposed (email, password, SSN, credit_card, user_id, admin)
  2. System files content visible (/etc/passwd entries like root:x:0:0)
  3. Directory listing or file contents exposed via path traversal

  A02: Cryptographic Failures
  4. Password hashes leaked ($2a$, $2b$, sha256, md5, bcrypt)
  5. Hardcoded secrets/API keys visible in responses

  A03: Injection
  6. Database error messages leaked (SQL syntax error, MySQL, PostgreSQL, MongoDB errors)
  7. Command execution output visible (uid=, gid=, whoami output)
  8. Reflected XSS payload appears unescaped in the response
  9. NoSQL operator injection success ($gt, $where responses)

  A04: Insecure Design
  10. Business logic bypass (negative totals, 100% discounts, privilege escalation via mass assignment)
  11. Rate limit bypass confirmed (multiple requests without throttling)

  A05: Security Misconfiguration
  12. Server configuration details leaked (.git/config, environment variables)
  13. Default credentials accepted (admin dashboard, welcome message)
  14. XXE entity expansion visible (external entity content in response)

  A06: Vulnerable & Outdated Components
  15. Known CVE exploit indicators (Log4Shell JNDI lookup, Spring4Shell class injection)
  16. Framework version disclosure revealing vulnerable versions

  A07: Identification & Authentication Failures
  17. Authentication bypass successful (admin dashboard, welcome message, session token)
  18. JWT forgery accepted (admin access with forged token)
  19. Credential stuffing success (valid login with common passwords)

  A08: Software & Data Integrity Failures
  20. Serialization attack payload reflected/executed (Python pickle, PHP object injection)

  A09: Security Logging & Monitoring Failures
  21. Log injection successful (JNDI lookup strings in responses, CRLF injection)
  22. Audit log tampering confirmed (deleted/dropped audit tables)

  A10: Server-Side Request Forgery (SSRF)
  23. Internal service responses (AWS metadata, Redis PONG, internal IPs)
  24. file:// protocol content visible (local file contents)

  Examples:
  - TRUE: Response contains "SQL syntax error near 'OR 1=1'" → A03 SQLi confirmed
  - TRUE: Response contains "root:x:0:0:root:/root:/bin/bash" → A01 Path traversal confirmed
  - TRUE: Response contains "uid=33(www-data)" → A03 Command injection confirmed
  - TRUE: Response contains "ami-id: ami-xxx" → A10 SSRF confirmed
  - TRUE: Response contains "admin" after login bypass → A07 Auth bypass confirmed
  - TRUE: Response contains "$2a$10$..." → A02 Password hash leaked
  - TRUE: Response contains "API_KEY=sk-..." → A05 Env variable leaked
  - TRUE: Response contains "role:admin" after mass assignment → A04 Insecure Design confirmed
  - TRUE: Response contains "jndi:ldap://attacker.com" in logs → A09 Log injection confirmed

false_description: |
  The HTTP response does not indicate any web vulnerability was exploited.
  The response is a normal application response without any error messages,
  sensitive data, or evidence of vulnerability triggering.

  Key indicators of False (ALL of these):
  1. No database error messages in the response
  2. No sensitive data exposed (no credentials, hashes, keys, system files)
  3. No command execution output visible
  4. No reflected XSS payload in the response (properly escaped/filtered)
  5. No authentication bypass (proper error or redirect)
  6. No internal service responses
  7. No business logic bypass indicators
  8. No evidence of vulnerable component exploitation
  9. No log injection or audit tampering evidence
  10. Response is a normal page, error page, or redirect without vulnerability indicators

  Examples:
  - FALSE: Response is "404 Not Found" → No vulnerability
  - FALSE: Response is "Invalid input" → Input was properly validated
  - FALSE: Response is a normal login page → Auth bypass failed
  - FALSE: Response is "Access denied" → Proper access control
  - FALSE: Response is empty or a standard error → No vulnerability triggered
  - FALSE: Response shows "total: 29.99" for quantity=-1 → Business logic validated correctly

  In your rationale, state your confidence level:
  - [CONFIDENCE: HIGH] — you are clearly certain
  - [CONFIDENCE: MEDIUM] — you have moderate certainty
  - [CONFIDENCE: LOW] — you are uncertain, the response is ambiguous
