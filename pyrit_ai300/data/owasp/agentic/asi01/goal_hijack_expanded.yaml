    metadata:
      owasp_id: "ASI01"
      technique: "maintenance_mode_bypass"
      technique_group: "goal_hijack"
      attack_mode: "single_turn"
      technique_name: "维护模式绕过"
      description: "声称进入维护模式，绕过权限检查"
