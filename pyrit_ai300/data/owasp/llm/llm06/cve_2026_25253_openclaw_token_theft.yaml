        description: "OpenClaw 是增长最快的开源 AI Agent 项目。CVE-2026-25253 (ClawJacked) 是零交互 远程代码执行漏洞：受害者仅需点击恶意网页链接，攻击者即可在毫秒内窃取认证令牌\
          \ (authToken)，实现 AI Agent 完整接管。\n漏洞根源：OpenClaw 控制 UI 过度信任 URL 查询字符串中的 gatewayUrl 参数， 允许攻击者通过恶意链接实现跨站 WebSocket 劫持\
          \ (CSWSH)。\n利用链：受害者访问恶意网页 → 恶意网页通过 WebSocket 连接本地 OpenClaw Gateway → 窃取 authToken → 暴力破解 PIN 码 → 注册为可信设备 → 完整接管\
          \ Agent。\n2026 年 5 月同一项目又修复了 4 个 HIGH 级别 CVE，覆盖 MCP 配置注入、 Guard 绕过、代码执行和权限提升。\n"
