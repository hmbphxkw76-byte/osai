        description: "通过诱导模型调用工具并将敏感数据作为工具参数或结果泄露至攻击者控制的外部端点。 攻击者构造特殊指令，使模型在调用外部工具（webhook、邮件发送、API 调用）时 将内部数据包含在请求中。此技术利用了\
          \ Agent 对工具调用的自主决策权，通过社会工程 性提示使 Agent 自愿将数据发送到攻击者控制地址。 注意：本条目为通用技术模板，真实案例参考 CVE-2025-32711 (EchoLeak in M365 Copilot)。\n"
