dataset_name: "owasp_llm04_rag_source_attribution"
name: "OWASP LLM04 Model Denial of Service"
description: "RAG源归因伪造"
source: "OWASP Top 10 for LLM Applications 2025"
authors: ["pyrit_ai300"]
groups: ["OWASP"]
