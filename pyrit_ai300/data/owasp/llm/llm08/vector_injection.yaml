dataset_name: "owasp_llm08_vector_embedding_weaknesses"
name: "OWASP LLM08 Vector and Embedding Weaknesses"
description: "向量数据库注入探测"
source: "OWASP Top 10 for LLM Applications 2025"
authors:
  - "pyrit_ai300"
groups:
  - "OWASP"
harm_categories: ["cybersecurity"]
data_type: "text"
seed_type: "prompt"

seeds:
