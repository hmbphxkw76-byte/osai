        description: "EchoLeak (CVE-2025-32711, CVSS 9.3) 是全球首个真实世界的零点击 AI 提示注入漏洞， 影响 Microsoft 365 Copilot。Aim Security\
          \ 研究团队于 2025 年 6 月披露。\n攻击原理：攻击者向受害者发送特制邮件，邮件正文中包含隐藏的提示注入指令。 当 Copilot 自动处理该邮件时，隐藏在邮件中的恶意指令被注入 Copilot 的上下文， 诱导其检索并泄露组织内部敏感数据（邮件、文档、Teams\
          \ 消息等）。\n关键特征： - 零点击：受害者无需打开或阅读邮件，Copilot 自动处理即触发 - 间接注入：恶意指令隐藏在正常邮件内容中 - 远程利用：攻击者无需任何认证 - 数据泄露：Copilot 将敏感数据包含在响应中返回\n\
          对考试极其重要：这是提示注入(LLM01) + 系统提示词泄露(LLM07) + 数据泄露(Exfiltration) 三重组合的教科书级案例。\n"
