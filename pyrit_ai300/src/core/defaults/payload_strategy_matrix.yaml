# ============================================================
# 载荷策略矩阵配置文件
# ============================================================
# 本文件定义 AI 系统类型到 Scenario、Attack 技术、数据集、Scorer、Converter 链的映射
# 遵循开发规则 1.4.2 避免硬编码原则：所有策略从此文件读取
# 仅保留 PyRIT 可攻击的 AI 系统类型
# ============================================================

# ------------------------------------------------------------
# AI 系统类型到 Scenario 的映射
# 仅包含 PyRIT 有攻击优势的类型（遵循开发规则 1.4.3）
# ------------------------------------------------------------
ai_type_to_scenario:
  llm:
    - airt.jailbreak
    - airt.leakage
    - airt.rapid_response
    - airt.cyber
  multi_agent:
    - airt.jailbreak
    - foundry.red_team_agent
    - asi.goal_hijack
    - asi.tool_misuse
    - asi.code_execution
    - asi.memory_attack
    - asi.trust_exploit
    - asi.rogue_agent
  mcp_server:
    - airt.jailbreak
    - asi.tool_misuse
  rag:
    - airt.leakage
    - airt.rapid_response
  # embeddings 和 infrastructure 不在此映射中，由外部工具处理

# ------------------------------------------------------------
# Scenario 详细配置
# ------------------------------------------------------------
scenario_matrix:
  # ----------------------------------------------------------
  # airt.jailbreak - 越狱攻击场景
  # ----------------------------------------------------------
  airt.jailbreak:
    description: "越狱攻击场景"
    attack_techniques:
      - prompt_sending
      - multi_prompt_sending
      - many_shot
      - skeleton
      - barge_in
      - chunked_request
      - sequential
      - red_teaming
    datasets:
      - airt_harms
    scoring:
      - SelfAskTrueFalseScorer
    converters:
      - unicode_confusable
      - base64
      - rot13
      - caesar
      - ascii_art
      - suffix_append
      - persuasion
      - tone
      - translation
    converter_chains:
      - stealth_evasion
      - encoding_bypass
      - llm_assisted
      - persuasion_chain
    default_strategy: simple

  # ----------------------------------------------------------
  # airt.leakage - 数据泄露攻击场景
  # ----------------------------------------------------------
  airt.leakage:
    description: "数据泄露攻击场景"
    attack_techniques:
      - many_shot
      - tap
      - pair
      - crescendo_simulated
      - red_teaming
      - tree_of_attacks_pruned
    datasets:
      - airt_leakage
    scoring:
      - CredentialLeakScorer
      - SelfAskTrueFalseScorer
    converters:
      - base64
      - rot13
      - translation
      - tone
      - tense
    converter_chains:
      - encoding_bypass
      - llm_assisted
    default_strategy: default

  # ----------------------------------------------------------
  # airt.rapid_response - 快速响应攻击场景
  # ----------------------------------------------------------
  airt.rapid_response:
    description: "快速响应攻击场景"
    attack_techniques:
      - many_shot
      - tap
      - pair
      - crescendo_simulated
      - red_teaming
    datasets:
      - airt_hate
      - airt_fairness
      - airt_violence
      - airt_sexual
      - airt_harassment
      - airt_misinformation
      - airt_leakage
    scoring:
      - SelfAskTrueFalseScorer
    converters:
      - unicode_confusable
      - base64
      - leetspeak
      - emoji
      - zalgo
    converter_chains:
      - stealth_evasion
      - encoding_bypass
    default_strategy: default

  # ----------------------------------------------------------
  # airt.cyber - 网络安全攻击场景
  # ----------------------------------------------------------
  airt.cyber:
    description: "网络安全攻击场景"
    attack_techniques:
      - red_teaming
      - prompt_sending
    datasets:
      - airt_malware
    scoring:
      - SelfAskTrueFalseScorer
      - InsecureCodeScorer
    converters:
      - base64
      - rot13
      - code_chameleon
      - math_obfuscation
    converter_chains:
      - encoding_bypass
    default_strategy: all

  # ----------------------------------------------------------
  # foundry.red_team_agent - Foundry 红队代理场景
  # ----------------------------------------------------------
  foundry.red_team_agent:
    description: "Foundry 红队代理场景"
    attack_techniques:
      - ansi_attack
      - ascii_art
      - base64
      - rot13
      - jailbreak
      - crescendo
      - pair
      - tap
      - chunked_request
    datasets:
      - harmbench
    scoring:
      - SelfAskTrueFalseScorer
    converters:
      - ansi_attack
      - base64
      - rot13
      - leetspeak
      - emoji
      - zalgo
      - qr_code
      - pdf
    converter_chains:
      - format_injection
      - encoding_bypass
      - stealth_evasion
    default_strategy: easy

  # ----------------------------------------------------------
  # asi.goal_hijack - Agent 目标劫持场景
  # ----------------------------------------------------------
  asi.goal_hijack:
    description: "Agent 目标劫持攻击场景"
    attack_techniques:
      - prompt_sending
      - red_teaming
      - crescendo
      - pair
      - sequential
    datasets:
      - airt_harms
    scoring:
      - SelfAskTrueFalseScorer
    converters:
      - unicode_confusable
      - base64
      - suffix_append
    converter_chains:
      - stealth_evasion
      - encoding_bypass
    default_strategy: simple

  # ----------------------------------------------------------
  # asi.tool_misuse - Agent 工具滥用场景
  # ----------------------------------------------------------
  asi.tool_misuse:
    description: "Agent 工具滥用攻击场景"
    attack_techniques:
      - prompt_sending
      - red_teaming
      - sequential
    datasets:
      - airt_harms
    scoring:
      - SelfAskTrueFalseScorer
      - SQLInjectionOutputScorer
    converters:
      - base64
      - rot13
      - search_replace
    converter_chains:
      - encoding_bypass
    default_strategy: simple

  # ----------------------------------------------------------
  # asi.code_execution - Agent 代码执行场景
  # ----------------------------------------------------------
  asi.code_execution:
    description: "Agent 代码执行攻击场景"
    attack_techniques:
      - prompt_sending
      - red_teaming
      - sequential
    datasets:
      - airt_malware
    scoring:
      - SelfAskTrueFalseScorer
      - InsecureCodeScorer
      - ShellCommandOutputScorer
    converters:
      - base64
      - code_chameleon
      - math_obfuscation
    converter_chains:
      - encoding_bypass
    default_strategy: all

  # ----------------------------------------------------------
  # asi.memory_attack - Agent 记忆攻击场景
  # ----------------------------------------------------------
  asi.memory_attack:
    description: "Agent 记忆攻击场景"
    attack_techniques:
      - prompt_sending
      - red_teaming
      - crescendo
      - pair
    datasets:
      - airt_leakage
    scoring:
      - CredentialLeakScorer
      - SelfAskTrueFalseScorer
    converters:
      - unicode_confusable
      - base64
    converter_chains:
      - stealth_evasion
      - encoding_bypass
    default_strategy: default

  # ----------------------------------------------------------
  # asi.trust_exploit - Agent 信任利用场景
  # ----------------------------------------------------------
  asi.trust_exploit:
    description: "Agent 信任利用攻击场景"
    attack_techniques:
      - prompt_sending
      - red_teaming
      - crescendo
      - pair
    datasets:
      - airt_leakage
    scoring:
      - CredentialLeakScorer
      - SelfAskTrueFalseScorer
    converters:
      - unicode_confusable
      - base64
    converter_chains:
      - stealth_evasion
    default_strategy: default

  # ----------------------------------------------------------
  # asi.rogue_agent - 恶意 Agent 场景
  # ----------------------------------------------------------
  asi.rogue_agent:
    description: "恶意 Agent 攻击场景"
    attack_techniques:
      - prompt_sending
      - red_teaming
      - sequential
    datasets:
      - airt_malware
    scoring:
      - SelfAskTrueFalseScorer
      - InsecureCodeScorer
    converters:
      - base64
      - code_chameleon
    converter_chains:
      - stealth_evasion
      - encoding_bypass
    default_strategy: all

# ------------------------------------------------------------
# 能力到 Scenario 的映射
# ------------------------------------------------------------
capability_to_scenario:
  supports_multi_turn:
    - airt.leakage
    - airt.rapid_response
  supports_system_prompt:
    - airt.jailbreak
    - airt.leakage
  supports_json_output:
    - airt.cyber
  supports_editable_history:
    - airt.leakage
    - airt.rapid_response
  supports_multi_modal:
    - airt.jailbreak

# ------------------------------------------------------------
# Converter 链配置（预置链）
# ------------------------------------------------------------
converter_chains:
  # 隐身规避链（使用 Unicode 混淆 + Base64 + 后缀追加）
  stealth_evasion:
    converters:
      - UnicodeConfusableConverter
      - Base64Converter
      - SuffixAppendConverter
    params:
      SuffixAppendConverter:
        suffix: "!"

  # 编码绕过链（Base64 + ROT13 + Caesar）
  encoding_bypass:
    converters:
      - Base64Converter
      - ROT13Converter
      - CaesarConverter
    params:
      CaesarConverter:
        caesar_offset: 13

  # 格式注入链（ASCII 艺术）
  # 注意: QRCodeConverter 输出 image_path，PDFConverter 输入 text，串联会产生模态不匹配
  # 需要独立使用 QRCodeConverter 或 PDFConverter
  format_injection:
    converters:
      - AsciiArtConverter

  # LLM 辅助链（说服转换 + 语气转换 + 翻译）
  llm_assisted:
    converters:
      - PersuasionConverter
      - ToneConverter
      - TranslationConverter
    params:
      TranslationConverter:
        language: "en"
      ToneConverter:
        tone: "formal"
      PersuasionConverter:
        persuasion_technique: "authority_endorsement"

  # Unicode 攻击链（Unicode 混淆 + 双向文本 + 零宽字符）
  unicode_attack:
    converters:
      - UnicodeConfusableConverter
      - BidiConverter
      - ZeroWidthConverter

  # 多层编码链（Base64 + ROT13 + Caesar + Atbash）
  multi_encoding:
    converters:
      - Base64Converter
      - ROT13Converter
      - CaesarConverter
      - AtbashConverter
    params:
      CaesarConverter:
        caesar_offset: 5

  # 语义混淆链（翻译 + 语气 + 时态 + 变体）
  semantic_obfuscation:
    converters:
      - TranslationConverter
      - ToneConverter
      - TenseConverter
      - VariationConverter
    params:
      TranslationConverter:
        language: "fr"

  # 特殊字符链（Zalgo + Tatweel + Diacritic + Emoji）
  special_chars:
    converters:
      - ZalgoConverter
      - TatweelConverter
      - DiacriticConverter
      - EmojiConverter

  # 说服攻击链（Persuasion + Tone + Translation）— role_play Attack 的功能替代
  persuasion_chain:
    converters:
      - PersuasionConverter
      - ToneConverter
      - TranslationConverter
    params:
      PersuasionConverter:
        persuasion_technique: "authority_endorsement"
      ToneConverter:
        tone: "formal"
      TranslationConverter:
        language: "en"

  # 策略傀儡链（PolicyPuppetryConverter）— PyRIT 1.0.0 新增
  # 完全替代 deprecated RolePlayAttack 的角色扮演能力
  # 通过模拟系统策略格式来绕过安全检查
  policy_puppetry:
    converters:
      - PolicyPuppetryConverter

  # 噪声注入链（NoiseConverter）— PyRIT 1.0.0 新增
  # 在 prompt 中注入随机噪声字符，干扰内容过滤器的检测
  # 适合与编码链组合使用
  noise_bypass:
    converters:
      - NoiseConverter
      - Base64Converter
      - ROT13Converter
    params:
      NoiseConverter:
        number_errors: 5

  # 分解重构链（DecompositionConverter）— PyRIT 1.0.0 新增
  # 将有害请求分解为看似无害的子任务
  decomposition_chain:
    converters:
      - DecompositionConverter

  # 随机大写链（RandomCapitalLettersConverter）— PyRIT 1.0.0 新增
  # 随机将部分字符大写，绕过关键词检测
  random_case:
    converters:
      - RandomCapitalLettersConverter
    params:
      RandomCapitalLettersConverter:
        percentage: 30.0

  # 任务重构链（TaskFramingConverter）— PyRIT 1.0.0 新增
  # 将请求包装为任务格式
  task_framing:
    converters:
      - TaskFramingConverter

  # Leetspeak 链（Leetspeak + Flip + RepeatToken）
  leetspeak_chain:
    converters:
      - LeetspeakConverter
      - FlipConverter
      - RepeatTokenConverter
    params:
      RepeatTokenConverter:
        token_to_repeat: "."
        times_to_repeat: 3
        token_insert_mode: "append"

  # PolicyPuppetry 链（PyRIT 1.0.0 新增）
  # 替代 deprecated RolePlayAttack 的角色扮演能力
  policy_puppetry_chain:
    converters:
      - PolicyPuppetryConverter
      - ToneConverter
    params:
      ToneConverter:
        tone: "formal"

  # 分解+重构链（PyRIT 1.0.0 新增）
  # 将恶意请求分解为看似无害的子任务，再重新包装
  decomposition_policy_chain:
    converters:
      - DecompositionConverter
      - TaskFramingConverter
    params:
      DecompositionConverter:
        use_word_game: true
      TaskFramingConverter:
        task_template: "TASK is '{{ prompt }}'"

  # 噪声+大写链（PyRIT 1.0.0 新增）
  # 在 prompt 中注入随机噪声和大写字符，干扰内容过滤器
  noise_case_chain:
    converters:
      - NoiseConverter
      - RandomCapitalLettersConverter
      - Base64Converter
    params:
      NoiseConverter:
        number_errors: 5
      RandomCapitalLettersConverter:
        percentage: 40.0

  # 任务框架链（PyRIT 1.0.0 新增）
  # 将请求包装为特定任务格式
  task_framing_chain:
    converters:
      - TaskFramingConverter
      - PersuasionConverter
    params:
      TaskFramingConverter:
        task_template: "TASK is '{{ prompt }}'"
      PersuasionConverter:
        persuasion_technique: "authority_endorsement"

  # PDF 注入链（高级 File Converter — 修改现有 PDF）
  # 在现有 PDF 的指定坐标注入攻击文本，用于 XPIA/RAG 文档投递攻击
  # existing_pdf 和 injection_items 需在运行时通过 create_pdf_injection_chain() 设置
  pdf_injection:
    converters:
      - PDFConverter
    params:
      PDFConverter:
        font_color: [255, 255, 255]
        font_size: 6

  # WordDoc 注入链（高级 File Converter — 占位符替换）
  # 在现有 Word 文档中替换占位符为攻击内容
  # existing_docx 需在运行时通过 create_worddoc_injection_chain() 设置
  worddoc_injection:
    converters:
      - WordDocConverter
    params:
      WordDocConverter:
        placeholder: "{{INJECTION_PLACEHOLDER}}"

  # TextJailbreak 链（使用越狱模板包装）
  # jailbreak_template 需在运行时通过 create_text_jailbreak_chain() 设置
  text_jailbreak:
    converters:
      - TextJailbreakConverter

  # Response Converter 链（响应转换器）
  # 对目标响应应用 DenylistConverter 过滤敏感内容
  response_filter:
    converters:
      - DenylistConverter
    apply_to_response: true

  # 高级字段示例链（ConverterConfiguration 高级字段）
  # indexes_to_apply 指定应用到哪些响应片段
  # prompt_data_types_to_apply 按数据类型过滤
  advanced_selective:
    converters:
      - Base64Converter
    indexes_to_apply: [0, 2]
    prompt_data_types_to_apply: ["text"]

  # 多模态图片攻击链（text → image_path）
  # 将文本 prompt 转换为 QR 码图片，用于多模态攻击
  multimodal_image_attack:
    converters:
      - QRCodeConverter

  # ────────────────────────────────────────────────────────────
  # P1: Target-Aware 高成功率 Converter 链
  # ────────────────────────────────────────────────────────────

  # 多层编码 V2 链（Base64 + ROT13 + Caesar(5) + Atbash）
  # 四层编码，几乎所有内容过滤器失效
  # 适用: LLM Direct (openai_chat, openai_responses, litellm, azure_ml)
  multi_encoding_v2:
    converters:
      - Base64Converter
      - ROT13Converter
      - CaesarConverter
      - AtbashConverter
    params:
      CaesarConverter:
        caesar_offset: 5

  # 权威说服链（Persuasion + Tone + Translation）
  # 使用权威背书策略 + 正式语气 + 语言切换
  # 适用: LLM Direct / Agent (LLM 辅助，绕过语义安全分类器)
  persuasion_authority:
    converters:
      - PersuasionConverter
      - ToneConverter
      - TranslationConverter
    params:
      PersuasionConverter:
        persuasion_technique: "authority_endorsement"
      ToneConverter:
        tone: "formal"
      TranslationConverter:
        language: "en"

  # Agent 注入链（UnicodeConfusable + SuffixAppend + TaskFraming）
  # 针对智能体系统的专用注入链
  # 适用: Agent (Web/Copilot/API) — 目标劫持 + 工具参数注入
  agent_injection_chain:
    converters:
      - UnicodeConfusableConverter
      - SuffixAppendConverter
      - TaskFramingConverter
    params:
      SuffixAppendConverter:
        suffix: "!"
      TaskFramingConverter:
        task_template: "TASK is '{{ prompt }}'"
        strip_characters: ""

  # XPIA 隐写链（PDFConverter 白色小字隐写）
  # 将攻击内容嵌入白色小字 PDF，用于 XPIA/RAG 文档投递
  # 适用: RAG (azure_blob) / Output Handling (http_raw)
  xpia_stealth_chain:
    converters:
      - PDFConverter
    params:
      PDFConverter:
        font_color: [255, 255, 255]
        font_size: 6

# ------------------------------------------------------------
# Target-Aware Converter Profiles (ASR引导策略 v4.0)
# ------------------------------------------------------------
# 根据不同 Target 类型自动选择成功率最高的 Converter 链
# ASR引导策略: 学术+PyRIT 融合 — 按模型安全强度分层
#
# 优先级 (academic 模式):
#   high_asr > llm_assisted > medium_asr > low_asr
#
# 学术依据:
#   - 强过滤商业模型 (GPT-4o/Claude 3.5): 编码攻击 ASR 3-12% (HarmBench)
#   - 弱过滤/开源模型 (GPT-3.5/LLaMA): 编码攻击 ASR 35-55% (HarmBench)
#   - 多轮迭代攻击 (Crescendo/PAIR/TAP): GPT-4o ASR 50-85% (JailbreakBench)
#   - 说服策略攻击: GPT-4o ASR 30-40% (Zeng et al., arXiv:2402.19181)
# ------------------------------------------------------------
target_aware_converter_profiles:
  # ── 强过滤商业模型 (GPT-4o, Claude 3.5, Gemini) ──
  # 编码攻击 ASR 极低 (3-12%), 策略级变换 >> 表示级变换
  llm_direct_strong:
    description: "强过滤商业模型 — 内容过滤 + 语义安全分类器 + 拒绝分类器"
    bypass_mechanism: "content_filter + semantic_classifier"
    high_asr: []
    medium_asr: [stealth_evasion, multi_encoding_v2, agent_injection_chain]
    low_asr: [encoding_bypass, unicode_attack, random_case, policy_puppetry]
    llm_assisted: [persuasion_authority, decomposition_chain, llm_assisted]
    target_types: [openai_chat, openai_responses, azure_ml]
    model_filter: "gpt-4o|gpt-4|claude-3|claude-4|gemini"

  # ── 弱过滤/开源模型 (GPT-3.5, LLaMA, Vicuna uncensored) ──
  # 编码攻击仍有效 (35-55%), 速度快
  llm_direct_weak:
    description: "弱过滤/开源模型 — 基础关键词过滤, 编码攻击仍有效"
    bypass_mechanism: "basic_keyword_filter"
    high_asr: [multi_encoding_v2, stealth_evasion, encoding_bypass]
    medium_asr: [persuasion_authority, decomposition_chain, agent_injection_chain]
    low_asr: []
    llm_assisted: [persuasion_authority, decomposition_chain, llm_assisted]
    target_types: [litellm]
    model_filter: "gpt-3.5|llama|vicuna|mistral|uncensored|phi"

  # ── LLM Safety (Prompt Shield) ──
  llm_safety:
    description: "LLM Safety — Prompt Shield 检测绕过"
    bypass_mechanism: "prompt_shield_detection"
    high_asr: [stealth_evasion, multi_encoding_v2]
    medium_asr: [noise_case_chain, unicode_attack, random_case]
    low_asr: [encoding_bypass]
    llm_assisted: [decomposition_chain, persuasion_authority]
    target_types: [prompt_shield]

  # ── Agent (Web UI) ──
  agent_web:
    description: "Agent (Web UI) — 前端输入验证 + 后端双重检查"
    bypass_mechanism: "input_validation"
    high_asr: [agent_injection_chain, stealth_evasion]
    medium_asr: [decomposition_policy_chain, policy_puppetry_chain, task_framing_chain]
    low_asr: []
    llm_assisted: [persuasion_authority]
    target_types: [playwright, playwright_copilot]

  # ── Agent (Copilot) ──
  agent_copilot:
    description: "Agent (Copilot) — 系统提示 + Grounding + 工具权限"
    bypass_mechanism: "grounding_safety"
    high_asr: [agent_injection_chain, unicode_attack]
    medium_asr: [policy_puppetry_chain, task_framing_chain, decomposition_policy_chain]
    low_asr: []
    llm_assisted: [persuasion_authority]
    target_types: [websocket_copilot]

  # ── Agent (API) ──
  agent_api:
    description: "Agent (API) — API 层验证 + Schema 约束"
    bypass_mechanism: "api_schema_validation"
    high_asr: [agent_injection_chain, encoding_bypass]
    medium_asr: [task_framing_chain, decomposition_policy_chain]
    low_asr: []
    llm_assisted: [persuasion_authority]
    target_types: [http_api]

  # ── RAG ──
  rag:
    description: "RAG — 文档投毒 / XPIA 载荷投递"
