# ============================================================
# 路径与输出默认值
# ============================================================
# 控制数据库、日志、报告、证据的输出位置
#
# 优先级：.env 环境变量 > 本文件默认值
# ============================================================

# --- 数据库 ---
memory:
  db_type: SQLite                    # InMemory / SQLite / AzureSQL
  db_path: output/db/exam_results.db  # SQLite 数据库文件路径

# --- 日志 ---
logs_dir: output/logs

# --- 报告 ---
report:
  output_dir: output/reports
  format: markdown                    # markdown / html / pdf

# --- 证据 ---
evidence_dir: output/evidence
