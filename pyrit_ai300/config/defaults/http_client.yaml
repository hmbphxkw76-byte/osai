# ============================================================
# HTTP 客户端参数默认值
# ============================================================
# 控制目标连接的 HTTP 客户端行为
#
# 优先级：.env 环境变量 > 本文件默认值
# ============================================================

# --- 目标 HTTP 客户端 ---
target:
  # R0 对齐 httpx 最佳实践 — 分阶段 Timeout
  # timeout 配置为读取超时（read timeout），等待 API 推理响应的最长时间
  # 实际 httpx.Timeout 对象自动构建为:
  #   connect=10s (快速检测不可达)
  #   read=<timeout> (等待推理响应，含队列等待)
  #   write=30s (发送请求体)
  #   pool=10s (连接池等待)
  # 弱模型(≤14B)推理慢但 120s 足够；推理模型 o1/o3 建议 600+
  timeout: 120              # 读取超时（秒）
  verify: false             # SSL 证书验证（false=跳过自签名证书）
  http2: false              # HTTP/2 支持
  # proxy: http://proxy:8080  # 代理 URL（按需启用）

# --- 评分器 HTTP 客户端 ---
judge:
  timeout: 120              # 读取超时（秒）
  verify: true              # 评分器通常使用正规 HTTPS 端点
  http2: false

# --- 速率限制 ---
rate_limit:
  max_requests_per_minute: null   # null=不限制；设为整数启用限流
