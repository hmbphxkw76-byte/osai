# ============================================================
# HTTP 客户端参数默认值
# ============================================================
# 控制目标连接的 HTTP 客户端行为
#
# 优先级：.env 环境变量 > 本文件默认值
# ============================================================

# --- 目标 HTTP 客户端 ---
target:
  timeout: 300              # HTTP 请求超时（秒）；慢速 API（如 LongCat）建议 300+，推理模型 o1/o3 建议 600+
  verify: false             # SSL 证书验证（false=跳过自签名证书）
  http2: false              # HTTP/2 支持
  # proxy: http://proxy:8080  # 代理 URL（按需启用）

# --- 评分器 HTTP 客户端 ---
judge:
  timeout: 120              # 评分请求超时（秒）
  verify: true              # 评分器通常使用正规 HTTPS 端点
  http2: false

# --- 速率限制 ---
rate_limit:
  max_requests_per_minute: null   # null=不限制；设为整数启用限流
