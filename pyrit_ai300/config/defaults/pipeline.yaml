# ============================================================
# Pipeline 运行参数默认值
# ============================================================
# 控制攻击执行的并发、超时、输出行为
#
# 优先级：.env 环境变量 > 本文件默认值
# ============================================================

# --- 策略模式 ---
# academic: 高 ASR 技术优先 (Tier S → A → B → C → D)
# exam: 编码优先, 快速验证 (按执行速度排序)
# balanced: 策略 + 编码交替
strategy_mode: academic

# --- 并发控制 ---
max_concurrency: 1            # 最大并发攻击计划数（1=串行，避免触发目标限流）
# 注意：max_concurrency 只限制并发"攻击计划"数
# 单个攻击内部（尤其是 TAP/PAIR）仍有大量并发 API 调用
# 使用 API_MAX_CONCURRENCY 环境变量控制 API 级别并发

# 原生 AdaptiveScenario 并发数（降低并发减少 API 压力）
# 针对 LongCat-2.0 等慢 API，从 4 降至 2 避免队列拥堵
adaptive_max_concurrency: 2

# API 级别并发信号量上限（防止 503 scheduler queue full）
# 用于 rate_limited_target.py / adaptive_runner.py
# 针对 LongCat-2.0 等慢 API，从 3 降至 2 减少并发压力
api_max_concurrency: 2

# --- API 级别限速（对齐 PyRIT Resiliency 文档）---
# PyRIT 原生已处理（通过 @limit_requests_per_minute + @pyrit_target_retry 装饰器）：
#   - RPM 限速：通过 TargetParams.max_requests_per_minute 激活
#   - 429 重试：tenacity 指数退避，RETRY_MAX_NUM_ATTEMPTS / RETRY_WAIT_MIN/MAX_SECONDS 控制
#   - EmptyResponse 重试：同上
# 自建补充（rate_limited_target.py，PyRIT 原生不覆盖）：
#   TARGET_MAX_RPM=60          # 目标 API RPM（透传到 TargetParams → PyRIT 原生装饰器）
#   JUDGE_MAX_RPM=60           # 评分器 API RPM（同上）
# 503/502 重试复用 PyRIT 的 RETRY_MAX_NUM_ATTEMPTS 环境变量（统一配置源）

# --- 超时控制 ---
per_attack_timeout: 300       # 默认单次攻击超时（秒）- 增大从 180
# 按攻击模式差异化超时（秒）
# 针对 LongCat-2.0 等慢 API，增大多轮和顺序组合的超时时间
# 多轮攻击（crescendo/TAP/PAIR）消耗大，300s 过长易导致单计划耗时 20+ 分钟
timeout_overrides:
  single_turn: 120            # 单轮直接攻击（从 90 增大）
  converter_enhanced: 300     # 编码转换增强（从 150 增大）
  multi_turn: 600             # 多轮渐进攻击（从 180 大幅增大）
  sequential: 900             # 顺序组合攻击（从 300 大幅增大）

# --- 失败处理 ---
fail_fast: false              # 单个攻击失败是否终止全部

# --- 输出控制 ---
verbose_success: true         # 成功攻击输出完整详情（推荐开启，合并原 verbose/verbose_success）

# --- 交互式选择 ---
interactive_selection: true   # 是否启用种子组交互选择（false=全选，CI/CD 兼容）

# --- 三层渐进式选择 (②.5 Layer 1-3) ---
# 将 724+ 载荷记录缩减为 3 层决策（目标类型→ASR排序组→降级策略）
# 禁用时回退到旧版 SeedGroupSelector
tiered_selection:
  enabled: true               # 是否启用三层选择（false=旧版 SeedGroupSelector）
  target_type: null            # 预设目标类型（null=交互选择）
  # 可选值: llm_direct / agent / rag_vector / mcp_tool / copilot / multimodal / output_handling / llm_safety / defense_bypass / full_sweep
  # 向后兼容: rag→rag_vector, vector_db→rag_vector, web_output→output_handling
  top_n: 3                     # 每次推荐的组数
  fallback_strategy: sequential_asr_desc  # 降级策略
  # 可选值: sequential_asr_desc / parallel / adaptive

# --- 重试配置 (PyRIT 三层重试机制) ---
# Low-level: target HTTP 重试（指数退避，处理 RateLimit / EmptyResponse）
# Mid-level: JSON 解析重试（立即重试，处理 InvalidJson）
# High-level: Scenario 工作流重试（恢复式重试，跳过已完成目标）
#
# P2 对齐：pipeline.yaml 是重试配置的唯一真相源
# configure_retry_env_vars(override=True) 会将以下值传播到环境变量
# .env 中的 RETRY_* 环境变量不会被读取（已被移除）
retry:
  max_num_attempts: 5         # 低层重试最大次数（针对慢 API 从 3 增大）
  wait_min_seconds: 2         # 低层重试最小等待秒数（从 1 增大）
  wait_max_seconds: 60        # 低层重试最大等待秒数（从 10 大幅增大，给 API 恢复时间）

# Scenario 级别重试（高层工作流弹性恢复）
# 0=快速失败（开发推荐）
# 1=弱模型推荐（≤14B 重试成功率低，减少无效等待）
# 2=慢 API 推荐（LongCat-2.0 等云 API 需要更多恢复时间）
# 3=弹性恢复（生产推荐）
scenario_max_retries: 2

# --- Adaptive 执行参数 ---
# 每个 objective 最大尝试次数（覆盖高 ASR Converter 变体）
max_attempts_per_objective: 5

# --- 停止策略 (三层最优策略) ---
# L1: completion_policy=FIRST_SUCCESS — 同一 objective 多技术链，首成功即停（PyRIT 原生，不可配置）
# L2: owasp_success_threshold — 同一 OWASP 分类内成功率达标即跳过剩余计划
#     0.0=禁用（向后兼容）
#     合理范围（基于 AI-300 考试 4 小时时限 + 多 OWASP 覆盖需求）:
#       0.3 = 快速验证（6个中2个即停，时间紧迫时使用，可能遗漏深层漏洞）
#       0.5 = 考试推荐（6个中3个即停，平衡效率与置信度）
#       0.8 = 深度审计（6个中5个即停，时间充裕时使用，覆盖最全面）
#     不同 OWASP 分类独立计算，所有 OWASP 均有成功时停止降级链
#     注意: 所需成功数上限为 5（防止大计划数场景下阈值过高）
# L3: stop_on_first_success — 全局首成功即停（最激进模式，忽略 OWASP 分类）
#     适用于快速验证场景，不推荐用于正式考试
owasp_success_threshold: 0.5       # L2: OWASP 分类成功率阈值（0.0=禁用，0.5=考试推荐）
stop_on_first_success: false       # L3: 全局首成功即停（默认关闭）
