# ============================================================
# Pipeline 运行参数默认值
# ============================================================
# 控制攻击执行的并发、超时、输出行为
#
# 优先级：.env 环境变量 > 本文件默认值
# ============================================================

# --- 并发控制 ---
max_concurrency: 1            # 最大并发攻击数（1=串行，避免触发目标限流）

# --- 超时控制 ---
per_attack_timeout: 300       # 默认单次攻击超时（秒）
# 按攻击模式差异化超时（秒）
timeout_overrides:
  single_turn: 90             # 单轮直接攻击
  converter_enhanced: 150     # 编码转换增强
  multi_turn: 300             # 多轮渐进攻击
  sequential: 480             # 顺序组合攻击

# --- 失败处理 ---
fail_fast: false              # 单个攻击失败是否终止全部

# --- 输出控制 ---
verbose: false                # 全量 verbose（输出每个攻击的完整详情，含失败）
verbose_success: true         # 仅成功攻击输出完整详情（推荐开启）

# --- 交互式选择 ---
interactive_selection: true   # 是否启用种子组交互选择（false=全选，CI/CD 兼容）

# --- 重试配置 (PyRIT 原生 HTTP 重试) ---
retry:
  max_num_attempts: 3         # 空响应/限流时的最大重试次数
  wait_min_seconds: 1         # 重试最小等待秒数
  wait_max_seconds: 10        # 重试最大等待秒数
