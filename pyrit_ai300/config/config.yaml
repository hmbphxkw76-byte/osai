# ============================================================
# PyRIT 端到端全自动AI红队框架 - 全局配置文件
# ============================================================
# 本文件包含所有全局可配置参数
# 遵循开发规则 1.4.2 避免硬编码原则：所有可变参数从此文件读取
# ============================================================

# ------------------------------------------------------------
# 全局配置
# ------------------------------------------------------------
global:
  debug: false
  log_level: INFO
  max_concurrent_attacks: 4
  timeout: 300  # 单次攻击超时时间（秒）
  request_interval_ms: 2000  # 请求间隔，避免触发WAF

# ------------------------------------------------------------
# 考试模式配置
# ------------------------------------------------------------
exam:
  enabled: false
  duration_hours: 24
  report_format: markdown
  evidence_collection: true
  time_warning_interval_minutes: 30

# ------------------------------------------------------------
# 认证配置模板
# ------------------------------------------------------------
authentication:
  # API Key 认证
  api_key:
    header_name: Authorization
    header_format: "Bearer {token}"

  # Bearer Token 认证
  bearer_token:
    header_name: Authorization
    header_format: "Bearer {token}"

  # Cookie 认证
  cookie:
    header_name: Cookie

  # OAuth 认证
  oauth:
    token_url: ""
    grant_type: client_credentials
    client_id_env: OAUTH_CLIENT_ID
    client_secret_env: OAUTH_CLIENT_SECRET

# ------------------------------------------------------------
# 目标配置 (对齐 PyRIT 1.0.0 全部 Target 类型)
# ------------------------------------------------------------
# 三级配置优先级：显式参数 > 环境变量 > config.yaml
# 支持的 Target 类型 (PyRIT 1.0.0):
#   openai_chat         - OpenAIChatTarget (Chat Completions API, Ollama/vLLM/Azure)
#   openai_responses    - OpenAIResponseTarget (Responses API, o1/o3 + Agentic Tool Calling)
#   litellm             - LiteLLMChatTarget (100+ Provider)
#   http_api            - HTTPXAPITarget (结构化 HTTP API)
#   http_raw            - HTTPTarget (原始 HTTP / Burp Suite)
#   playwright          - PlaywrightTarget (Web UI 自动化)
#   websocket_copilot   - WebSocketCopilotTarget (M365 Copilot)
#   playwright_copilot  - PlaywrightCopilotTarget (Copilot Web)
#   azure_blob          - AzureBlobStorageTarget (XPIA 载荷投递)
#   prompt_shield       - PromptShieldTarget (防御测试)
#   text                - TextTarget (调试输出)
# ------------------------------------------------------------
target:
  # 目标类型 (留空 = 自动检测)
  # type: openai_chat

  # 认证模式 (auto / api_key / identity)
  # auto: Azure 端点无 API Key 时自动使用 Entra ID
  # identity: 强制 Entra ID / Managed Identity (Azure OpenAI)
  auth_mode: auto

  # HTTP 客户端配置 (httpx_client_kwargs)
  httpx:
    # 超时秒数 (推理模型 o1/o3 建议 300+)
    timeout: 180
    # SSL 证书验证
    verify: false
    # 代理 URL
    # proxy: http://proxy:8080

  # 推理参数 (OpenAI Chat / Responses / LiteLLM)
  inference:
    temperature: null          # 0=确定性, 2=最随机
    top_p: null                # 0-1
    max_completion_tokens: null # Chat Completions API
    max_output_tokens: null    # Responses API (o1/o3)
    frequency_penalty: null    # -2.0 到 2.0
    presence_penalty: null     # -2.0 到 2.0
    seed: null                 # 固定随机种子

  # Responses API 专用 (o1/o3/o4-mini 推理模型)
  responses:
    reasoning_effort: null     # minimal / low / medium / high
    reasoning_summary: null    # auto / concise / detailed

  # 通用透传
  extra_body_parameters: null  # JSON dict, 注入到 API 请求体
  underlying_model: null       # Azure 部署名 ≠ 模型名时用于标识

  # 能力探测
  capability_discovery:
    enabled: true              # 是否执行能力探测
    apply: true                # 是否将探测结果应用到 Target
    per_probe_timeout_s: 10.0  # 单个探针超时

  # 速率限制
  max_requests_per_minute: null

  # 支持的端点列表（用于侦察阶段端点探测）
  supported_endpoints:
    - "/v1/chat/completions"
    - "/v1/chat"
    - "/v1/completions"
    - "/v1/responses"          # Responses API (o1/o3)
    - "/chat/completions"
    - "/api/chat"
    - "/v1/query"
    - "/v1/embeddings"
    - "/v1/agent"
    - "/v1/task"
    - "/v1/workflow"
    - "/mcp"
    - "/tools"
    - "/mcp/v1"
    - "/.well-known/mcp"
    - "/v1/search"
    - "/v1/retrieve"
    - "/v1/vectors"
    - "/v1/models"
    - "/health"
    - "/v1/inference"

  # 目标类型 → 推荐的 Attack 类
  target_to_attack_mapping:
    openai_chat:
      - prompt_sending
      - multi_prompt_sending
      - many_shot
      - skeleton
      - red_teaming
      - crescendo
      - pair
      - tap
      - tree_of_attacks_pruned
    openai_responses:
      - prompt_sending
      - red_teaming
      - crescendo
    litellm:
      - prompt_sending
      - red_teaming
    http_api:
      - prompt_sending
      - barge_in
      - chunked_request
    http_raw:
      - prompt_sending
    playwright:
      - prompt_sending
      - red_teaming

  # 回调函数默认配置 (http_api / http_raw)
  callbacks:
    default_json_response_key: "choices[0].message.content"
    default_regex_pattern: "[\\s\\S]*"

# ------------------------------------------------------------
# AI系统类型识别规则（标注PyRIT攻击能力）
# ------------------------------------------------------------
ai_type_detection:
  # LLM 系统 [★ PyRIT核心攻击目标]
  llm:
    endpoint_patterns:
      - "/v1/chat/completions"
      - "/v1/chat"
      - "/chat/completions"
      - "/v1/completions"
    pyrit_attackable: true
    recommended_attacks:
      - PromptSendingAttack
      - RedTeamingAttack
      - CrescendoAttack

  # Multi-agent 系统 [★ PyRIT可攻击（XPIA + 直接注入）]
  multi_agent:
    endpoint_patterns:
      - "/v1/agent"
      - "/v1/task"
      - "/v1/workflow"
    response_indicators:
      - "planner"
      - "executor"
      - "reviewer"
      - "agent"
    pyrit_attackable: true
    recommended_attacks:
      - XPIATestWorkflow
      - PromptSendingAttack
      - RedTeamingAttack

  # MCP 服务器系统 [★ PyRIT可攻击（工具描述注入）]
  mcp_server:
    endpoint_patterns:
      - "/mcp"
      - "/tools"
      - "/mcp/v1"
      - "/.well-known/mcp"
    response_indicators:
      - "mcp"
      - "tool_use"
      - "function_call"
      - "tool_call"
    pyrit_attackable: true
    recommended_attacks:
      - XPIATestWorkflow
      - PromptSendingAttack

  # RAG 系统 [★ PyRIT可攻击（上下文注入）]
  rag:
    endpoint_patterns:
      - "/v1/query"
      - "/v1/search"
      - "/v1/retrieve"
    response_indicators:
      - "context"
      - "retrieved"
      - "documents"
    pyrit_attackable: true
    recommended_attacks:
      - XPIATestWorkflow
      - PromptSendingAttack
      - ChunkedRequestAttack

  # Embeddings 系统 [❌ 非PyRIT优势，仅识别端点]
  embeddings:
    endpoint_patterns:
      - "/v1/embeddings"
      - "/v1/vectors"
      - "/vectors"
    pyrit_attackable: false
    external_tools:
      - textattack
      - adversarial-robustness-toolbox

  # AI 基础设施 [❌ 非PyRIT优势，仅识别端点]
  infrastructure:
    endpoint_patterns:
      - "/v1/models"
      - "/health"
      - "/v1/inference"
    pyrit_attackable: false
    external_tools:
      - kubeaudit
      - prowler
      - checkov
      - impacket

# ------------------------------------------------------------
# PyRIT 配置
# ------------------------------------------------------------
pyrit:
  # Memory 后端类型：InMemory / SQLite / AzureSQL
  memory_db_type: SQLite
  # SQLite 数据库文件路径（通过 kwargs 传递给 SQLiteMemory）
  db_path: output/db/exam_results.db
  # 并发控制
  max_concurrency: 4
  # 证据输出目录
  evidence_dir: output/evidence
  # 日志输出目录
  logs_dir: output/logs

# ------------------------------------------------------------
# 报告配置
# ------------------------------------------------------------
report:
  output_dir: output/reports
  format: markdown
  include_owasp: true
  include_evidence: true
  include_timeline: true
  # CVSS 评分基准
  cvss_base:
    critical: 9.0
    high: 7.0
    medium: 4.0
    low: 0.1

# ------------------------------------------------------------
# 数据源配置 (批量多源攻击)
# ------------------------------------------------------------
payload_sources:
  # OWASP 目录数据源
  owasp:
    enabled: true
    base_path: "data/owasp"
    frameworks:
      - llm          # 加载 LLM01-LLM10
      - agentic      # 加载 ASI01-ASI10 (OWASP Agentic AI Top 10)
    # 指定加载的 OWASP ID（空 = 全部）
    owasp_ids: []
    # 排除的 OWASP ID
    exclude_ids: []

  # 自定义载荷
  custom:
    enabled: true
    path: "data/custom"

  # PyRIT 1.0.0 远程数据集（60+ Provider: HarmBench, JailbreakBench 等）
  remote:
    enabled: false             # 默认关闭，需要网络连接
    datasets:                 # 指定加载的数据集名称，空 = 全部
      # - harmbench
      # - jailbreakbench
      # - strong_reject
    max_concurrency: 3         # 远程加载并发数
    cache: true                # 是否使用本地缓存

  # TextJailBreak 模板包装（可选，用于增强单轮提示词）
  # 通过 Converter 链将 jailbreak 模板应用到 OWASP 单轮提示词
  text_jailbreak:
    enabled: false             # 是否启用 TextJailBreak 包装
    template_file: ""         # 指定模板文件名（如 "aim.yaml"），空 = 不指定
    random: false              # 是否随机选择模板

  # PyRIT 1.0.0 SeedSimulatedConversation 配置
  # 用于目标导向的多轮动态对话生成（RedTeaming/Crescendo 场景）
  simulated_conversation:
    enabled: false             # 是否启用模拟对话
    default_turns: 3           # 默认对话轮数

# ------------------------------------------------------------
# 数据集管理配置 (DatasetManager → CentralMemory)
# ------------------------------------------------------------
# 对齐 PyRIT 1.0.0 五层架构：
#   ① 数据准备层 → DatasetManager.load_datasets()
#   ② 数据管理层 → CentralMemory (add_seed_datasets_to_memory / get_seed_groups)
#   ③ 攻击准备层 → AttackPreparator (SeedGroup → AttackSeedGroup)
#
# 数据源自由组合（非一次性打包）：
#   1. OWASP 本地数据集 → data/owasp/llm/ + data/owasp/agentic/
#   2. 自定义载荷       → data/custom/
#   3. PyRIT 远程数据集 → 60+ Provider (HarmBench, JailbreakBench 等)
#
# Jailbreak 内容已包含在 PyRIT 远程数据集中（如 jailbreakbench），
# 不再单独加载 jailbreak_templates（范围太局限）。
# ------------------------------------------------------------
dataset_manager:
  # OWASP 本地数据集
  owasp:
    frameworks:
      - llm              # OWASP Top 10 for LLM Applications (LLM01-LLM10)
      - agentic          # OWASP Agentic AI Top 10 (ASI01-ASI10)
    owasp_ids: []        # 指定加载的 OWASP ID（空 = 全部），如 ["LLM01", "ASI05"]
    exclude_ids: []      # 排除的 OWASP ID

  # 自定义载荷
  custom:
    enabled: true        # 是否包含 data/custom/ 下的自定义 YAML

  # PyRIT 远程数据集（需要网络连接）
  remote:
    enabled: false       # 是否启用远程数据集
    datasets:            # 指定加载的数据集名称，空 = 全部
      # 推荐用于 AI-300 考试的远程数据集：
      # - harmbench           # HarmBench: 标准化有害行为评估
      # - jailbreakbench      # JailbreakBench: 越狱基准测试（含 jailbreak 内容）
      # - strong_reject       # StrongREJECT: 鲁棒拒绝评估
      # - xstest              # XSTest: 跨领域安全测试
      # - tdc23_redteaming    # TDC23: 红队攻击数据集

  # ②.5 交互式选择层配置
  # 在 CentralMemory 和 AttackPreparator 之间提供交互式选择界面
  # 让用户根据攻击目标选择最合适的攻击组合
  interactive_selection:
    enabled: true              # 是否启用交互式选择（false = 全选，跳过交互，CI/CD 兼容）
    auto_select_if_single: true # 如果只有 1 个种子组，自动选择
    page_size: 20              # 每页显示条目数

# ------------------------------------------------------------
# 批量执行配置
# ------------------------------------------------------------
batch_execution:
  max_concurrency: 4
  fail_fast: false           # 单个攻击失败是否终止全部
  per_attack_timeout: 300    # 默认超时（秒），被 timeout_overrides 覆盖
  # 按攻击模式差异化超时（秒）
  # 根据攻击复杂度设定合理阈值，避免简单攻击等待过久、复杂攻击被误杀
  timeout_overrides:
    single_turn: 90           # 单轮直接攻击（1次API调用+评分，应快速完成）
    converter_enhanced: 150   # 编码转换增强（额外转换链开销）
    multi_turn: 300           # 多轮渐进攻击（多轮对话+adversarial LLM迭代）
    sequential: 480           # 顺序组合攻击（异构技术链，天然更长）
  retry_on_error: false      # 失败重试