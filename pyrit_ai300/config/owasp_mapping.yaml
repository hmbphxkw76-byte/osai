# ============================================================
# OWASP 安全标准映射配置文件
# ============================================================
# 本文件包含两个 OWASP 安全标准与 PyRIT 攻击技术的映射：
#   1. OWASP Top 10 for LLM Applications 2025 (LLM01-LLM10)
#   2. OWASP Top 10 for Agentic AI (ASI01-ASI10)
# 仅保留 PyRIT 可执行的攻击映射（遵循开发规则 1.4.3）
# 来源: https://genai.owasp.org/llm-top-10/
# ============================================================

# ============================================================
# 第一部分: OWASP Top 10 for LLM Applications 2025
# ============================================================
# 官方发布: 2025版 (2025-01 更新)
# 参考: https://genai.owasp.org/llm-top-10/
# ============================================================

owasp_llm_top_10:
  LLM01:
    name: "Prompt Injection"
    version: "2025"
    description: "用户提示词改变了 LLM 的行为或输出，导致未授权的操作执行或信息泄露"
    severity: HIGH
    cvss_base: 8.5
    mitre_techniques:
      - T1059
      - T1189
    pyrit_attacks:
      - PromptSendingAttack
      - RedTeamingAttack
      - CrescendoAttack
      - TAPAttack
      - PAIRAttack
      - XPIATestWorkflow
    indicators:
      - "模型执行了未授权的指令"
      - "模型泄露了系统提示词"
      - "模型行为被注入的上下文操纵"
    remediation:
      - "实施输入清洗和验证"
      - "使用分隔符区分指令和数据"
      - "实施系统提示词隔离机制"

  LLM02:
    name: "Sensitive Information Disclosure"
    version: "2025"
    description: "LLM 在输出中泄露了敏感信息，包括训练数据、系统提示词、API密钥或个人隐私数据"
    severity: HIGH
    cvss_base: 7.5
    mitre_techniques:
      - T1003
      - T1552
    pyrit_attacks:
      - RedTeamingAttack
      - PromptSendingAttack
      - CredentialLeakScorer
    indicators:
      - "模型输出包含个人隐私数据"
      - "模型泄露系统内部信息"
      - "模型泄露 API 密钥或 Token"
      - "模型泄露训练数据内容"
    remediation:
      - "实施数据脱敏"
      - "限制模型对敏感信息的访问"
      - "对输出进行敏感信息检测和过滤"

  LLM03:
    name: "Supply Chain"
    version: "2025"
    description: "LLM 供应链中的漏洞，包括第三方模型、数据集、插件和依赖项被篡改"
    severity: HIGH
    cvss_base: 8.2
    mitre_techniques:
      - T1106
      - T1543
    pyrit_attacks:
      - PromptSendingAttack  # 提示词层面的供应链攻击
      - 多种 Converter 链
    indicators:
      - "模型执行了恶意插件"
      - "模型输出来自被污染的数据源"
      - "第三方组件存在已知漏洞"
    remediation:
      - "插件权限审查"
      - "依赖链验证"
      - "使用可信模型源"

  LLM04:
    name: "Data and Model Poisoning"
    version: "2025"
    description: "预训练、微调或嵌入数据被篡改，导致模型产生错误或恶意输出"
    severity: MEDIUM
    cvss_base: 6.5
    mitre_techniques:
      - T1588
    pyrit_attacks:
      - PromptSendingAttack  # 仅提示词层面的投毒载荷
    indicators:
      - "模型输出包含训练数据中的恶意内容"
      - "模型行为因数据投毒而异常"
    remediation:
      - "数据源验证"
      - "训练数据脱敏"
      - "实施数据完整性检查"

  LLM05:
    name: "Improper Output Handling"
    version: "2025"
    description: "LLM 输出未经充分验证、清洗和净化即被执行或渲染"
    severity: HIGH
    cvss_base: 8.0
    mitre_techniques:
      - T1059
      - T1106
    pyrit_attacks:
      - PromptSendingAttack
    indicators:
      - "模型输出被执行为代码"
      - "模型输出包含恶意脚本"
      - "模型输出触发 XSS/SQL 注入"
    remediation:
      - "对LLM输出进行严格验证"
      - "实施输出编码和转义"
      - "对输出内容进行安全沙箱处理"

  LLM06:
    name: "Excessive Agency"
    version: "2025"
    description: "基于 LLM 的系统被授予过度的自主权，导致未授权的操作执行"
    severity: MEDIUM
    cvss_base: 6.0
    mitre_techniques:
      - T1204
    pyrit_attacks:
      - PromptSendingAttack  # 仅提示词测试
      - XPIATestWorkflow
    indicators:
      - "模型执行了未预期的操作"
      - "工具被未授权调用"
      - "Agent 自主执行了超出范围的操作"
    remediation:
      - "限制模型操作范围"
      - "人工审核关键操作"
      - "实施最小权限原则"

  LLM07:
    name: "System Prompt Leakage"
    version: "2025"
    description: "LLM 系统提示词被泄露，暴露了模型的内部指令和配置"
    severity: MEDIUM
    cvss_base: 5.5
    mitre_techniques:
      - T1552
    pyrit_attacks:
      - RedTeamingAttack
      - PromptSendingAttack
    indicators:
      - "模型输出了系统提示词内容"
      - "模型泄露了内部配置信息"
      - "模型暴露了角色设定和指令"
    remediation:
      - "系统提示词中不包含敏感信息"
      - "实施输出过滤防止提示词泄露"
      - "使用分层提示词架构"

  LLM08:
    name: "Vector and Embedding Weaknesses"
    version: "2025"
    description: "向量数据库和嵌入存在的安全弱点，包括投毒注入和检索操纵"
    severity: MEDIUM
    cvss_base: 6.0
    mitre_techniques:
      - T1565
    pyrit_attacks:
      - XPIATestWorkflow  # 通过上下文注入攻击 RAG/向量数据库
      - PromptSendingAttack
    indicators:
      - "向量数据库被注入恶意内容"
      - "嵌入检索返回被污染的结果"
      - "RAG 系统输出被操纵"
    remediation:
      - "对向量数据库输入进行验证"
      - "实施嵌入完整性检查"
      - "限制向量数据库访问权限"

  LLM09:
    name: "Misinformation"
    version: "2025"
    description: "LLM 产生幻觉或输出虚假信息，导致用户做出错误决策"
    severity: LOW
    cvss_base: 4.0
    mitre_techniques:
      - T1560
    pyrit_attacks:
      - PromptSendingAttack  # 提示词层面诱导错误输出
    indicators:
      - "模型输出事实性错误信息"
      - "模型产生幻觉"
      - "模型输出具有误导性"
    remediation:
      - "实施事实核查机制"
      - "多模型交叉验证"
      - "提供来源引用和置信度"

  LLM10:
    name: "Unbounded Consumption"
    version: "2025"
    description: "LLM 被诱导执行大量资源消耗操作，导致拒绝服务或经济损失"
    severity: MEDIUM
    cvss_base: 6.0
    mitre_techniques:
      - T1499
    pyrit_attacks:
      - PromptSendingAttack  # 提示词层面的资源消耗
    indicators:
      - "模型响应时间显著增加"
      - "API 调用次数异常增加"
      - "资源消耗超出正常范围"
    remediation:
      - "实施速率限制"
      - "请求复杂度限制"
      - "设置 token 使用上限"

# ============================================================
# 第二部分: OWASP Top 10 for Agentic AI
# ============================================================
# 官方发布: Agentic Security Initiative
# 参考: https://genai.owasp.org/initiatives/agentic-security-initiative/
# ============================================================

owasp_asi_top_10:
  ASI01:
    name: "Goal Hijacking"
    description: "攻击者通过提示注入或其他手段改变 Agent 的原始目标"
    severity: HIGH
    cvss_base: 8.0
    mitre_techniques:
      - T1189
      - T1059
    pyrit_attacks:
      - PromptSendingAttack
      - XPIATestWorkflow
      - RedTeamingAttack
    indicators:
      - "Agent 偏离原始任务目标"
      - "Agent 执行了与原始目标无关的操作"
      - "Agent 目标被注入的指令篡改"
    remediation:
      - "实施目标验证和完整性检查"
      - "限制 Agent 目标修改权限"
      - "使用多 Agent 交叉验证"

  ASI02:
    name: "Tool Misuse"
    description: "Agent 被诱导以非预期方式使用工具，导致数据泄露或未授权操作"
    severity: HIGH
    cvss_base: 7.5
    mitre_techniques:
      - T1106
      - T1543
    pyrit_attacks:
      - XPIATestWorkflow
      - PromptSendingAttack
    indicators:
      - "Agent 调用了不在范围内的工具"
      - "工具被以非预期参数调用"
      - "工具返回结果被用于恶意目的"
    remediation:
      - "实施工具调用权限控制"
      - "对工具参数进行严格验证"
      - "限制工具调用范围和频率"

  ASI03:
    name: "Identity Abuse"
    description: "攻击者冒充合法用户或其他 Agent 身份，获取未授权访问"
    severity: HIGH
    cvss_base: 7.0
    mitre_techniques:
      - T1078
    pyrit_attacks:
      - PromptSendingAttack
      - XPIATestWorkflow
    indicators:
      - "Agent 使用了伪造的身份信息"
      - "Agent 冒充其他角色执行操作"
      - "身份验证被绕过"
    remediation:
      - "实施强身份验证机制"
      - "使用多因素认证"
      - "对 Agent 身份进行签名验证"

  ASI04:
    name: "Supply Chain (Agentic)"
    description: "Agent 依赖的第三方组件、模型或服务被篡改"
    severity: HIGH
    cvss_base: 8.2
    mitre_techniques:
      - T1106
      - T1543
    pyrit_attacks:
      - PromptSendingAttack  # 提示词层面
    indicators:
      - "Agent 使用了被篡改的第三方模型"
      - "Agent 依赖的 API 被劫持"
      - "Agent 插件供应链被污染"
    remediation:
      - "验证第三方组件完整性"
      - "使用可信供应链"
      - "实施组件签名验证"

  ASI05:
    name: "Code Execution"
    description: "Agent 被诱导执行未授权的代码或命令"
    severity: CRITICAL
    cvss_base: 9.0
    mitre_techniques:
      - T1059
      - T1106
    pyrit_attacks:
      - PromptSendingAttack
      - XPIATestWorkflow
    indicators:
      - "Agent 执行了未授权的系统命令"
      - "Agent 运行了恶意代码"
      - "Agent 突破了沙箱限制"
    remediation:
      - "实施代码执行沙箱"
      - "限制系统命令访问"
      - "使用代码签名验证"

  ASI06:
    name: "Agentic Memory Attack"
    description: "Agent 的记忆存储被篡改或注入恶意内容"
    severity: HIGH
    cvss_base: 7.5
    mitre_techniques:
      - T1585
    pyrit_attacks:
      - PromptSendingAttack  # 通过提示注入污染记忆
      - XPIATestWorkflow
    indicators:
      - "Agent 记忆被注入恶意指令"
      - "Agent 基于被篡改的记忆做出错误决策"
      - "Agent 历史记录被操纵"
    remediation:
      - "对记忆写入进行验证"
      - "实施记忆完整性检查"
      - "使用加密存储敏感记忆"

  ASI07:
    name: "Agent Communication"
    description: "Agent 间通信被劫持、监听或注入恶意消息"
    severity: HIGH
    cvss_base: 7.0
    mitre_techniques:
      - T1557
    pyrit_attacks:
      - XPIATestWorkflow
      - PromptSendingAttack
    indicators:
      - "Agent 间消息被篡改"
      - "恶意 Agent 注入虚假消息"
      - "通信协议被利用"
    remediation:
      - "实施通信加密"
      - "使用消息签名验证"
      - "限制 Agent 通信范围"

  ASI08:
    name: "Cascading Failures"
    description: "单个 Agent 或组件的失败导致连锁反应，影响整个系统"
    severity: MEDIUM
    cvss_base: 6.5
    mitre_techniques:
      - T1499
    pyrit_attacks:
      - PromptSendingAttack  # 触发单个 Agent 异常
    indicators:
      - "单个 Agent 失败导致系统级故障"
      - "错误传播到多个 Agent"
      - "系统恢复机制失效"
    remediation:
      - "实施故障隔离机制"
      - "设置 Agent 超时和熔断"
      - "使用冗余 Agent 架构"

  ASI09:
    name: "Trust Exploitation"
    description: "攻击者利用 Agent 间的信任关系进行未授权操作"
    severity: HIGH
    cvss_base: 7.0
    mitre_techniques:
      - T1556
    pyrit_attacks:
      - XPIATestWorkflow
      - PromptSendingAttack
    indicators:
      - "Agent 信任关系被滥用"
      - "受信任 Agent 执行了恶意操作"
      - "信任传递被利用"
    remediation:
      - "实施最小信任原则"
      - "定期审查信任关系"
      - "使用动态信任评估"

  ASI10:
    name: "Rogue AI Agent"
    description: "恶意或被篡改的 Agent 在系统中自主行动"
    severity: CRITICAL
    cvss_base: 9.0
    mitre_techniques:
      - T1059
      - T1543
    pyrit_attacks:
      - PromptSendingAttack  # 通过注入创建恶意 Agent 行为
      - XPIATestWorkflow
    indicators:
      - "Agent 行为偏离预设规则"
      - "Agent 自主创建后门"
      - "Agent 持续执行未授权操作"
    remediation:
      - "实施 Agent 行为监控"
      - "使用行为异常检测"
      - "设置 Agent 终止机制"

# ============================================================
# 第三部分: 攻击类型到 OWASP 的映射
# 仅保留 PyRIT 可执行的攻击类型
# ============================================================

attack_to_owasp:
  # --- LLM Top 10 2025 映射 ---
  prompt_injection: [LLM01]
  jailbreak: [LLM01, LLM07]
  indirect_injection: [LLM01, LLM06]
  tool_description_injection: [LLM06, LLM01]
  data_leakage: [LLM02]
  converter_evasion: [LLM05]
  xpia: [LLM01, LLM06]
  context_injection: [LLM01]
  system_prompt_extraction: [LLM07]
  credential_leak: [LLM02]
  data_poisoning_prompt_only: [LLM04]
  rag_poison: [LLM04, LLM01]
  vector_injection: [LLM08]
  misinformation: [LLM09]
  resource_exhaustion: [LLM10]
  # --- Agentic AI Top 10 映射 ---
  goal_hijack: [ASI01]
  tool_misuse: [ASI02]
  identity_abuse: [ASI03]
  agentic_supply_chain: [ASI04]
  code_execution: [ASI05]
  memory_poison: [ASI06]
  agent_communication_attack: [ASI07]
  cascading_failure: [ASI08]
  trust_exploitation: [ASI09]
  rogue_agent: [ASI10]

# ============================================================
# 第四部分: Cyber Kill Chain 映射（仅保留 PyRIT 可执行的阶段）
# ============================================================

kill_chain_mapping:
  reconnaissance:
    pyrit_components:
      - discover_target_capabilities_async
      - 端点探测
    owasp_ids: []
  weaponization:
    pyrit_components:
      - 载荷选择
      - Converter 配置
    owasp_ids: []
  delivery:
    pyrit_components:
      - PromptSendingAttack
      - RedTeamingAttack
    owasp_ids: [LLM01, LLM05]
  exploitation:
    pyrit_components:
      - 模型响应被操纵
    owasp_ids: [LLM01, LLM02, LLM06, LLM07, ASI01, ASI02]
  installation:
    pyrit_components:
      - 记忆污染
      - 向量数据库注入
    owasp_ids: [LLM04, LLM08, ASI06]
  command_and_control:
    pyrit_components:
      - 多轮对话控制
      - Agent 通信劫持
    owasp_ids: [LLM01, ASI07]
  actions_on_objectives:
    pyrit_components:
      - 数据泄露
      - 未授权操作
      - 代码执行
    owasp_ids: [LLM02, LLM05, ASI05, ASI10]
