[project]
name = "redteam-ai"
version = "2.1.0"
description = "AI-300 red team pipeline aligned with OSAI+ exam: recon -> inject -> agent -> RAG -> embeddings -> supply_chain -> infra -> report"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
redteam = "redteam.cli:main"

[tool.setuptools.packages.find]
include = ["redteam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
