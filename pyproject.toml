[project]
name = "redteam-ai"
version = "2.1.0"
description = "AI-300 red team pipeline aligned with OSAI+ exam: recon -> inject -> agent -> RAG -> embeddings -> supply_chain -> infra -> report"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pyrit>=0.13.0",
    "reportlab>=4.0",
    "python-docx>=1.1",
]

[project.scripts]
redteam = "redteam.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["redteam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
