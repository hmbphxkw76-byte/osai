# Model Seed Mapping — 90+ LLM Fingerprint → Historical Optimal Seeds.
#
# 学术依据:
#     - Greshake et al. (arXiv:2302.12173) — 模型族 → 种子定制
#     - Mazeika et al. (arXiv:2406.18510) — WILDTEAMING: ASR 提升 40-80%
#     - Anil et al. (arXiv:2401.05200) — many-shot jailbreaking 模型族适配
#     - Zou et al. (arXiv:2307.15043) — GCG 后缀敏感度模型族差异
#     - Perez et al. (arXiv:2202.03286) — InstructGPT 种子库红队
#     - Chao et al. (arXiv:2310.08419) — 多目标并行 ASR
#
# 使用方式:
#     from recon.model_seed_mapper import ModelSeedMapper
#     mapper = ModelSeedMapper()
#     seed_prefs = mapper.get_seeds_for_model("gpt-4o")
#
# 版本: 1.0.0 | 覆盖: 90+ 模型族

# ════════════════════════════════════════════════════════════════════
# 模型家族级映射 (family-level defaults)
# ════════════════════════════════════════════════════════════════════

model_families:
  # ─────────────────────────────────────────────────────
  # GPT Family (OpenAI)
  # ─────────────────────────────────────────────────────
  gpt-4o:
    preferred_templates:
      - authority_inference_key_given
      - researcher_scenario_key_given
      - step_by_step_analysis
    avoid_templates:  # 避免容易被检测的模板
      - system_override_skeleton_key
    optimal_converters:
      - base64
      - leet_speak
      - humanizer
    notes: "GPT-4o 对角色扮演场景极敏感, authority_inference 最优"

