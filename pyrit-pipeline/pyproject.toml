# ============================================================================
# pyrit-pipeline — ASR 数据驱动的端到端 AI Red Team 流水线
# ============================================================================
# 基于 PyRIT 原生框架二次开发，pyrit 作为 editable 依赖从 src/ 加载。
# 版本更新时只需替换 src/PyRIT-1.0.1/ 目录即可。
# ============================================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrit-pipeline"
version = "5.0.0"
description = "ASR-driven AI Red Team pipeline built on PyRIT (100% native API)"
requires-python = ">=3.10, <3.15"

dependencies = [
    "pyrit",  # 从 ../src/PyRIT-1.0.1 editable 安装（见 [tool.uv.sources]）
    "beautifulsoup4>=4.12",  # P2: DOM 检测精度提升 (TargetClassifier)
]

# ============================================================================
# Setuptools 包发现 — 显式指定, 避免 auto-discover 误纳入 data/output 目录
# ============================================================================
[tool.setuptools.packages.find]
include = ["pipeline*", "web_redteam*"]
exclude = ["data*", "output*", "scripts*", "tests*", "docs*"]

[project.optional-dependencies]
# web_redteam 需要 playwright + flask + ollama
web-redteam = [
    "pyrit[playwright]",
    "beautifulsoup4>=4.12",  # P2: DOM 检测精度提升
]
# GCG 对抗后缀生成需要 torch + accelerate
gcg = [
    "pyrit[gcg]",
]
# Fuzzer 载荷变异 (原生 pyrit.executor.promptgen.fuzzer)
fuzzer = [
    "pyrit[fuzzer]",
]
# HTML/PDF 报告生成
reports = [
    "markdown>=3.7",
    "weasyprint>=62.0",
]
reports-fallback = [
    "markdown>=3.7",
    "xhtml2pdf>=0.2.16",
]
# 全量安装（所有可选依赖）
all = [
    "pyrit[all]",
    "beautifulsoup4>=4.12",  # P2: DOM 检测精度提升 (TargetClassifier)
    "markdown>=3.7",
    "weasyprint>=62.0",
]
# 开发依赖 (含覆盖率 + lint + 格式化)
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.4",
    "pre-commit>=4.0.0",
    "mypy>=1.14.0",
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=3.0.0",
]

# ============================================================================
# UV 源配置 — 关键：将 pyrit 解析为本地 editable 安装
# ============================================================================
[tool.uv.sources]
pyrit = { path = "../src/PyRIT-1.0.1", editable = true }

# ============================================================================
# Pytest 配置
# ============================================================================
[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

# ============================================================================
# Ruff 配置
# ============================================================================
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "T10",    # flake8-debugger
    "ISC",    # flake8-implicit-str-concat
    "PIE",    # flake8-pie
    "Q",      # flake8-quotes
    "ANN",    # flake8-annotations (类型注解检查)
    "D",      # pydocstyle (docstring 检查)
]

[tool.ruff.lint.per-file-ignores]
# pipeline 代码: 保留 ANN 但豁免 D100 (模块 docstring) 和 D104 (包 docstring)
"pipeline/**/*.py" = ["D100", "D104", "ANN101", "ANN102", "ANN401", "D415"]
# web_redteam 代码: 同上 + ANN401 (动态类型) + E402 (playwright 导入模式)
"web_redteam/**/*.py" = ["D100", "D104", "ANN101", "ANN102", "ANN401", "E402", "D415"]
# scripts 代码: 放宽 (验证脚本, 导入分散在代码中)
"scripts/**/*.py" = ["D100", "D104", "ANN", "E402"]
# 测试代码: 豁免 docstring 风格、类型注解
"tests/**/*.py" = ["D100", "D101", "D102", "D104", "D403", "D415", "Q003", "ANN"]
"web_redteam/tests/**/*.py" = ["D100", "D101", "D102", "D104", "D403", "D415", "Q003", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ============================================================================
# Mypy 配置 (G-03: 类型安全)
# ============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # P2: 初期放宽, 后续逐步收紧
check_untyped_defs = true
ignore_missing_imports = true  # PyRIT 等第三方库无 type stub

# ============================================================================
# 覆盖率配置
# ============================================================================
[tool.coverage.run]
source = ["pipeline", "web_redteam"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 75
