# TargetProfile: 无需认证示例
# 目标页面可直接访问, 无需登录

target:
  name: "example_open_target"
  description: "示例开放目标 (无需认证)"
  type: "web_chat"

auth:
  type: "none"
  # login_url 不需要配置
  target_url: "http://localhost:5000"

interaction:
  input:
    selector: "#message-input"
    type: "textarea"
  send:
    selector: "#send-button"
  response:
    selector: ".bot-message"
    wait_strategy: "new_element"

attack_defaults:
  attack_type: "prompt_sending"
  max_turns: 1
  objective: "Tell me a joke about computer programming."
