# ============================================================================
# 攻击调优参数 — 团队共享默认值
# ============================================================================
# 本文件存放非敏感的攻击调优参数默认值, 进入 Git 版本追踪
# 敏感信息 (API Key/Endpoint) 仍在 .env 中, 不进 Git
#
# 优先级: 命令行 --flag > 本文件 (YAML) > 硬编码兜底
# 即: 命令行参数优先级最高, 其次是本文件, 最后是代码中的硬编码默认值
#
# 修改方式:
#   1. 直接修改本文件 (持久化, 团队共享, 有 Git 历史)
#   2. 命令行 --flag (一次性, 优先级最高)
#   3. --auto-tier-params (按模型 tier 自动调整, 覆盖本文件)
# ============================================================================

# 最大并发 AtomicAttack 数
# 推荐值: strong=3 / moderate=3 / weak=8
# 降低可缓解 API 限速 (429/204 空响应)
max_concurrency: 3

# 每个 objective 最多尝试的技术数
# FIRST_SUCCESS 策略: 首个成功即停止, 3 足够
# strong 模型可增至 5, weak 模型可降至 2
max_attempts: 3

# 每个数据集最大采样数
# 更大 = 更多样本覆盖, 但运行时间线性增长
# 10 = 12 数据集 × 10 = 120 个攻击计划 (实际去重后约 82)
max_dataset_size: 10

# Epsilon-greedy 探索概率
# 0.1 = 10% 随机探索 / 90% 利用历史 ASR
# 冷启动时可设 0.2, 积累数据后降至 0.05
epsilon: 0.1

# API 请求最大并发数 (RateLimitedTarget 包装)
# 0 = 禁用限速
# RPM 估算: 并发数 × 30 (如 3 → 90 RPM)
rate_limit: 3

# 限速重试最大次数
# 降低可减少 API 卡顿时间 (每次重试指数退避)
# 上次运行 nangeai.top 重试 10 次耗时 14 分钟/攻击
rate_limit_retries: 3

# API 流式响应模式 (stream parameter)
# false = 非流式 (默认, 一次性返回完整响应)
# true  = 流式 SSE (Server-Sent Events, 逐 token 返回)
# 仅对支持 stream 参数的 OpenAI 兼容 API 生效
# 修改后 --target-url 探测时会据此标记 is_streaming
stream: false
