# R-015: 三库标准全量测试 CI/CD
# 每次 PR / push 自动执行 ruff + pytest
name: Lint & Test (R-015)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Ruff check (R-015)
        run: ruff check pipeline/ scripts/ tests/ conftest.py
      - name: Pytest (R-015)
        run: pytest tests/ -v --tb=short
