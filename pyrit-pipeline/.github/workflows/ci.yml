# ============================================================================
# GitHub Actions CI — L5 工程化标准 (G-04)
# ============================================================================
# 三阶段: lint (ruff) → type-check (mypy) → test (pytest + coverage)
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ── Stage 1: Lint + Format ──
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff>=0.14.4
      - name: Ruff check
        run: ruff check pipeline/ web_redteam/ tests/
      - name: Ruff format check
        run: ruff format --check pipeline/ web_redteam/ tests/

  # ── Stage 2: Type Check ──
  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install mypy>=1.14 pyyaml
          pip install -e ".[dev]"
      - name: mypy
        run: mypy --config-file=pyproject.toml --ignore-missing-imports pipeline/ web_redteam/
        continue-on-error: true  # P2: 初期非阻塞，后续收紧

  # ── Stage 3: Test + Coverage ──
  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # PyRIT editable 依赖需要 src/ 目录
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pyyaml

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=pipeline --cov=web_redteam --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
