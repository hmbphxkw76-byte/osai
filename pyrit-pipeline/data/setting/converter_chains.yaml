  # P2: 跨范式短链
  cross_paradigm_2layer:
    requires_llm: false
    priority: 1
    modality: text
    description: 'P2: Base64 + UnicodeConfusable 跨范式 2 层 (编码+混淆, 1.6x ASR) — 注意: Base64 完全编码, 目标无法解码, 仅 many_shot 适用'
    cost_tier: cheap
  # P3: 语义保持混淆链 (保持可读性, 替代 Base64 编码)
  semantic_evasion:
    requires_llm: false
    priority: 1
    modality: text
    description: 'P3: UnicodeConfusable + Leetspeak 语义保持混淆 (可读性 100%, 绕过关键词过滤, 1.5x ASR)'
    cost_tier: cheap
  cross_paradigm_3layer:
    requires_llm: true
    priority: 2
    modality: text
    description: 'P2: Base64 + UnicodeConfusable + Persuasion 跨范式 3 层 (编码+混淆+语义)'
    cost_tier: moderate
  # P4: 多模态 Converter 链 (PyRIT 原生 Converter, 按模态选择)
  # 学术依据: Shayegani et al. (arXiv:2306.13254) 多模态组合攻击 + FigStep (arXiv:2307.14400)
  image_text_embed:
    requires_llm: true
    priority: 1
    modality: image
    description: 'P4: AddImageText — 将攻击指令嵌入图像绕过文本过滤'
    cost_tier: moderate
  image_qr_encode:
    requires_llm: false
    priority: 2
    modality: image
    description: 'P4: QRCode — 将攻击 prompt 编码为 QR 图'
    cost_tier: cheap
  image_rotate_ocr:
    requires_llm: false
    priority: 1
    modality: image
    description: 'P4: ImageRotation — 旋转图像绕过 OCR 检测'
    cost_tier: cheap
  image_overlay_hide:
    requires_llm: true
    priority: 2
    modality: image
    description: 'P4: ImageOverlay — 图像叠加隐藏攻击指令'
    cost_tier: moderate
  image_text_rotate_chain:
    requires_llm: true
    priority: 1
    modality: image
    description: 'P4: AddImageText › ImageRotation 跨模态 2 层'
    cost_tier: moderate
  image_transparency:
