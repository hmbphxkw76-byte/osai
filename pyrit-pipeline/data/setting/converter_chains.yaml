combo_multipliers:
  description: 'D13: Chain combination synergy multipliers'
  academic_basis: 'Russinovich et al. (arXiv:2402.12109): Crescendo + encoding = 3-5x
    ASR'
  combos:
  - chains:
    - encoding_bypass
    - stealth_evasion
    multiplier: 1.5
    note: encoding + obfuscation
  - chains:
    - multi_encoding_v2
    - stealth_evasion
    multiplier: 1.4
    note: multi-encoding + obfuscation
  - chains:
    - persuasion_authority
    - decomposition_chain
    multiplier: 1.3
    note: persuasion + decomposition
  - chains:
    - unicode_attack
    - random_case
    multiplier: 1.2
    note: unicode + case variation
  - chains:
    - encoding_bypass
    - unicode_attack
    multiplier: 1.6
    note: encoding + unicode dual-layer
  - chains:
    - token_smuggling_chain
    multiplier: 1.3
    note: token smuggling single-chain boost
  - chains:
    - encoding_bypass
    - token_smuggling_chain
    multiplier: 1.4
    note: encoding + token smuggling cross-paradigm
  - chains:
    - stealth_evasion
    - token_smuggling_chain
    multiplier: 1.35
    note: obfuscation + token smuggling cross-paradigm
  - chains:
    - semantic_evasion
    multiplier: 1.5
    note: P3 semantic evasion (readability-preserving, unicode+leetspeak)
  - chains:
    - cross_paradigm_2layer
    multiplier: 1.6
    note: P2 cross-paradigm 2-layer (encoding+obfuscation, Base64 — many_shot only)
  - chains:
    - cross_paradigm_3layer
    multiplier: 1.8
    note: P2 cross-paradigm 3-layer (encoding+obfuscation+semantic)
