# Target-Aware Converter 路由配置 — P5-1 外部化
#
# 定义 Target 类型映射、分组和 Converter 链推荐。
# Python 代码 (target_aware_router.py) 仅保留路由逻辑,
# 本文件是唯一数据源。
#
# 学术依据:
# - Wei et al. (arXiv:2307.15043): 编码攻击表示级变换
# - Russinovich et al. (arXiv:2402.12109): Crescendo + encoding 协同
# - Zeng et al. (arXiv:2402.19181): 说服策略 ASR
# - Shayegani et al. (arXiv:2306.13254): 多模态组合攻击
# - FigStep (arXiv:2307.14400): 图像编码绕过 OCR
#
# 维护: 新增 Target 类型或调整 Converter 链推荐时只需修改本文件
# ====================================================================

# ── PyRIT Target 类名 → target_type 映射 ──
# 用于从 Target 实例的类名推断 target_type
class_name_map:
  OpenAIChatTarget: openai_chat
  OpenAIResponseTarget: openai_responses
  LiteLLMChatTarget: litellm
  AzureMLChatTarget: azure_ml
  PromptShieldTarget: prompt_shield
  PlaywrightTarget: playwright
  PlaywrightCopilotTarget: playwright_copilot
  CopilotTarget: websocket_copilot
  WebSocketCopilotTarget: websocket_copilot
  HTTPTarget: http_api
  AzureBlobStorageTarget: azure_blob
  OpenAIImageTarget: openai_image
  OpenAIVideoTarget: openai_video
  OpenAITTSTarget: openai_tts

# ── target_type → 分组映射 ──
# 将具体 target_type 归类为安全机制分组
type_groups:
  openai_chat: llm_direct
  openai_responses: llm_direct
  litellm: llm_direct
  azure_ml: llm_direct
  prompt_shield: llm_safety
  playwright: agent_web
  playwright_copilot: agent_web
  websocket_copilot: agent_copilot
  http_api: agent_api
  azure_blob: rag
  http_raw: output_handling
  openai_image: multimodal_image
  openai_video: multimodal_video
  openai_tts: multimodal_audio
  text: llm_direct

# ── Target 分组 → Converter 链推荐 ──
# 4 层 ASR 链推荐 (model_tier 感知):
#   high_asr_chains:     ASR >= 40% — 非 LLM 链, 快速高命中率
#   medium_asr_chains:   ASR 15-40% — 非 LLM 链, 中等命中率
#   low_asr_chains:      ASR 5-15% — 非 LLM 链, 兜底覆盖
#   llm_assisted_chains: LLM 辅助 — 仅在 converter_target 可用且非弱模型时推荐
#
# P1+P5 优化 (arXiv:2402.04249 HarmBench + arXiv:2402.12109 Crescendo + arXiv:2306.13254 多模态):
#   - 同范式叠加边际递减, 每范式最多 1 链
#   - 跨范式 2-3 层协同 3-5x ASR, 优于同范式多链
#   - 精简推荐链数, 避免扁平化后 12+ Converter 导致 prompt 膨胀和 API 超时
#   - 多模态目标使用模态专用链 (image/audio/video), 非文本目标不堆砌 text 链
converter_profiles:
  llm_direct:
    # P3: 语义保持混淆优先 — Base64 完全编码导致目标无法解码
    high_asr_chains:
      - semantic_evasion
    medium_asr_chains:
      - search_replace_chain
    low_asr_chains: []
    llm_assisted_chains:
      - persuasion_authority
    bypass_mechanism: "content_filter + semantic_classifier"
    description: "LLM 直连 — 内容过滤 + 语义安全分类器 (P3: 语义保持混淆)"

  llm_safety:
    # P1: Prompt Shield 检测 — 混淆优先
    high_asr_chains:
      - stealth_evasion
    medium_asr_chains:
      - search_replace_chain
    low_asr_chains: []
    llm_assisted_chains:
      - persuasion_authority
    bypass_mechanism: "prompt_shield_detection"
    description: "LLM Safety — Prompt Shield 检测绕过 (P1: 精简)"

  agent_web:
    # P3: 语义保持混淆 — 前端验证绕过
    high_asr_chains:
      - semantic_evasion
    medium_asr_chains:
      - stealth_evasion
    low_asr_chains: []
    llm_assisted_chains:
      - persuasion_authority
    bypass_mechanism: "input_validation"
    description: "Agent (Web UI) — 前端输入验证 + 后端双重检查 (P3: 语义保持混淆)"

  agent_copilot:
    # P3: 语义保持混淆 — Grounding 绕过
    high_asr_chains:
      - semantic_evasion
    medium_asr_chains: []
    low_asr_chains: []
    llm_assisted_chains:
      - persuasion_authority
    bypass_mechanism: "grounding_safety"
    description: "Agent (Copilot) — 系统提示 + Grounding + 工具权限 (P3: 语义保持混淆)"

  agent_api:
    # P3: 语义保持混淆 — Schema 约束绕过
    high_asr_chains:
      - semantic_evasion
    medium_asr_chains: []
    low_asr_chains: []
    llm_assisted_chains:
      - persuasion_authority
    bypass_mechanism: "api_schema_validation"
    description: "Agent (API) — API 层验证 + Schema 约束 (P3: 语义保持混淆)"

  rag:
    # P3: 语义保持混淆 + 文件投递
    high_asr_chains:
      - semantic_evasion
    medium_asr_chains:
      - file_pdf_injection
    low_asr_chains: []
    llm_assisted_chains:
      - persuasion_authority
    bypass_mechanism: "document_sanitization"
    description: "RAG — 文档清理 + 来源验证 (P3: 语义保持混淆+文件投递)"

  output_handling:
    # P3: 语义保持混淆 — 输出过滤绕过
    high_asr_chains:
      - semantic_evasion
    medium_asr_chains: []
    low_asr_chains: []
    llm_assisted_chains:
      - persuasion_authority
    bypass_mechanism: "output_filtering"
    description: "Output Handling — 输出过滤 + 转义 (P3: 语义保持混淆)"

  multimodal_image:
    # P5: 图像模态专用链 — arXiv:2306.13254 组合攻击
    high_asr_chains:
      - image_text_embed
    medium_asr_chains:
      - image_qr_encode
      - image_rotate_ocr
    low_asr_chains:
      - image_transparency
    llm_assisted_chains:
      - image_text_rotate_chain
    bypass_mechanism: "multimodal_filter"
    description: "多模态图片 — 图像内容过滤 (P5: 模态专用链)"

  multimodal_video:
    # P5: 视频模态专用链
    high_asr_chains:
      - video_embed_chain
    medium_asr_chains: []
    low_asr_chains: []
    llm_assisted_chains: []
    bypass_mechanism: "multimodal_filter"
    description: "多模态视频 — 视频内容过滤 (P5: 模态专用链)"

  multimodal_audio:
    # P5: 音频模态专用链
    high_asr_chains:
      - audio_stego_chain
    medium_asr_chains:
      - audio_freq_chain
    low_asr_chains:
      - audio_echo_chain
    llm_assisted_chains: []
    bypass_mechanism: "audio_filter"
    description: "多模态音频 — 音频内容过滤 (P5: 模态专用链)"
