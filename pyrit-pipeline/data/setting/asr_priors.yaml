# ── G4: 模型特异性说服策略映射 ──
# 学术依据: Zeng et al. (arXiv:2402.19181)
#   - 权威说服对 Claude ASR=30%, GPT-4 ASR=35%
#   - 情感/场景对 GPT-4 ASR=38%, Llama ASR=62%
#   - 逻辑/分解对 Llama ASR=55%, Claude ASR=25%
# 不同模型的安全对齐方式不同, 导致对不同说服策略的脆弱性不同
persuasion_strategy_by_model:
  # ── Claude 系列: Constitutional AI → 权威/角色扮演优先 ──
  "claude":
    primary: persuasion_authority
    secondary: role_play_movie_script
    rationale: "Constitutional AI 对角色扮演/权威场景更敏感"
  # ── GPT-4 系列:RLHF → 情感/场景模拟优先 ──
  "gpt-4":
    primary: role_play_persuasion
    secondary: persuasion_authority
    rationale: "RLHF 对情感/场景模拟的防御较弱"
  "gpt-4o":
    primary: role_play_persuasion
    secondary: persuasion_authority
    rationale: "RLHF 对情感/场景模拟的防御较弱"
  # ── Llama 系列:RLHF+Safety → 逻辑/分解优先 ──
  "llama":
    primary: decomposition_chain
    secondary: persuasion_authority
    rationale: "Llama 对逻辑分解攻击更脆弱"
  # ── Gemini 系列:RLHF → 场景模拟优先 ──
  "gemini":
    primary: role_play_persuasion
    secondary: decomposition_chain
    rationale: "Gemini 对场景模拟的防御较弱"
  # ── Mistral 系列:Safety + Guard → 编码+说服 ──
  "mistral":
    primary: persuasion_authority
    secondary: encoding_bypass
    rationale: "Mistral Guard 对编码攻击有漏洞"
  # ── Qwen 系列:RLHF → 逻辑分解优先 ──
  "qwen":
    primary: decomposition_chain
    secondary: persuasion_authority
    rationale: "Qwen 对逻辑分解攻击更脆弱"
  # ── DeepSeek 系列:RLHF → 场景模拟优先 ──
  "deepseek":
    primary: role_play_persuasion
    secondary: decomposition_chain
    rationale: "DeepSeek 对场景模拟的防御较弱"

# ── P2-2: 模型特异性种子优先级 ──
# 学术依据: HarmBench (arXiv:2402.04249) 模型间种子有效性差异
#   - 同一种子对不同模型的 ASR 差异可达 30-50%
#   - 按模型系列优先选择高命中率的种子类别, 减少无效尝试
#
# 映射: 模型系列 → 种子类别优先级列表 (高→低)
# 当 --model 指定时, 按此优先级排序已加载的种子
seed_priority_by_model:
  # ── GPT-4 系列:RLHF → 说服/场景种子优先 ──
  "gpt-4":
    - persuasion        # 说服类种子 (GPT-4 ASR 38%)
    - role_play         # 角色扮演种子
    - multi_turn        # 多轮渐进种子
    - encoding          # 编码类种子 (GPT-4 ASR 低)
    - baseline          # 基线种子
  "gpt-4o":
    - persuasion
    - role_play
    - multi_turn
    - encoding
    - baseline
  # ── Claude 系列:Constitutional AI → 角色扮演/权威种子优先 ──
  "claude":
    - role_play         # 角色扮演种子 (Claude 对角色扮演更敏感)
    - persuasion        # 权威说服种子
    - multi_turn
    - encoding
    - baseline
  # ── Llama 系列:RLHF+Safety → 编码/分解种子优先 ──
  "llama":
    - encoding          # 编码类种子 (Llama ASR 55%)
    - decomposition     # 分解类种子
    - multi_turn
    - persuasion
    - baseline
  # ── Gemini 系列:RLHF → 场景模拟种子优先 ──
  "gemini":
    - role_play
    - persuasion
    - multi_turn
    - encoding
    - baseline
  # ── Mistral 系列:Safety+Guard → 编码+说服种子优先 ──
  "mistral":
    - encoding
    - persuasion
    - multi_turn
    - role_play
    - baseline
  # ── Qwen 系列:RLHF → 分解/编码种子优先 ──
  "qwen":
    - decomposition
    - encoding
    - multi_turn
    - persuasion
    - baseline
  # ── DeepSeek 系列:RLHF → 场景模拟种子优先 ──
  "deepseek":
    - role_play
    - decomposition
    - multi_turn
    - persuasion
    - baseline
