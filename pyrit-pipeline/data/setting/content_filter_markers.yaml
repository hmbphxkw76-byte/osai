# ============================================================================
# 内容过滤器标记扩展配置
# ============================================================================
#
# PyRIT 原生 CONTENT_FILTER_MARKERS (不可删除,仅做参考):
#   content_filter
#   content_safety_violation
#   policy_violation
#   moderation_blocked
#
# 本文件定义额外的标记,用于识别第三方 OpenAI 兼容 API 的安全审查错误。
# 这些标记会与原生标记合并,通过子串匹配方式检测内容过滤响应。
#
# 检测原理:
#   PyRIT 的 _is_content_filter_error() 将整个错误负载 JSON-dump 后做子串扫描,
#   任意一个标记出现在负载中即判定为内容过滤。
#
# 维护指南:
#   - 新增 API 供应商的安全审查错误码时,在下方添加对应标记即可
#   - 标记应选取错误负载中唯一的、可区分的子串 (如 error.code 或 error.type 的值)
#   - 中文关键词也可以作为标记 (子串匹配对 UTF-8 字符同样有效)
#
# 已知供应商错误格式:
#   LongCat-2.0:  {'error': {'code': 'security_audit_fail', 'type': 'security_error'}}
#   通义千问:     {'error': {'code': 'sensitive_content', ...}}
#   百度文心:     {'error': {'code': 'risk_content_detected', ...}}
#   DeepSeek:     {'error': {'code': 'review_blocked', ...}}
# ============================================================================

extra_markers:
  # ── LongCat-2.0 API — 服务器端 security_audit 安全审查 ──
  - security_audit_fail
  - security_error

  # ── 通义千问 / 阿里云 — 内容安全审查 ──
  - sensitive_content
  - content_safety_block

  # ── 百度文心 — 风险内容检测 ──
  - risk_content_detected

  # ── DeepSeek (部分版本) — 审查拦截 ──
  - review_blocked

  # ── 通用中文安全审查关键词 (子串匹配) ──
  - 违规信息
  - 内容审查
