# Converter 增益估计 (基于学术文献先验, 非实测)
# 来源: arXiv:2402.12109 (Russinovich et al.): Crescendo + encoding 协同 3-5x ASR
#        arXiv:2307.15043 (Wei et al.): encoding bypass 绕过表示级过滤
#        arXiv:2402.19181 (Zeng et al.): 说服策略 ASR 30-40%
# 用途: 展示层预测 ASR = base ASR + gain (仅展示, 不影响实际执行)
converter_gain_estimates:
  Base64Converter: 0.13
  ROT13Converter: 0.10
  MultiEncoderConverter: 0.15
  PersuasionAuthorityConverter: 0.08
  LeetspeakConverter: 0.10
  TranslationConverter: 0.08
  UrlConverter: 0.12
  UnicodeConfusableConverter: 0.12
  AsciiArtConverter: 0.05
  MorseConverter: 0.08
  SeedExtensionConverter: 0.05
  VariationConverter: 0.05
  SuffixAppendConverter: 0.05
  DecompositionConverter: 0.10
  AsciiSmugglerConverter: 0.15
  SneakyBitsSmugglerConverter: 0.12

# 技术协同关系 (基于学术文献, 展示层用)
# 在策略段末尾展示, 帮助攻击者理解技术组合的增益效果
tech_synergy:
  - techs: ["crescendo_simulated", "encoding"]
    gain: "3-5x ASR"
    ref: "arXiv:2402.12109"
    desc: "Crescendo + encoding 协同"
  - techs: ["pair", "persuasion"]
    gain: "+8% ASR"
    ref: "arXiv:2310.08437"
    desc: "PAIR + 说服策略"
  - techs: ["tap", "encoding"]
    gain: "+13% ASR"
    ref: "arXiv:2307.15043"
    desc: "TAP + encoding bypass"
  - techs: ["many_shot", "encoding"]
    gain: "+10% ASR"
    ref: "arXiv:2307.15043"
    desc: "Many-shot + encoding"
