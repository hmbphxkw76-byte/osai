# ============================================================================
# 统一数据集清单 — 多源数据集注册表
# ============================================================================
# 记录所有可用数据集（本地 + 远程缓存 + 生成），供 Stage 2 加载和排序使用。
# 数据 5 层架构 L1 (Seed Source) 的唯一注册点。
#
# 字段说明:
#   name:           数据集名称 (与 .prompt 文件中 dataset_name 一致)
#   source:         数据来源 (local / remote_cached / generated)
#   path:           本地文件路径 (local / remote_cached 类型)
#   provider:       PyRIT 原生 Provider 名称 (remote 类型)
#   owasp_ids:      覆盖的 OWASP 分类 (LLM01-LLM10 / ASI01-ASI10)
#   technique_groups: 主要攻击技术组
#   harm_categories: 危害分类
#   default:        是否在默认运行中加载
# ============================================================================

datasets:
  # ── OWASP LLM Top 10 (本地富元数据) ──
  - name: owasp_llm01_prompt_injection
    source: local
    path: data/owasp/llm01_prompt_injection.prompt
    owasp_ids: [LLM01]
    technique_groups: [prompt_sending, context_compliance]
    harm_categories: [information_integrity]
    default: true

  - name: owasp_llm02_insecure_output
