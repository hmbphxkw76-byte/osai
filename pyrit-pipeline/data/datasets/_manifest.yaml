  # ── 远程学术基准数据集 (需预下载到 data/datasets/ 目录) ──
  # 运行 scripts/download_datasets.py 下载后, source 从 remote 变为 remote_cached
  - name: harmbench
    source: remote_cached
    path: data/datasets/harmbench.prompt
    provider: HarmbenchProvider
    owasp_ids: []
    technique_groups: [prompt_sending, red_teaming]
    harm_categories: [cybercrime, illegal, chemical_biological, harassment]
    default: true

  - name: jbb_behaviors
