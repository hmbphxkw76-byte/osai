    harm_categories: [disinformation, hate, illegal_goods, violence]
    default: true

# ── OWASP 分类映射表 (用于 ASR 感知数据集选择) ──
owasp_mapping:
  LLM01:
    title: Prompt Injection
    primary_techniques: [prompt_sending, context_compliance, crescendo]
    target_groups: [llm_direct, llm_safety, agent_api]
  LLM02:
    title: Insecure Output Handling
    primary_techniques: [prompt_sending, context_compliance]
    target_groups: [output_handling, llm_direct]
  LLM03:
    title: Training Data Poisoning
    primary_techniques: [prompt_sending, context_compliance]
    target_groups: [llm_direct, rag]
  LLM04:
    title: Model Denial of Service
    primary_techniques: [prompt_sending, context_compliance]
    target_groups: [llm_direct, llm_safety]
  LLM05:
