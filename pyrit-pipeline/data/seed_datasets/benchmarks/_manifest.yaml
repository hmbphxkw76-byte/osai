    default: false

  # ── 远程学术基准数据集 (需预下载到 data/seed_datasets/benchmarks/ 目录) ──
  # 运行 scripts/download_datasets.py 下载后, source 从 remote 变为 remote_cached
  - name: harmbench
    source: remote_cached
    path: data/seed_datasets/benchmarks/harmbench.prompt
    provider: HarmbenchProvider
    owasp_ids: []
    technique_groups: [prompt_sending, red_teaming]
    harm_categories: [cybercrime, illegal, chemical_biological, harassment]
    default: true

  - name: jbb_behaviors
    source: remote_cached
    path: data/seed_datasets/benchmarks/jbb_behaviors.prompt
    provider: JbbBehaviorsProvider
    owasp_ids: []
    technique_groups: [prompt_sending, red_teaming]
    harm_categories: [disinformation, harassment, malware, physical_harm, privacy, sexual]
    default: true

  - name: strong_reject
    source: remote_cached
    path: data/seed_datasets/benchmarks/strong_reject.prompt
    provider: StrongRejectProvider
    owasp_ids: []
    technique_groups: [prompt_sending]
    harm_categories: [disinformation, hate, illegal_goods, violence]
    default: true

  # ── 精简种子集 (去重 + 类别均衡 + 多样性聚类 + ASR 加权) ──
  # 生成: python scripts/curate_seeds.py
  # 学术依据: JailbreakBench (arXiv:2402.01135), DART (arXiv:2407.06485)
  - name: curated_seeds
    source: generated
    path: data/seed_datasets/benchmarks/curated_seeds.prompt
    owasp_ids: []
    technique_groups: [prompt_sending, red_teaming]
    harm_categories: [cybercrime, illegal, chemical_biological, harassment, disinformation, violence, privacy, sexual, malware, copyright]
    default: false

  # ── 模型感知种子集 (按目标模型 Tier 选择最高 ASR 种子) ──
  # 生成: python scripts/curate_seeds.py --model <name> --modality <text|multimodal>
  # 学术依据: HarmBench (arXiv:2402.04249), RAIN (arXiv:2309.07124)
  # 攻击成功为王: 不同模型 → 不同 ASR 先验 → 不同种子排名
  - name: curated_seeds_gpt_4o
    source: generated
    path: data/seed_datasets/benchmarks/curated_seeds_gpt_4o.prompt
    owasp_ids: []
    technique_groups: [prompt_sending, red_teaming, crescendo, tap, pair]
    harm_categories: [cybercrime, illegal, chemical_biological, harassment, disinformation, violence, privacy, sexual, malware, copyright]
    default: false

  - name: curated_seeds_llama_3_8b
    source: generated
    path: data/seed_datasets/benchmarks/curated_seeds_llama_3_8b.prompt
    owasp_ids: []
    technique_groups: [prompt_sending, red_teaming, crescendo, tap, pair, many_shot]
    harm_categories: [cybercrime, illegal, chemical_biological, harassment, disinformation, violence, privacy, sexual, malware, copyright]
    default: false

# ── OWASP Top 10 for LLM Applications 2025 分类映射表 ──
owasp_mapping:
  LLM01:
    title: Prompt Injection
    primary_techniques: [prompt_sending, context_compliance, crescendo, tap, pair]
    target_groups: [llm_direct, llm_safety, agent_api]
  LLM02:
    title: Sensitive Information Disclosure
    primary_techniques: [prompt_sending, red_teaming, crescendo, tap, pair]
    target_groups: [llm_direct, llm_safety]
  LLM03:
    title: Supply Chain
    primary_techniques: [prompt_sending, context_compliance]
    target_groups: [llm_direct, agent_api, rag]
  LLM04:
    title: Data and Model Poisoning
    primary_techniques: [prompt_sending, context_compliance]
    target_groups: [llm_direct, rag]
  LLM05:
    title: Improper Output Handling
    primary_techniques: [prompt_sending, context_compliance]
    target_groups: [output_handling, llm_direct]
  LLM06:
    title: Excessive Agency
    primary_techniques: [prompt_sending, context_compliance, crescendo]
    target_groups: [agent_web, agent_copilot, agent_api]
  LLM07:
    title: System Prompt Leakage
    primary_techniques: [prompt_sending, context_compliance, crescendo, tap]
    target_groups: [llm_direct, llm_safety, agent_api]
  LLM08:
