  ASI05:
    title: Privilege Escalation
    primary_techniques: [prompt_sending, context_compliance, crescendo]
    target_groups: [agent_web, agent_copilot, agent_api]
  ASI06:
    title: Memory Poisoning
    primary_techniques: [prompt_sending, context_compliance]
    target_groups: [agent_web, agent_copilot, rag]
  ASI07:
    title: Cross-Agent Injection
    primary_techniques: [prompt_sending, context_compliance]
    target_groups: [agent_web, agent_copilot, agent_api]
  ASI08:
    title: Cascading Failures
    primary_techniques: [context_compliance, crescendo]
    target_groups: [agent_web, agent_copilot, agent_api]
  ASI09:
    title: Trust Boundary Violation
    primary_techniques: [prompt_sending, context_compliance]
