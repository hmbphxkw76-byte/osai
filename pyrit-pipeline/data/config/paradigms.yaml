# 攻击范式分类关键词配置 — P2-9 外部化
#
# 学术依据: Wei et al. (arXiv:2307.15043) "Jailbroken" 三分法:
#   - Competing Objectives → persuasion (说服/角色扮演/上下文操控)
#   - Mismatched Generalization → encoding (编码/密码/混淆)
#   - Compositional Attacks → multi_turn (多轮渐进/树搜索)
#
# 推断方式: 关键词模式匹配 (非集合成员检查)
# 优势: PyRIT 新增技术时, 名称含相似关键词即可自动分类
# 维护: 更新此文件即可刷新范式分类, 无需修改代码
# ====================================================================

# 多轮范式 (Compositional Attacks)
# 使用 AdversarialChat 迭代攻击的技术
multi_turn_keywords:
  - crescendo
  - red_team
  - redteam
  - tap
  - pair
  - many_shot
  - tree_of_attack
  - violent_durian
  - multi_turn

# 说服范式 (Competing Objectives)
# 通过角色扮演、上下文操控、说服策略绕过安全过滤
persuasion_keywords:
  - persuasion
  - role_play
  - roleplay
  - context_compliance
  - wrapping
  - decomposition
  - skeleton_key
  - best_of_n
  - bad_likert
  - simulated
  - movie
  - history_lecture
  - journalist
  - authority
  - trivia_game
  - video_game

# 编码范式 (Mismatched Generalization)
# 通过编码、密码、字符变换绕过安全过滤
encoding_keywords:
  - rot13
  - base64
  - caesar
  - binary
  - morse
  - leetspeak
  - flip
  - atbash
  - url
  - encoding
  - stealth
  - unicode
  - string_join
  - suffix
  - char_swap
  - diacritic
  - character_space
  - multi_encoding
  - zalgo
  - zero_width
  - braille
  - nato
  - superscript
  - ascii_art
  - emoji

# 多轮关键词中实际为单轮的技术 (预计算载荷)
multi_turn_names_hinting_single:
  - many_shot

# 安全对齐模型标记 (converter_target 检测)
safety_aligned_markers:
  - safety
  - guard
  - shield
  - moderation
  - llama-guard
  - prompt-shield
