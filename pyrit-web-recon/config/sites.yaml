# 已知目标站点的 DOM 选择器配置
# 键名可以是域名或任意站点别名，CLI 中通过 --site 指定
sites:
  openai-chatgpt:
    url: "https://chat.openai.com"
    spa_config:
      entry_selector: ""
      input_selector: "textarea#prompt-textarea"
      send_selector: "button[data-testid='send-button']"
      response_selector: "[data-message-author-role='assistant']"

  claude:
    url: "https://claude.ai"
    spa_config:
      entry_selector: ""
      input_selector: "[contenteditable='true'][data-placeholder]"
      send_selector: "button[aria-label='Send message']"
      response_selector: "[class*='assistant-turn']"

  gemini:
    url: "https://gemini.google.com"
    spa_config:
      entry_selector: ""
      input_selector: "textarea[placeholder*='Ask']"
      send_selector: "button[aria-label='Send message']"
      response_selector: "[class*='response-content']"

  qianwen:
    url: "https://tongyi.aliyun.com"
    spa_config:
      entry_selector: ""
      input_selector: "textarea[class*='chat-input']"
      send_selector: "button[class*='send']"
      response_selector: "[class*='answer']"

  wenxin:
    url: "https://yiyan.baidu.com"
    spa_config:
      entry_selector: ""
      input_selector: "textarea[class*='send-box']"
      send_selector: "button[class*='send']"
      response_selector: "[class*='answer']"

  xinghuo:
    url: "https://xinghuo.xfyun.cn"
    spa_config:
      entry_selector: ""
      input_selector: "textarea[class*='chat-input']"
      send_selector: "button[class*='send']"
      response_selector: "[class*='ai-message']"

  zhipu:
    url: "https://chatglm.cn"
    spa_config:
      entry_selector: ""
      input_selector: "textarea[class*='input']"
      send_selector: "button[class*='send']"
      response_selector: "[class*='answer']"

  kimi:
    url: "https://kimi.moonshot.cn"
    spa_config:
      entry_selector: ""
      input_selector: "textarea[class*='chat-input']"
      send_selector: "button[class*='send']"
      response_selector: "[class*='markdown']"

  deepseek:
    url: "https://chat.deepseek.com"
    spa_config:
      entry_selector: ""
      input_selector: "textarea#chat-input"
      send_selector: "button[class*='send']"
      response_selector: "[class*='assistant-message']"
