# 全局侦察配置

# 浏览器启动与连接配置
browser_connection:
  # 页面导航时的 wait_until 状态
  wait_until: domcontentloaded
  # 页面导航超时（毫秒）
  timeout: 30000
  # 是否忽略 HTTPS 证书错误（测试自签名证书站点时使用）
  ignore_https_errors: true
  # 页面加载完成后额外等待时间（秒），用于等待 JS 渲染
  post_load_wait: 2
  # 浏览器视口大小
  viewport:
    width: 1366
    height: 768
  # 浏览器 User-Agent，所有请求统一使用
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

# 网络拦截与分析配置
network:
  # 请求体截断长度（字符）
  request_body_limit: 5000
  # 响应体截断长度（字符）
  response_body_limit: 5000
  # WebSocket 消息截断长度（字符）
  websocket_payload_limit: 2000
  # 文本分析长度限制（字符）
  text_length_limit: 5000

# API 探测配置（仅 target_type=api 时使用）
api_probe:
  # 是否强制对非 API 目标也执行 API 探测
  force_api_probe: false
  # Ollama 探测使用的模型名
  ollama_model: "llama2"
  # OpenAI 兼容探测使用的模型名
  openai_model: "gpt-3.5-turbo"
  # API 探测使用的提示词
  probe_prompt: "hi"
  # API 响应体截断长度（字符）
  response_body_limit: 5000

# 凭据目录
credentials_dir: credentials

# 日志与错误信息显示配置
logging:
  # 普通异常/错误日志消息截断长度（字符）
  error_message_limit: 120
  # 阶段异常信息截断长度（字符）
  stage_error_limit: 200

# 输出目录
output_dir: results/recon
template_dir: data/burp
profile_dir: results/recon/profiles
