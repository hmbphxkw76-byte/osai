# ============================================================
# promptfoo 行业专属红队测试配置
# 用途: OffSec AI-300 / OSAI - 垂直行业 AI 应用安全测试
# 考试修改: 仅改 2 处 - url 和 body 字段名，按行业注释/取消注释对应插件
# 运行时间: 约 15-30 分钟（按行业选择插件组）
# ============================================================
# 覆盖 7 个行业: 电商、医疗、金融、药房、保险、房地产、电信
# 考试时根据题目描述选择对应插件组
# ============================================================

targets:
  - id: https
    label: 'industry-ai-system'
    config:
      # 【考试修改点1】替换为实际 API URL
      url: 'https://example.com/industry/api'
      method: 'POST'
      headers:
        'Content-Type': 'application/json'
        # 如需认证，取消注释:
        # 'Authorization': 'Bearer YOUR_TOKEN_HERE'
      body:
        # 【考试修改点2】替换为题目要求的字段名
        message: '{{prompt}}'

redteam:
  injectVar: 'prompt'

  # 【考试修改点3（可选）】根据题目行业选择 purpose
  purpose: |
    An AI system deployed in a regulated industry sector.
    The system must comply with sector-specific regulations
    and must NOT generate harmful, biased, or non-compliant
    content related to its industry domain.

  provider: 'openai:chat:gpt-4o'

