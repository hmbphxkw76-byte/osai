# ===============================================================================
# PyRIT Red Team Payload 模块索引 (Manifest)
# ===============================================================================
# 此文件是 datasets/payloads/ 目录的总索引，列出所有模块→YAML 文件的映射关系。
# 
# 渗透者工作流:
#   1. 查找下表，确定目标模块对应的 YAML 文件
#   2. 编辑对应 YAML 文件中的 payload 内容
#   3. 运行 PyRIT 框架 → 自动加载 → 生成报告
#
# 维护者: 如需新增模块，在此文件的 modules 列表中添加条目，并在 payload_loader.py
#         的 MODULE_FILE_MAP 中注册映射关系。
# ===============================================================================

manifest:
  version: "2.0"
  generated: "2026-07-07"
  description: "RedTeam 全部 Payload 模块索引 — 渗透期间仅需编辑 YAML 文件"

# ── 经典攻击载荷 (core/) — 双语预设格式，用于 {key} 模板替换 ──
classic:
  - file: "core/classic_payloads_zh.yaml"
    lang: "zh"
    preset_count: 5
    description: "经典攻击载荷中文版，含 stealth/bruteforce/redteam/academic/minimal 五档预设"

  - file: "core/classic_payloads_en.yaml"
    lang: "en"
    preset_count: 5
    description: "经典攻击载荷英文版，含五档预设"

# ── AI 专项模块载荷 — 扁平列表格式，用于 penetrating_mode 攻击模块 ──
modules:

  # ── Intermediate Level ──
  - module_id: "04"
    title: "Prompt Injection Intermediate"
    key: "prompt_injection"
    file: "prompt_injection_payloads.yaml"
    loader: "penetrating_mode 内部加载 / UnifiedPayloadLoader.get_module('prompt_injection')"
    description: "直接注入、间接注入、跨上下文注入、多轮注入、指令层级绕过"

  - module_id: "05"
    title: "Jailbreaking Techniques Intermediate"
    key: "jailbreak"
    file: "jailbreak_payloads.yaml"
    loader: "UnifiedPayloadLoader.get_module('jailbreak')"
    description: "DAN 变体、Crescendo 多轮、编码绕过、多语言混合、CoT 拆解"

  - module_id: "06"
    title: "Data Exfiltration via LLM Intermediate"
    key: "exfiltration"
    file: "exfiltration_payloads.yaml"
    loader: "UnifiedPayloadLoader.get_module('exfiltration')"
    description: "PII 提取、凭据泄露、训练数据反演、隐写通道、A2A 数据外泄"

  - module_id: "07"
    title: "Insecure Output Handling Intermediate"
    key: "output_handling"
    file: "output_handling_payloads.yaml"
    loader: "UnifiedPayloadLoader.get_module('output_handling')"
    description: "XSS/HTML 注入、Markdown 注入、JSON 劫持、Mermaid 注入、SSI 注入"

  # ── Advanced Level ──
  - module_id: "08"
    title: "RAG Pipeline Attacks Advanced"
    key: "rag"
    file: "rag_payloads.yaml"
    loader: "penetrating_mode/rag_attacks.py → load_exam_module_yaml()"
    description: "文档投毒、检索操纵、上下文污染、间接注入、嵌入空间攻击"

  - module_id: "09"
    title: "Agent & Tool Hijacking Advanced"
    key: "agent"
    file: "agent_payloads.yaml"
    loader: "penetrating_mode/agent_attacks.py → load_exam_module_yaml()"
    description: "工具调用劫持、MCP 攻击、Function Call 注入、沙箱逃逸"

  - module_id: "10"
    title: "Multi-Agent Exploitation Advanced"
    key: "multi_agent"
    file: "multi_agent_payloads.yaml"
    loader: "UnifiedPayloadLoader.get_module('multi_agent')"
    description: "A2A 协议攻击、跨 Agent 权限提升、协调器投毒、Agent 链污染"

  - module_id: "11"
    title: "Model Extraction Advanced"
    key: "model_extraction"
    file: "model_extraction_payloads.yaml"
    loader: "penetrating_mode/infra_attacks.py → load_exam_module_yaml()"
    description: "影子模型、API 克隆、架构指纹、成员推断、黑盒查询"

  - module_id: "12"
