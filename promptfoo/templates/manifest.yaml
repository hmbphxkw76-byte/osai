  - module_id: "19"
    title: "Multi-Agent System Attacks Advanced"
    key: "multi_agent_attacks"
    file: "multi_agent_payloads.yaml"
    loader: "UnifiedPayloadLoader.get_module('multi_agent_attacks')"
    description: "多 Agent 攻击: 通信劫持、级联故障、记忆投毒、人机信任利用"

# ── Python 代码引用表（渗透者无需关心，仅供开发维护参考）──
code_references:
  unified_loader: "data/payload_loader.py"
  data_loader: "data/loader.py"
  module_file_map: "data/payload_loader.py:MODULE_FILE_MAP"
  exam_loader:
    rag: "penetrating_mode/rag_attacks.py → load_exam_module_yaml()"
    agent: "penetrating_mode/agent_attacks.py → load_exam_module_yaml()"
    infra: "penetrating_mode/infra_attacks.py → load_exam_module_yaml()"
