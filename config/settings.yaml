# AI-300 红队评估配置
recon:
  concurrency: 3              # 并发线程数，低并发减少 WAF 突发检测
  timeout: 10                 # 单请求超时（秒）
  rate_limit_ms: 800          # 请求最小间隔（毫秒），0=不限速，500-1000ms 模拟人工浏览绕过 WAF
  # 词表
  ai_wordlist: config/wordlists/ai_paths.txt   # AI 端点探测词表路径
  proxy: ""

# 攻击载荷库
payload:
  dir: config/payloads        # 攻击载荷 YAML 文件存放目录

# 持久化（原始攻击数据）
store:
  dir: results

# 报告（正式提交报告产出）
report:
  out_dir: reports
