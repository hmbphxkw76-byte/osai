# =============================================================================
# RedTeam-AI 本地场景注册表 (Local Scenario Registry)
# =============================================================================
# 本文件用于注册用户自定义/本地场景，不会被 Git 版本控制。
# 加载时与 _registry.core.yaml 合并，同名场景 ID 本地优先覆盖核心。
#
# 使用方法:
#   1. 复制本文件: cp _registry.local.example.yaml _registry.local.yaml
#   2. 在 _registry.local.yaml 中添加自定义场景条目
#   3. 在 config/scenarios/ 下创建对应的 .yaml 场景文件
#   4. 运行 `redteam scenario list` 验证自定义场景可见
#
# 合并规则:
#   - 核心注册表 (_registry.core.yaml) 由项目仓库管理
#   - 本地注册表 (本文件) 由你管理，gitignored
#   - 相同 id 的条目：本地覆盖核心（用于定制化攻击参数）
#   - 不同 id 的条目：简单合并
#   - 冲突日志: WARNING 级别报告被覆盖的核心条目
#
# 字段说明 (与 _registry.core.yaml 一致):
#   id:             场景唯一标识符
#   name:           人类可读名称
#   target_type:    目标类型 (agent/rag/mcp/embeddings/supply_chain/infra/generic)
#   extends:        继承的父场景 ID，无继承则为 null
#   payload_sources: 引用的外部载荷库类别列表
#   ai300_chapters: 覆盖的 AI-300 章节
#   owasp_coverage: 覆盖的 OWASP LLM Top 10 类别
#   status:         状态: stable / experimental / deprecated
#   file:           对应的 YAML 文件名
# =============================================================================

version: "1.0.0"
last_updated: "2026-07-13"

# ── 本地自定义场景列表 ──
# 取消注释并修改以下示例来添加你的场景:

scenarios:
