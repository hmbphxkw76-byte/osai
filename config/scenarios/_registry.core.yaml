# =============================================================================
# RedTeam-AI 场景注册表 (Scenario Registry)
# =============================================================================
# 本文件是 config/scenarios/ 目录下所有场景的索引。
# 用于程序化发现和加载场景配置，便于动态扩展。
#
# 使用方式:
#   - 新增场景时，在 scenarios 列表中添加对应条目
#   - payload_loader 和 pipeline 读取本文件来发现可用场景
#   - 本文件同时作为场景之间的继承关系映射
#
# 字段说明:
#   id:             场景唯一标识符，对应 <id>.yaml 文件名
#   name:           人类可读名称
#   target_type:    目标类型 (agent/rag/mcp/embeddings/supply_chain/infra/generic)
#   extends:        继承的父场景 ID，无继承则为 null
#   payload_sources: 引用的外部载荷库类别列表
#   ai300_chapters: 覆盖的 AI-300 章节
#   owasp_coverage: 覆盖的 OWASP LLM Top 10 类别
#   status:         状态: stable（稳定）/ experimental（实验）/ deprecated（废弃）
#   file:           对应的 YAML 文件名
# =============================================================================

version: "1.1.0"
last_updated: "2026-07-13"

scenarios:
  # ── 基础场景 ──
  - id: generic_basic
    name: Generic Attack Scenario
    description: 通用攻击场景，作为其他场景的继承基类
    target_type: generic
    extends: null
    payload_sources: [llm01]
    ai300_chapters: ["Ch3"]
    owasp_coverage: [LLM01, LLM06, LLM07]
    status: stable
    file: generic.yaml

  # ── Agent 攻击场景 ──
  - id: agent_basic
    name: AI Agent Attack Scenario
    description: 针对 AI Agent 的综合攻击场景，继承 genoric 基础阶段
    target_type: agent
    extends: generic_basic
    payload_sources: [llm01, llm02, llm03, llm06, llm07]
    ai300_chapters: ["Ch3", "Ch4"]
    owasp_coverage: [LLM01, LLM02, LLM06, LLM07]
    status: stable
    file: agent.yaml

  # ── RAG 攻击场景 ──
  - id: rag_basic
    name: RAG Attack Scenario
    description: 针对 RAG 管道的知识库投毒、检索泄露、向量数据库攻击
    target_type: rag
    extends: null
    payload_sources: [llm01, llm04, llm05, llm07, llm08]
    ai300_chapters: ["Ch5"]
    owasp_coverage: [LLM04, LLM05, LLM06, LLM08]
    status: stable
    file: rag.yaml

  # ── MCP 攻击场景 ──
  - id: mcp_basic
    name: MCP Attack Scenario
