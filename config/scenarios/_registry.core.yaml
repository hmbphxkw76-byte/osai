  # ── 基础设施攻击场景 ──
  - id: infra_attack
    name: Infrastructure Attack Scenario
    description: 针对 LLM 基础设施和部署环境的攻击场景
    target_type: infra
    extends: null
    payload_sources: [llm05, llm10]
    ai300_chapters: ["Ch9"]
    owasp_coverage: [LLM02, LLM03, LLM04]
