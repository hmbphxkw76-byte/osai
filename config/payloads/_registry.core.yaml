# =============================================================================
# RedTeam-AI 载荷库注册表 (Payload Library Registry)
# =============================================================================
# 本文件是 config/payloads/ 目录下所有载荷文件的索引。
# 用于程序化发现和按需加载载荷，便于动态扩展。
#
# 使用方式:
#   - 新增载荷文件后，在对应 OWASP 类别下添加条目
#   - payload_loader 读取本文件来发现和加载载荷
#   - 场景通过 payload_sources.categories 按 OWASP 类别加载
#
# 字段说明:
#   owasp:           OWASP LLM Top 10 类别 (LLM01~LLM10)
#   technique_group: 技术组名称 (对应文件名)
#   description:     载荷文件描述
#   ai300_chapter:   覆盖的 AI-300 章节
#   payload_count:   载荷条目数量
#   status:          状态: stable / experimental / deprecated
#   file:            相对路径 (相对于 config/payloads/)
# =============================================================================

