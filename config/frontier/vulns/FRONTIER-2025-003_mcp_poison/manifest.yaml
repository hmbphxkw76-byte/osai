# ── 详细描述 ──
description: >
  通过恶意 MCP 工具注册和调用，诱导模型执行未授权操作。攻击者注册恶意工具并引导
  模型调用，实现数据窃取或系统命令执行。MCP 协议在设计上允许工具动态注册，若缺乏
  签名验证和权限限制，攻击者可注入伪装为合法工具的后门。真实案例：CVE-2026-40933
  (Flowise MCP 适配器命令注入，CVSS 10.0)。
  注意：本条目为通用技术模板，具体产品 CVE 见 CVE-2026-40933_mcp。

# ── 已知缓解措施 ──
known_mitigations:
  - "验证 MCP 工具来源和数字签名"
  - "限制工具权限和调用范围（最小权限原则）"
  - "审计所有工具调用日志"
  - "禁止 Agent 自动注册未签名的第三方工具"

