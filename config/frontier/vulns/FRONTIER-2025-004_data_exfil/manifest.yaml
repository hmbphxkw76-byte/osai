# ── 详细描述 ──
description: >
  通过诱导模型调用工具并将敏感数据作为工具参数或结果泄露至攻击者控制的外部端点。
  攻击者构造特殊指令，使模型在调用外部工具（webhook、邮件发送、API 调用）时
  将内部数据包含在请求中。此技术利用了 Agent 对工具调用的自主决策权，通过社会工程
  性提示使 Agent 自愿将数据发送到攻击者控制地址。
  注意：本条目为通用技术模板，真实案例参考 CVE-2025-32711 (EchoLeak in M365 Copilot)。

# ── 已知缓解措施 ──
known_mitigations:
  - "验证工具参数中的敏感数据模式（DLP 集成）"
  - "限制工具调用的目标地址白名单"
  - "加密传输敏感数据并实施出站流量审计"
  - "对工具调用参数实施最小权限输入验证"

