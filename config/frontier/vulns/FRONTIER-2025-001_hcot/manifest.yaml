# ── 详细描述 ──
description: >
  通过在提示词中嵌入隐形思考链，绕过护栏检测。攻击者在提示词中包含一系列中间思考步骤，
  但用编码或特殊字符隐藏，使模型在推理过程中绕过安全检查。H-CoT 利用了 LLM 的逐步推理
  机制，将恶意目标嵌入看似合理的推理链中，有效绕过输入过滤器和内容安全检测。

