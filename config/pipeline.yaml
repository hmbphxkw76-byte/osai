# RedTeam-AI 流水线配置文件 (AI-300 考试推荐模式)
# 使用方式: redteam run --config config/pipeline.yaml --target https://xxx --api-key sk-xxx
#
# 对齐 OffSec AI-300 8 阶段攻击链 (报告通过增量 ReportWriter 自动生成):
#   recon → injection → agent → multi_agent → rag → embeddings → supply_chain → infra

# === 目标配置 ===
target: ""  # 通过 CLI --target 参数传入
run_id: ""  # 留空自动生成

# === 攻击阶段 ===
# 按需注释不需要的阶段
phases:
  - recon
  - injection
  - agent
  - multi_agent
  - rag
  - embeddings
  - supply_chain
  - infra

# === 认证配置 ===
auth:
  # API Key 认证 (Bearer Token)
  bearer: ""  # 通过 CLI --api-key 参数传入
  # 或使用 F12 请求头
  header_file: ""
  header_text: ""

# === 高级设置 ===
settings:
  timeout: 30.0
  max_concurrent: 5
  generate_report: true

# === Payload 配置 ===
# 手动载荷覆盖（可选，覆盖 config/payloads/ 中的默认载荷）
payloads:
  # 考试期间可直接在此修改载荷内容
  injection: []  # 附加的提示注入载荷

# === 风险阈值 ===
risk_thresholds:
  cvss_critical: 9.0
  cvss_high: 7.0
  cvss_medium: 4.0

# === OWASP LLM Top 10 2025 覆盖率 ===
owasp_coverage:
  LLM01: "提示注入 (Prompt Injection)"
  LLM02: "敏感信息泄露 (Sensitive Information Disclosure)"
  LLM03: "供应链 (Supply Chain)"
  LLM04: "数据与模型投毒 (Data and Model Poisoning)"
  LLM05: "输出处理不当 (Insecure Output Handling)"
  LLM06: "过度代理 (Excessive Agency)"
  LLM07: "系统提示词泄露 (System Prompt Leakage)"
  LLM08: "向量与嵌入弱点 (Vector and Embedding Weaknesses)"
  LLM09: "错误信息 (Misinformation)"
  LLM10: "无限制消费 (Unbounded Consumption)"
